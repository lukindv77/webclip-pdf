name: audit-sync-p1-193-permission-user-gesture
on:
  push:
    paths:
      - '.github/workflows/audit-sync-20260826-p1-193-permission-user-gesture.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        run: |
          test "$(git rev-parse HEAD^)" = "371312bcf329b8daa6b5ab092c779f11abde13c1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-193-permission-user-gesture.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          text = priorities.read_text(encoding='utf-8')
          if '| P1-193 |' in text:
              raise SystemExit('P1-193 already exists')
          marker = '## Продолжение глубокого аудита 2026-08-26 — MV3 background-operation lifecycle ownership'
          if marker not in text:
              raise SystemExit('insertion marker not found')
          section = '''## Продолжение глубокого аудита 2026-08-26 — optional host permission user-gesture preservation\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-193 | P1 | OPEN | Popup flow выдачи optional host permission для cross-origin iframe не гарантирует, что `chrome.permissions.request()` вызывается пока ещё действует user gesture. Сейчас один click handler **до** request выполняет `getActiveSourceTab()` (`tabs.query`), затем `collectCrossOriginFrameOrigins()` → `scripting.executeScript` → `tabs.sendMessage` → нормализацию до 16 origins; каждый helper может ждать Chrome/RPC до 10 с. Только после всех этих async boundaries вызывается `permissions.request()`. Chrome требует `permissions.request()` именно из user gesture и внутри Chromium `PermissionsRequestFunction` fail-closed проверяет `user_gesture()`; transient activation конечна по времени, поэтому медленный discovery способен закончиться корректно, но сам prompt уже получить `User gesture required`/не стартовать. Это отдельный root cause от P1-157: P1-157 закрывает lifetime/unknown settlement **уже начатого** permission prompt, а здесь prompt может не получить admission. Нужен двухфазный gesture-safe UX: discovery/объяснение origins выполняются заранее без запроса; после этого отдельная явная кнопка `Предоставить доступ` первым activation-sensitive действием вызывает `permissions.request()` на уже подготовленном bounded наборе. Candidate set должен иметь короткий TTL и быть связан с исходной tab/document generation; navigation/закрытие/изменение кандидатов инвалидируют его, а после grant перед injection всё равно выполняется fresh document/permission validation по P1-171/P1-004. Не делать скрытый automatic permission request и не обходить browser prompt. Regression/real Chrome: искусственно задержать discovery > activation window — первый discovery click не пытается request; второй непосредственный grant click стабильно открывает prompt; stale candidate после navigation не используется. Реальный optional permission prompt/revoke остаётся release QA. |\n\n'''
          priorities.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          audit = Path('DEEP_AUDIT_2026-08-25.md')
          a = audit.read_text(encoding='utf-8')
          heading = '## Continuation 2026-08-26 — P1-193 optional host permission user gesture'
          if heading in a:
              raise SystemExit('audit section already exists')
          addition = '''\n\n## Continuation 2026-08-26 — P1-193 optional host permission user gesture\n\n- **P1-193 OPEN — asynchronous frame discovery occurs before the gesture-gated permission request.** The current popup click handler awaits active-tab lookup, top content-script injection and a content-script RPC that enumerates cross-origin frame origins before calling `chrome.permissions.request()`. Those steps are individually bounded but can consume much longer than transient user activation. Chrome's current permissions documentation requires `permissions.request()` from a user gesture; Chromium's implementation rejects the extension function when `user_gesture()` is false.\n- This is intentionally separate from P1-157. P1-157 already covers the opposite side of the boundary: once a permission request really starts, its user-owned prompt must not be treated as cancelled by a local `Promise.race` timeout. P1-193 is admission: slow prerequisite work can mean the prompt never starts at all.\n- Required direction: two-phase UI. First discover and display the bounded origin set. Then require a second explicit grant click whose first activation-sensitive operation is `permissions.request()` over a short-lived, source-bound candidate set. Navigation/document replacement invalidates the candidate generation; post-grant frame injection still revalidates current document and granted host permission.\n\nThis continuation is docs-only. Production source and `manifest.json` are unchanged; the previous product test gate was not rerun.\n'''
          audit.write_text(a.rstrip() + addition + '\n', encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/audit-sync-20260826-p1-193-permission-user-gesture.yml
      - name: Verify scope and manifest invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p1-193-permission-user-gesture.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
      - name: Commit docs-only sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record P1-193 permission gesture admission'
          git push origin HEAD:main
