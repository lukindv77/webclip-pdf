name: P1-231 S0-B PSL portability research

on:
  push:
    branches:
      - research/p1-231-s0b-source-generation-authority-2026-09-10

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: probe-${{ matrix.os }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p artifacts

      - name: Execute S0-B authority model
        shell: bash
        run: |
          set -o pipefail
          node --check project_tools/test_p1_231_s0b_source_generation_authority_source_spec_model.js
          node project_tools/test_p1_231_s0b_source_generation_authority_source_spec_model.js 2>&1 | tee artifacts/p1-231-s0b-authority-model.txt

      - name: Probe generator against exact Git blob
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/p1-231-s0b-psl-portability.txt
          from pathlib import Path
          import hashlib, os, subprocess, tempfile

          root = Path.cwd()
          git_blob = subprocess.run(
              ['git', 'cat-file', 'blob', 'HEAD:public-suffix.js'],
              cwd=root, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ).stdout
          working_tree = (root / 'public-suffix.js').read_bytes()
          source_git_blob = subprocess.run(
              ['git', 'cat-file', 'blob', 'HEAD:public_suffix_list.dat'],
              cwd=root, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ).stdout
          generator_git_blob = subprocess.run(
              ['git', 'cat-file', 'blob', 'HEAD:project_tools/build_public_suffix_js.py'],
              cwd=root, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ).stdout

          with tempfile.TemporaryDirectory(prefix='webclip-s0b-') as td:
              t = Path(td)
              (t / 'project_tools').mkdir()
              (t / 'public_suffix_list.dat').write_bytes(source_git_blob)
              (t / 'project_tools' / 'build_public_suffix_js.py').write_bytes(generator_git_blob)
              proc = subprocess.run(
                  ['python', str(t / 'project_tools' / 'build_public_suffix_js.py')],
                  cwd=t, check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              generated = (t / 'public-suffix.js').read_bytes()

          def sha(b): return hashlib.sha256(b).hexdigest()
          def count_crlf(b): return b.count(bytes([13,10]))
          def count_lf(b): return b.count(bytes([10]))
          print(f'platform={os.name}')
          print(f'generator_stdout={proc.stdout.strip()}')
          print(f'git_blob_bytes={len(git_blob)}')
          print(f'working_tree_bytes={len(working_tree)}')
          print(f'generated_bytes={len(generated)}')
          print(f'git_blob_sha256={sha(git_blob)}')
          print(f'working_tree_sha256={sha(working_tree)}')
          print(f'generated_sha256={sha(generated)}')
          print(f'working_tree_matches_git_blob={str(working_tree == git_blob).lower()}')
          print(f'generated_matches_git_blob={str(generated == git_blob).lower()}')
          print(f'generated_matches_working_tree={str(generated == working_tree).lower()}')
          print(f'git_blob_crlf={count_crlf(git_blob)}')
          print(f'working_tree_crlf={count_crlf(working_tree)}')
          print(f'generated_crlf={count_crlf(generated)}')
          print(f'git_blob_lf={count_lf(git_blob)}')
          print(f'working_tree_lf={count_lf(working_tree)}')
          print(f'generated_lf={count_lf(generated)}')
          PY

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p1-231-s0b-${{ runner.os }}-${{ github.sha }}
          path: |
            artifacts/p1-231-s0b-authority-model.txt
            artifacts/p1-231-s0b-psl-portability.txt
          retention-days: 7
          if-no-files-found: warn
