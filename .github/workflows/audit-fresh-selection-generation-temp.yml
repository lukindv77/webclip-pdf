name: Fresh selection-generation audit (temporary)

on:
  push:
    branches:
      - audit/restart-selection-generation-2026-09-01

permissions:
  contents: read

jobs:
  fresh-selection-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==5.9.0

      - name: Install pinned Chrome for Testing
        run: |
          mkdir -p .chrome
          curl -fsSLo .chrome/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip
          unzip -q .chrome/chrome.zip -d .chrome
          .chrome/chrome-linux64/chrome --version
          git rev-parse HEAD

      - name: C01 live selection versus durable snapshot physical probe
        env:
          CHROMIUM_BIN: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
        run: |
          python project_tools/audit_fresh_c01_selection_snapshot_cap.py

      - name: C02 SelectionSnapshot restore physical probe
        env:
          CHROMIUM_BIN: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
        run: |
          python project_tools/audit_selection_restore_physical_pdf.py

      - name: C03 Main Content physical probe
        env:
          CHROMIUM_BIN: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
        run: |
          python project_tools/audit_main_content_physical_pdf.py

      - name: PDF cache document/operation generation authority
        run: |
          python project_tools/audit_pdf_cache_generation_authority.py
