name: P1-231 package builder canonicalization research

on:
  push:
    branches:
      - research/p1-231-package-builder-canonicalization-2026-09-10

permissions:
  contents: read

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: research-${{ matrix.os }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'

      - name: Prepare diagnostics directory
        shell: bash
        run: mkdir -p artifacts

      - name: Syntax check builder canonicalization model
        shell: bash
        run: node --check project_tools/test_p1_231_package_builder_canonicalization_model.js

      - name: Execute builder canonicalization model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_p1_231_package_builder_canonicalization_model.js 2>&1 | tee artifacts/p1-231-package-builder-canonicalization-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p1-231-package-builder-canonicalization-${{ runner.os }}-${{ github.sha }}
          path: artifacts/p1-231-package-builder-canonicalization-output.txt
          retention-days: 7
          if-no-files-found: warn
