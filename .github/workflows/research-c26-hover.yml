name: Temporary C26 hover exclusion research

on:
  push:
    branches: [research/evidence-c26-hover-exclusion-2026-09-02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-c26-hover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-c26:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded probe dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4

      - name: Run fresh exact-source physical matrix
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome-stable
          C26_BASE_SHA: c5834ba0eb75fbf0ac1c637f42d7da1bff24b429
        run: python project_tools/research_c26_hover_exclusion.py --out "$RUNNER_TEMP/c26"
