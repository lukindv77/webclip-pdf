name: Publish WebClip 0.9.8 build release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release-v0.9.8-build-20260825-1442.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          cd builds/0.9.8
          sha256sum -c WebClip_PDF_Prototype_v0_9_8_build_2026-08-25_1442_github.zip.sha256

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.9.8-build-20260825-1442'
          ZIP='builds/0.9.8/WebClip_PDF_Prototype_v0_9_8_build_2026-08-25_1442_github.zip'
          SUM='builds/0.9.8/WebClip_PDF_Prototype_v0_9_8_build_2026-08-25_1442_github.zip.sha256'
          gh release create "$TAG" "$ZIP" "$SUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target 'a704b2a2ca9977c0515cec3fd7a6b5563be285e5' \
            --title 'WebClip 0.9.8 build 2026-08-25 14:42' \
            --prerelease \
            --notes $'Requested WebClip build published as a GitHub pre-release.\n\nManifest: MV3 / 0.9.8\nSource snapshot: a704b2a2ca9977c0515cec3fd7a6b5563be285e5\nBuild gate: 68/68 JavaScript syntax PASS; 55/55 deterministic tests PASS.\nArtifact SHA-256: cd40a7d248936015e629aaef134004ef14ee422230e54ffac6e912ceb29521a4\n\nThis publication does not bump the extension version and is not the 0.9.9 release-QA gate.'
