name: Research C45 Degraded Resource

on:
  push:
    branches: [research/evidence-c45-degraded-resource-2026-09-03]
    paths-ignore:
      - project_tools/.c45-degraded-result.json

permissions:
  contents: write

jobs:
  c45-degraded:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.16.2 PyMuPDF==1.28.2

      - name: Run exact-source physical degraded-resource matrix
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium unavailable' >&2
            exit 1
          fi
          "$chrome" --version
          export C45_SOURCE_BASELINE="$(git merge-base HEAD origin/main)"
          export C45_CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          set +e
          python project_tools/research_c45_degraded_resource_truth.py --chrome "$chrome" | tee "$RUNNER_TEMP/c45-degraded.log"
          status=${PIPESTATUS[0]}
          set -e
          result="$(grep '^C45_DEGRADED_RESULT_JSON=' "$RUNNER_TEMP/c45-degraded.log" | tail -n 1 | sed 's/^C45_DEGRADED_RESULT_JSON=//')"
          if [[ -n "$result" ]]; then
            printf '%s\n' "$result" > project_tools/.c45-degraded-result.json
            echo "::notice title=C45_DEGRADED_RESULT::$result"
          fi
          exit "$status"

      - name: Persist temporary exact result receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s project_tools/.c45-degraded-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c45-degraded-result.json
          git commit -m 'research: persist temporary C45 degraded result'
          git push origin HEAD:research/evidence-c45-degraded-resource-2026-09-03
