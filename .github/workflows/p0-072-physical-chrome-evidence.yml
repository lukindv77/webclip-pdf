name: P0-072 physical Chrome evidence

on:
  workflow_dispatch:
    inputs:
      canonical_sha:
        description: Exact canonical main SHA to execute
        required: true
        type: string
      authorization:
        description: Type P0-072-LOCAL-DOWNLOAD-ONLY to authorize this physical run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p0-072-physical-chrome-${{ inputs.canonical_sha }}
  cancel-in-progress: false

jobs:
  real-chrome-reset-restart:
    name: real-chrome-reset-restart
    if: ${{ github.ref == 'refs/heads/main' && inputs.authorization == 'P0-072-LOCAL-DOWNLOAD-ONLY' && inputs.canonical_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WEBCLIP_CANONICAL_SHA: ${{ inputs.canonical_sha }}
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.canonical_sha }}
          fetch-depth: 0

      - name: Verify exact source and browser
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "P0_072_CANONICAL_SHA=$actual"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$actual" = "$WEBCLIP_CANONICAL_SHA"
          test "$actual" = "$GITHUB_SHA"
          git diff --exit-code
          node project_tools/test_p0_072_real_chrome_reset_restart_harness.js
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chrome/Chromium binary available on runner" >&2
            exit 2
          fi
          echo "WEBCLIP_CHROME_FOR_TESTING=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Run existing real Chrome integration prerequisite
        shell: bash
        run: |
          set -euo pipefail
          # Existing P1-007 control is synthetic/localhost only. Its disposable
          # extension copy rewrites the Yandex API base to the local fixture.
          node project_tools/browser_p1_007_unpacked_integration.js

      - name: Run P0-072 real Chrome reset/restart harness
        shell: bash
        run: |
          set -euo pipefail
          node project_tools/research_p0_072_real_chrome_reset_restart.js
