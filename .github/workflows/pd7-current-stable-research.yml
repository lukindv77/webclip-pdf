name: PD7 current Stable research receipt

on:
  push:
    branches:
      - research/pd7-single-axis-scroll-stable-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pd7-current-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pd7-current-stable:
    name: pd7-current-stable-153.0.8010.36
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_VERSION: 153.0.8010.36
      CHROME_REVISION: r1681091
      CHROME_URL: https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chrome-linux64.zip
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install exact research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'playwright==1.55.0' \
            'pypdf==6.0.0'

      - name: Obtain exact Chrome for Testing Stable
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pd7-chrome" pd7-evidence
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$RUNNER_TEMP/pd7-chrome/chrome-linux64.zip" \
            "$CHROME_URL"
          unzip -q "$RUNNER_TEMP/pd7-chrome/chrome-linux64.zip" -d "$RUNNER_TEMP/pd7-chrome"
          chrome_bin="$RUNNER_TEMP/pd7-chrome/chrome-linux64/chrome"
          chmod +x "$chrome_bin"
          actual_version="$($chrome_bin --version)"
          printf '%s\n' "$actual_version" | tee pd7-evidence/chrome-version.txt
          printf 'expected_version=%s\nexpected_revision=%s\nsource_url=%s\n' \
            "$CHROME_VERSION" "$CHROME_REVISION" "$CHROME_URL" \
            >> pd7-evidence/chrome-version.txt
          printf '%s\n' "$actual_version" | grep -F "$CHROME_VERSION"
          sha256sum "$RUNNER_TEMP/pd7-chrome/chrome-linux64.zip" \
            "$chrome_bin" | tee pd7-evidence/chrome-sha256.txt
          python --version | tee pd7-evidence/python-version.txt
          python -m pip freeze | sort | tee pd7-evidence/python-dependencies.txt
          echo "chrome_bin=$chrome_bin" >> "$GITHUB_OUTPUT"

      - name: Run PD7 exact-target physical receipt
        id: pd7
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
          PD7_EVIDENCE_DIR: ${{ github.workspace }}/pd7-evidence
          PD7_RECEIPT_JSON: ${{ github.workspace }}/pd7-evidence/pd7-receipt.json
        run: |
          set -uo pipefail
          set +e
          python project_tools/research_pd7_single_axis_scroll.py \
            2>&1 | tee pd7-evidence/pd7-stdout.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" | tee pd7-evidence/harness-exit.txt
          printf 'commit=%s\nref=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee pd7-evidence/github-receipt.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload durable PD7 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pd7-current-stable-153.0.8010.36-${{ github.run_id }}-${{ github.run_attempt }}
          path: pd7-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve harness classification
        if: always()
        shell: bash
        run: |
          status='${{ steps.pd7.outputs.status }}'
          if [ -z "$status" ]; then
            echo 'PD7 harness did not produce a status.' >&2
            exit 1
          fi
          exit "$status"
