name: Research C36 finalize

"on":
  push:
    branches:
      - research/evidence-c36-resource-byte-generation-2026-09-02

permissions:
  contents: write

jobs:
  finalize_c36:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Finalize C36 baseline
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/.c36-finalize.py
          git rm .github/workflows/research-c36-finalize.yml project_tools/.c36-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m 'research: finalize fresh C36 evidence'
          git push origin HEAD:research/evidence-c36-resource-byte-generation-2026-09-02
