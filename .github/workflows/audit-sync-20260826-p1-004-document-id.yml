name: audit-sync-p1-004-document-id

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fa1d9e6f2f68f37ccb2416271fd26021b41f65b7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-004-document-id.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          lines = p.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| P1-004 |')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one P1-004 row, got {len(matches)}')
          old = lines[matches[0]]
          if '| P1 | REGRESSION |' not in old:
              raise SystemExit('P1-004 baseline status changed; refuse stale sync')
          lines[matches[0]] = "| P1-004 | P1 | PARTIAL | Cross-origin iframe поддерживаются через отдельный `frame-agent.js` только после optional host permission, явно выданного пользователем. Popup bounded-запрос (до 16 hosts за действие), service-worker проверяет `frameId > 0`, host permission и хранит `documentId`; top-frame сопоставляет inaccessible iframe по exact URL или единственному origin и при ambiguity fail-closed не активирует frame. Аудит обнаружил незакрытую document-identity гонку: `registerFrameAgent()` допускает пустой `sender.documentId`, `forwardFrameAgentState()` отклоняет mismatch только когда оба documentId непусты, а `sendFrameAgentCommand()` адресует `chrome.tabs.sendMessage` только по `{frameId}` и не использует сохранённый `documentId`. `tabs.onUpdated` очищает frame registry лишь при изменении URL top-level tab, поэтому навигация дочернего iframe может оставить stale record; новый `frame-agent.js` устанавливает message listener до завершения своей регистрации. На Chrome 118 `MessageSender.documentId` и `tabs.sendMessage(...,{documentId})` уже доступны: registration/state должны требовать непустой documentId и exact equality, outbound command должен быть fenced сохранённым documentId (и generation) так, чтобы reused `frameId` другого документа никогда не получил stale command; missing/mismatch/navigation должны fail-closed. Remote-области входят в `SelectionSnapshot v3`, prepare-print/resource stage и высоту iframe; same-origin iframe остаются в P0-003 path. Добавить deterministic/browser regression на child-frame navigation/reused frameId, late registration/command и missing documentId. Настоящий optional permission prompt/revoke/unpacked Chrome остаётся release QA. |"
          p = '\n'.join(lines) + ('\n' if p.endswith('\n') else '')
          marker = '## Continuation 2026-08-26 — P1-004 frame document identity fence'
          if marker in a:
              raise SystemExit('P1-004 document identity audit marker already present')
          a += "\n\n" + marker + "\n\nAudit baseline: `fa1d9e6f2f68f37ccb2416271fd26021b41f65b7`. Documentation-only sync; production runtime and manifest are unchanged, and the previously recorded product test gate was not rerun for this docs-only finding.\n\n**P1-004 remains incomplete.** The worker registry records a child frame `documentId`, but registration accepts an empty value, state forwarding only rejects a document mismatch when both values are present, and outbound `WEBCLIP_FRAME_AGENT_COMMAND` uses `chrome.tabs.sendMessage(..., { frameId })` without the recorded `documentId`. Child-frame navigation does not necessarily produce a top-tab `changeInfo.url`, so an old registry record can survive. A freshly injected frame agent installs its runtime command listener before its asynchronous registration settles; during that interval a stale record keyed only by reused `frameId` can authorize delivery to the new document. Chrome 118 already supports `MessageSender.documentId` and `tabs.sendMessage` targeting by `documentId`. Require non-empty exact document identity at register/state boundaries and target outbound commands to the recorded document (plus a registry generation/settlement fence as needed); absent, changed or stale document identity must fail closed. Add regression that navigates a child frame while keeping the top URL stable and proves a command authorized for the old document cannot reach the replacement document.\n"
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p1-004-document-id.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p1-004-document-id.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine P1-004 frame document identity fence'
          git push