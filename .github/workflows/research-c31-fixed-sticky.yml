name: Research C31 fixed sticky

on:
  push:
    branches: [research/evidence-c31-fixed-sticky-2026-09-02]
    paths-ignore:
      - project_tools/.c31-physical-result.json

permissions:
  contents: write

jobs:
  physical-c31:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0
      - name: Run exact-source physical C31 matrix
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'Chrome unavailable' >&2; exit 1; }
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          status=0
          python project_tools/research_c31_fixed_sticky.py --chrome "$chrome" --out "$RUNNER_TEMP/c31-pdfs" | tee "$RUNNER_TEMP/c31-result.log" || status=$?
          result="$(grep '^C31_RESULT_JSON=' "$RUNNER_TEMP/c31-result.log" | tail -n 1 | sed 's/^C31_RESULT_JSON=//')"
          [[ -n "$result" ]] || { echo 'C31 result JSON missing' >&2; exit "$status"; }
          printf '%s\n' "$result" > project_tools/.c31-physical-result.json
          echo "::notice title=C31_RESULT::$result"
          exit "$status"
      - name: Persist temporary exact result receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -s project_tools/.c31-physical-result.json ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c31-physical-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C31 physical result'
          git push origin HEAD:research/evidence-c31-fixed-sticky-2026-09-02
      - name: Assert C31 harness status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          true
