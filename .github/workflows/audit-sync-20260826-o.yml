name: audit-sync-20260826-o

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c0e1ed0c30c628e46d969583025711423b507b9c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-o.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-184' in p or 'P1-184' in a:
              raise SystemExit('P1-184 already exists; refuse duplicate sync')
          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — Yandex remote object/content proof\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-184 | P1 | OPEN | Unknown-settlement/retry подтверждение Yandex upload использует `remotePath + exact size` как доказательство результата, чего недостаточно для identity конкретного файла. В `uploadCachedRecordToYandex(... allowExisting=true)` WebClip делает GET exact path и при `type=file` + совпавшем `expectedPdfBytes` ставит `existingFileReused=true`, полностью пропуская передачу байтов; `resourceId` впервые узнаётся только после такого принятия/verify. Background `pendingRemoteSaves` recovery аналогично принимает файл по path+size и затем переводит checkpoint в `remote-verified`; Journal backup recovery также подтверждает path+size. При этом PDF filename timestamp имеет точность только до секунды, поэтому same-title/site операции могут получить одинаковый path; кроме того, файл может быть создан/заменён внешним клиентом. Same-size объект на том же path нельзя считать доказательством того, что это байты именно данной WebClip-операции. `overwrite=false` сохранить, но добавить stronger durable creation/content receipt: checkpoint должен связывать operation/expected bytes с локальным content digest или иным устойчивым fingerprint и с actual signed-transfer settlement receipt; после первого доказанного remote verify фиксировать `resourceId`. Recovery/reuse разрешать только при доказательстве конкретного объекта/содержимого, а не по размеру. Если реальный Yandex API/E2E подтвердит trustworthy remote checksum/immutable creation identity — использовать его; до этого не предполагать наличие такого поля и fail-closed при невозможности доказать identity. Охватить PDF retry, `pendingRemoteSaves` и Journal backup recovery. Не скачивать/принимать произвольный remote файл только для сравнения размера. |\n'''
          marker = '## Continuation at HEAD `c0e1ed0c30c628e46d969583025711423b507b9c` — Yandex remote object/content proof'
          if marker in a:
              raise SystemExit('Audit continuation already present')
          a += f'''\n\n{marker}\n\nNo production source changed. This pass compared the normal PDF upload, allow-existing retry, pending remote-save recovery, Journal backup upload/recovery and filename generation.\n\n### P1-184: path plus byte size is not object identity\n\nThe normal upload correctly requests a signed target with `overwrite=false`. However, the retry/reconciliation proof is weaker than the upload creation contract. In allow-existing mode WebClip reads the exact target path and, if it is a file whose byte count equals the cached PDF byte count, treats it as the prior successful upload and skips sending the cached PDF. The first durable `resourceId` is captured only after that decision. Background remote-save recovery follows the same path/type/size proof. Journal backup recovery also uses exact path plus exact size.\n\nThis can misattribute an unrelated object. PDF filenames include page title/site plus a timestamp only to the second, so two operations can target the same filename within one second; an external Yandex client can also create or replace content at the expected path. Equal byte length is not a content or creation proof. The consequence is a Journal/backup success state referring to a different object than the bytes WebClip intended to persist.\n\nThe fix should be implementation-neutral until real Yandex API verification is available. Store a local content digest/immutable expected fingerprint and an operation-scoped transfer receipt before/through the signed transfer; once a remote object is conclusively verified, persist its `resourceId`. If Yandex exposes a trustworthy checksum or immutable creation identity in the actual API account used by WebClip, adopt it only after real E2E confirmation. Otherwise recovery must remain fail-closed instead of accepting a path-size collision. This finding is distinct from P1-179 (account/root namespace identity) and P0-073/P0-074 (auth/account operation fencing).\n\n### Evidence note\n\nDocumentation-only audit sync. Product tests are not rerun. Last verified product gate remains P0-063: 88/88 JS syntax and 74/74 deterministic tests; real unpacked Chrome and real Yandex E2E remain release blockers.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-o.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-o.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Yandex remote proof audit finding'
          git push
