name: Mark P1-153 real verification
on:
  push:
    paths:
      - 'project_tools/mark_p1_153_real_verified.py'
      - '.github/workflows/mark-p1-153-verified.yml'
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real verification evidence
        run: python3 project_tools/mark_p1_153_real_verified.py
      - name: Verify docs-only change and commit
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- content.js service-worker.js manifest.json || { echo 'Product source unexpectedly changed'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f project_tools/mark_p1_153_real_verified.py .github/workflows/mark-p1-153-verified.yml
          git add P1-153_CLOSURE.md project_docs/PRIORITIES_P0_P1_P2.md QA_STATUS_0_9_9.md
          git commit -m 'docs: verify P1-153 on real its.1c.ru repro'
          git push origin HEAD:main
