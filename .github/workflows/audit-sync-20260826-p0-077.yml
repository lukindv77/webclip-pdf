name: audit-sync-20260826-p0-077

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0b7ae28eb81eb69e3465f571b0edf88a214d15a2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p0-077.yml"
      - name: Update audit registry
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P0-077' in p or 'P0-077' in a:
              raise SystemExit('P0-077 already exists; refuse duplicate sync')
          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — self-generated backup restore envelope\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P0-077 | P0 | OPEN | Собственный полный Journal backup может успешно сформироваться, но быть **неимпортируемым той же сборкой** из-за несовпадающих export/import envelopes. Export допускает `MAX_JOURNAL_EXPORT_TEXT_CHARS = 50 MiB` символов и отдельно `MAX_JOURNAL_EXPORT_BYTES = 64 MiB` UTF-8 bytes; для кириллицы/Unicode валидный export может иметь 50–64 MiB bytes. При этом local file staging и worker staged import жёстко отклоняют всё выше `MAX_JOURNAL_IMPORT_BYTES = 50 MiB` bytes. Второй mismatch: parser import ограничен `maxEntries: 100000`, но live `appendJournalEntry()` не имеет общего 100k cap, а export ограничен в основном chars/bytes/deadline и может сохранить >100k компактных entries. Требуется единый versioned **restore envelope** для live Journal, local export/import и Yandex backup/import: ни одна backup-копия, которую WebClip считает успешно созданной, не должна выходить за возможности импорта той же версии. Harmonize byte cap (либо export <= import, либо безопасно поднять import во всех путях) и entry-count policy; profiles уже выше нового лимита не удалять — предоставить явный migration/export path. Добавить deterministic boundary tests: high-Unicode backup с `chars <= 50 MiB`, но `bytes > 50 MiB`, и >100k малых entries; backup creation должна fail-closed **до remote/local success** либо результат обязан гарантированно re-import. Сохранить текущие storage preflight, parser depth/string/deadline limits и требование одного полного JSON-файла. |\n'''
          a += '''\n\n## Continuation 2026-08-26 — self-generated Journal backup must be restorable (P0-077)\n\nAudit source-of-truth baseline: `0b7ae28eb81eb69e3465f571b0edf88a214d15a2`. Documentation-only sync.\n\n### P0-077 OPEN — export envelope is larger than the restore envelope\n\nThe current full-Journal exporter tracks two independent ceilings: up to 50 MiB of JavaScript string characters (`MAX_JOURNAL_EXPORT_TEXT_CHARS`) and up to 64 MiB of actual UTF-8 Blob bytes (`MAX_JOURNAL_EXPORT_BYTES`). This means a valid Cyrillic/Unicode export can be larger than 50 MiB on disk while still being accepted and reported as a successful backup. Both restore entry points are narrower: `journal.js` rejects a selected local file when `file.size > 50 MiB`, while service-worker staged import rejects a manifest or accumulated chunks above `MAX_JOURNAL_IMPORT_BYTES = 50 MiB`. A 50–64 MiB self-generated backup is therefore outside the same build's restore contract.\n\nThere is a second independent envelope mismatch. Streaming JSON import is configured with `maxEntries: 100000`, while normal Journal append has no global 100k entry admission limit. The exporter batch loop is not capped at 100k entries; a sufficiently compact Journal can remain inside the byte/character ceiling, export successfully with more than 100k entries, and then fail its own import parser.\n\nBackup success is a data-durability promise. Define one versioned restore envelope shared by live admission, local export/import and Yandex backup/import. A successful backup must be provably accepted by the same version's restore path. Existing over-limit profiles must not be truncated or deleted; migration/export handling is required. Boundary regression should include Unicode data where encoded bytes exceed the import ceiling despite legal character count, plus a >100k compact-entry corpus.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p0-077.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p0-077.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Journal self-restore envelope finding'
          git push
