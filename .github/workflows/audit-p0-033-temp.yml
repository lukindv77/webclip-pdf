name: Audit P0-033 signed URL redaction temporary evidence

on:
  push:
    branches: [fix/p0-033-signed-yandex-log-redaction-2026-09-01]

permissions:
  contents: read

jobs:
  p0-033-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Run P0-033 deterministic regression
        run: |
          set -euo pipefail
          node --check operation-log-redaction-guard.js
          node --check journal-text-filter.js
          node project_tools/test_p0_033_signed_yandex_log_redaction.js
