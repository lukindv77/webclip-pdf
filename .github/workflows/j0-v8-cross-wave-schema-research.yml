name: J0 v8 cross-wave schema research

on:
  push:
    branches:
      - research/j0-v8-cross-wave-schema-package-2026-09-10

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare diagnostics directory
        run: mkdir -p artifacts

      - name: Syntax check deterministic model
        run: node --check project_tools/test_j0_v8_cross_wave_schema_package_model.js

      - name: Execute deterministic model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_j0_v8_cross_wave_schema_package_model.js 2>&1 | tee artifacts/j0-v8-cross-wave-schema-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: j0-v8-cross-wave-schema-${{ github.sha }}
          path: artifacts/j0-v8-cross-wave-schema-output.txt
          retention-days: 7
          if-no-files-found: warn
