name: Audit P0-023 PDF cache document generation temporary evidence

on:
  push:
    branches: [fix/p0-023-pdf-cache-document-generation-2026-09-01]

permissions:
  contents: read

jobs:
  p0-023-current-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Deterministic P0-023 regression
        run: |
          set -euo pipefail
          node --check pdf-cache-document-generation-guard.js
          node --check project_tools/test_p0_023_pdf_cache_document_generation.js
          node project_tools/test_p0_023_pdf_cache_document_generation.js
      - name: Current integration regression
        run: |
          set -euo pipefail
          node project_tools/test_p0_067_host_control_activation_guard.js
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Download Chrome for Testing 152
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cft"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cft/chrome.zip" https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/cft/chrome.zip" -d "$RUNNER_TEMP/cft"
          chmod +x "$RUNNER_TEMP/cft/chrome-linux64/chrome"
          "$RUNNER_TEMP/cft/chrome-linux64/chrome" --version
          echo "CHROME_BIN=$RUNNER_TEMP/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Chrome 152 same-URL reload proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-023-evidence"
          xvfb-run -a python project_tools/audit_p0_023_pdf_cache_document_generation.py --chrome "$CHROME_BIN" --output "$RUNNER_TEMP/p0-023-evidence"
