name: audit-sync-20260826-k

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6252ee799e9b6f6eba43f56a7cc0bba20150bfd5"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-k.yml"
      - name: Append confirmed host-page trust finding
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P0-075' in p or 'P0-075' in a:
              raise SystemExit('P0-075 already exists; refuse duplicate sync')
          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — host-page/content-script DOM trust boundary\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P0-075 | P0 | OPEN | WebClip content UI и selection state недостаточно изолированы от hostile host page DOM. `content.js` создаёт предсказуемый `#webclip-pdf-extension-root` и `attachShadow({mode:'open'})`; комментарий пользователя — обычный `<textarea>` внутри этого open shadow root. Скрипт страницы может получить `host.shadowRoot` и прочитать введённый комментарий до сохранения. Include/Exclude дополнительно маркируются долгоживущими обычными атрибутами `data-webclip-pdf-include/exclude` на DOM страницы; cross-origin `frame-agent.js` делает то же через `data-webclip-remote-include/exclude`, поэтому сайт/iframe видит точный пользовательский выбор и timing. Риск не только disclosure: selection listener и WebClip UI buttons не требуют `Event.isTrusted`; hostile page во время активной WebClip session может синтетически вызвать click на page element, изменить extension selection, а через доступный open shadow root вызвать `.click()` на extension-owned action button. Callback content script после этого имеет право отправлять privileged runtime commands, то есть shared DOM становится confused-deputy control channel из page world в extension workflow. Нужно убрать page-readable sensitive UI (минимум closed shadow + случайный/non-discoverable host недостаточен как единственная защита), не хранить live selection semantics в page-visible attrs дольше необходимой print-фазы, принимать user-authorizing UI/selection actions только из trusted input (`event.isTrusted`) с явным extension state/gesture gate и не полагаться на DOM secrecy. Print-only markers должны иметь минимальное lifetime/rollback, а page mutation не должна менять authoritative Maps/snapshot. Добавить hostile-page regression: чтение comment, synthetic selection, synthetic Save/Upload clicks и mutation/remove attrs должны fail-closed. |\n'''
          a += '''\n\n## Continuation 2026-08-26 — P0-075 host-page DOM trust boundary\n\nSource-of-truth baseline: `6252ee799e9b6f6eba43f56a7cc0bba20150bfd5`. This sync changes audit documentation only.\n\n### Source evidence\n\n- `content.js` uses the deterministic host id `webclip-pdf-extension-root`, attaches `shadow = host.attachShadow({ mode: 'open' })`, and creates the file-comment textarea inside that shadow tree. An ordinary page script can discover that host and traverse an open shadow root; the isolated JavaScript world is not a private DOM storage mechanism.\n- Selection ownership is mirrored into the shared page DOM using `element.setAttribute('data-webclip-pdf-include', id)` / `data-webclip-pdf-exclude`; frame-agent uses analogous remote attributes. They remain present throughout live selection and are removed only when selections are cleared. A page MutationObserver can therefore observe the extension interaction.\n- `onPageClick()` consumes page click events while selecting but has no `event.isTrusted` gate. `createUiButton()` registers a click listener that simply stops propagation and invokes the privileged callback, also without checking trusted user input. A host-page script can dispatch/call synthetic clicks. With the open shadow root it can directly reach Save/Yandex controls; selection itself is also steerable through synthetic clicks on host DOM.\n- Chrome's content-script isolated world separates JavaScript environments, not the fact that content scripts read and modify the web page DOM. Chrome security guidance explicitly treats hostile pages as able to manipulate DOM used by content scripts.\n\n### Required security model\n\nTreat every host-page DOM node/event/attribute as attacker-controlled input. User-authorizing actions must require trusted physical input and extension-owned state, not merely an event listener attached from an isolated world. Sensitive temporary input such as the file comment must not be readable through a page-accessible open shadow tree. Authoritative selection should live in extension memory/overlay structures; if DOM markers are unavoidable for print CSS, materialize them only for the shortest print preparation window with exact rollback and do not use page-mutated marker values as authority.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-k.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-k.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf '%s\n' "${changed[@]}"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record host-page DOM trust boundary finding'
          git push
