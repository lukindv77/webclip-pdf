name: audit-sync-20260826-k

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2e66a580ebbeb998c337fc4b4f613dfd046662cb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-k.yml"
      - name: Update audit registry
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-182' in p or 'P1-182' in a:
              raise SystemExit('P1-182 already exists; refuse duplicate sync')

          def replace_row(text, prefix, replacement):
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'Expected one row {prefix!r}, got {len(hits)}')
              lines[hits[0]] = replacement
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          p = replace_row(
              p,
              '| P0-066 |',
              '| P0-066 | P0 | OPEN | Единая confidentiality-boundary отсутствует не только у source URL, но и у других durable URL-bearing metadata. Live save передаёт `location.href`, PDF header печатает полный URL, import/Journal normalization в основном снимает только fragment; дополнительно `sanitizeSelectionSnapshot()` сейчас сохраняет locator `href/src` простым `.slice(...)` без secret sanitizer. Поэтому URL userinfo (`user:password@`), credential-like query/fragment (`access_token`, OAuth code, token/signature и т.п.), presigned CDN URL и non-durable `data:`/`blob:` значения могут попасть в PDF, Journal, export и Yandex backup через source URL **или selection snapshot**. Нужен один canonical durable/display URL sanitizer для source URL, locator `href/src`, imported/public URL и будущих durable resource URL: удалять userinfo/fragment, redact/drop известные secret query keys, сохранять обычные несекретные query; locator должен reject/drop active/local/non-durable schemes вместо их сохранения. Imported/opened Yandex public URL также должен reject userinfo. |'
          )
          p = replace_row(
              p,
              '| P0-075 |',
              '| P0-075 | P0 | OPEN | WebClip content UI и selection state недостаточно изолированы от hostile host page DOM. `content.js` создаёт предсказуемый `#webclip-pdf-extension-root` и `attachShadow({mode:\'open\'})`; комментарий пользователя — обычный `<textarea>` внутри этого open shadow root. Скрипт страницы может получить `host.shadowRoot` и прочитать введённый комментарий. Даже переход на closed shadow сам по себе недостаточен: перед PDF тот же `fileComment` копируется в print header, который вставляется обычным DOM-узлом в `document.body`, поэтому page `MutationObserver` может прочитать секрет в print window; DOM keyboard/input events также нельзя считать приватными только из-за shadow boundary. Include/Exclude маркируются долгоживущими `data-webclip-pdf-include/exclude`, а `frame-agent.js` — `data-webclip-remote-include/exclude`, раскрывая точный выбор/timing. Риск также control-plane: selection listener и WebClip UI buttons не требуют `Event.isTrusted`; hostile page во время активной session может synthetic-click менять selection и через доступный UI запускать extension-owned workflow, после чего content script отправляет privileged runtime команды. Sensitive user input нельзя помещать в host-page-readable DOM вообще; authoritative selection не должна зависеть от page-visible attrs. User-authorizing UI/selection actions требуют trusted-input/extension-state gate; print-only markers — минимальный lifetime/rollback. Добавить hostile-page regression: comment/print-header disclosure, synthetic selection/save/upload и mutation/remove attrs должны fail-closed. |'
          )

          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — locator privacy / hidden surrounding text\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-182 | P1 | OPEN | `SelectionSnapshot v3` ради устойчивого restore сохраняет plaintext контекст **за пределами выбранного элемента**: locator creation записывает `parentText`, `previousText`, `nextText` (а также собственный element text/ARIA/name/title), `sanitizeSelectionSnapshot()` сохраняет эти строки, после чего snapshot попадает в Journal и полный export/Yandex backup. Пользователь может выбрать один небольшой блок, но durable backup скрыто унесёт текст родителя/соседних DOM-узлов, который пользователь не выбирал и который может содержать чувствительные данные. Сохранить качество restore без raw surrounding-content retention: заменить окружающий plaintext на privacy-preserving/versioned fingerprints (например, bounded hashes/token hashes/структурные признаки), мигрировать/читать legacy snapshot без повторного расширения утечки и не отправлять raw neighbor text в новые backups. Нужны regression tests, что restore confidence сохраняется на DOM insertion/ambiguity cases P1-001, а новый export не содержит соседний plaintext. |\n'''

          marker = '## Continuation at HEAD `2e66a580ebbeb998c337fc4b4f613dfd046662cb` — locator confidentiality and surrounding-text minimization'
          if marker in a:
              raise SystemExit('Audit continuation already present')
          a += f'''\n\n{marker}\n\nNo production source changed in this continuation. Current source review confirmed two confidentiality extensions and one new privacy finding.\n\n### P0-066 scope expands to every durable URL-bearing field\n\n`sanitizeSelectionSnapshot()` currently copies locator `src` and `href` with length limits only. Those locators originate from selected DOM attributes and are persisted inside Journal entries, exports and Yandex backups. Consequently a page-level signed URL, credential-like query value, URL userinfo, `data:` fragment or `blob:` identifier can bypass a future source-URL-only sanitizer. P0-066 therefore requires one reusable canonical sanitizer at every durable URL boundary, with locator-specific scheme restrictions. The existing resource-report redaction does not protect locator fields.\n\n### P0-075 also includes the print-header disclosure window\n\nThe content UI uses an open shadow tree, but closing that tree would not fully solve the confidentiality issue. During PDF preparation `fileComment` is rendered into the WebClip print header and that header is inserted into the host document body. A hostile page can observe light-DOM insertion and read the comment before `Page.printToPDF` completes. Sensitive extension input must remain outside host-page-observable DOM across the entire workflow, including the temporary print representation. Chrome documents that content scripts have an isolated JavaScript world while still reading and modifying the page DOM; isolated-world variable separation is not a DOM confidentiality boundary.\n\n### P1-182: locator robustness currently retains unselected surrounding plaintext\n\nTop-frame locator creation records bounded `parentText`, previous-sibling text and next-sibling text as restore fingerprint material. The worker sanitizer retains those strings and the normal Journal/export pipeline retains the selection snapshot. This means the backup data set can include neighboring content never selected for capture. A replacement fingerprint must remain useful for P1-001 confidence/ambiguity scoring but should not reconstruct the original surrounding text. A versioned one-way representation is preferable to raw text; legacy snapshots remain readable for compatibility but new writes should stop expanding this hidden plaintext corpus.\n\n### Evidence and test note\n\nThis is a documentation-only audit sync. Product tests are not rerun by this workflow. The last verified product gate remains the P0-063 gate (88/88 syntax, 74/74 deterministic tests); unmanaged unpacked Chrome and real Yandex E2E remain release blockers.\n'''

          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-k.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-k.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf '%s\n' "${changed[@]}"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: expand URL confidentiality and record locator privacy finding'
          git push
