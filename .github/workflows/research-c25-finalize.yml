name: Research C25 finalize

on:
  push:
    branches: [research/evidence-c25-top-layer-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c25:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance C25 baseline and remove temporary evidence plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = p.read_text(encoding='utf-8')
          old = '| C25 | Dialog / popover / top layer | `NOT-TRIAGED / UNKNOWN` |'
          new = '| C25 | Dialog / popover / top layer | `L4-REVALIDATED / FINDING + POSITIVE/AUTO-LIGHT-DISMISS/MANUAL/MODAL/CLOSED/FRAME/CAUSAL CONTROLS (P0-075, P0-070, P1-187; P0-004 supporting)` |'
          if old not in text:
              raise SystemExit('C25 baseline row did not match expected current text')
          text = text.replace(old, new, 1)
          checkpoint = '''

## Fresh continuation checkpoint — focused C25 Dialog / popover / top layer

`RESEARCH_FULL_RESTART_C25_TOP_LAYER_2026-09-02.md` records the fresh C25 exact-source physical tranche on canonical source `6e61f8db7b77737c34a8290cea11bc8b8aff51e6`, exact `content.js` blob `f3ee7b51fe9ee94fdfe36e8a7c99f14a548fdc4e` and Google Chrome `151.0.7922.173`.

Fresh top-document controls distinguish browser semantics from WebClip drift. An open selected `popover=auto` physically prints with its backdrop when no trusted review click intervenes, but the real trusted WebClip `Готово` click light-dismisses it before render; save still proceeds and the selected token/backdrop disappear. The same click leaves `popover=manual` open and printable. A page `dialog.showModal()` keeps its own modal/backdrop state but makes WebClip's same-document Finish UI inert; test-only forced preparation proves Chromium can physically print that admitted modal state. Corrected closed-state and genuinely-marked Exclude controls both pass.

Fresh same-origin BODY flattening independently revalidates **P1-187 ACTIVE**. Source popover starts `:popover-open=true`; the final proxy contains the popover text but `:popover-open=false`, and native child backdrop signal falls from `472830` blue pixels to `0`. Test-only top-layer re-entry on the connected final proxy restores about `388963` backdrop pixels while keeping Exclude omitted.

Accepted case-level execution: workflow run `33610993477`, job `100185833170`, exact head `040bee0dc466e9dec376405de6e0b48c9f7feb50`, SUCCESS, raw result SHA-256 `940b81c1b1ae52c0e7e1808e84daaa10e27605a36d4510989f758192d1fc732f`. Accepted final controls: run `33611864788`, job `100188651541`, exact head `c2bea7a0bf0d0454d55cb23ca570e0134cff44ad`, SUCCESS, raw result SHA-256 `1af09abbf1b44d257dc420d55a84791874c341506d81e644541a02fa4de8cc48`.

Duplicate/root-cause reconciliation maps C25 to existing **P0-075 / P0-070 / P1-187 ACTIVE**, with **P0-004 ACTIVE** supporting physical selected-copy consequences. No new P-code or Registry status/writing change is warranted. C25 therefore advances to `L4-REVALIDATED / FINDING + POSITIVE/AUTO-LIGHT-DISMISS/MANUAL/MODAL/CLOSED/FRAME/CAUSAL CONTROLS (P0-075, P0-070, P1-187; P0-004 supporting)`. C26 — Hover exclusion — is the next sequential coordinate.
'''
          anchor = '\n## Delivery rule\n'
          if anchor not in text:
              raise SystemExit('Delivery rule anchor missing')
          text = text.replace(anchor, checkpoint + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm -f .github/workflows/research-c25-finalize.yml
          for f in \
            project_tools/.c25-capture-result.json \
            project_tools/.c25-exclude-result.json \
            project_tools/.c25-final-controls-result.json \
            project_tools/.c25-physical-result.json \
            project_tools/research_c25_top_layer_exclude.py; do
            if [[ -e "$f" ]]; then git rm -f "$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m 'research: finalize fresh C25 top-layer evidence'
          git push origin HEAD:research/evidence-c25-top-layer-2026-09-02
