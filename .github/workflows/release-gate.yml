name: Release gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Git commit SHA to evaluate
        required: true
        type: string
      candidate_version:
        description: Exact manifest version expected for this candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "Release candidate checkout: $actual"

      - name: Repository consistency
        run: python project_tools/check_repository_consistency.py

      - name: CI action pinning
        run: python project_tools/check_ci_pins.py

      - name: CI pinning self-test
        run: python project_tools/test_ci_pins.py

      - name: PR change contract structure
        run: python project_tools/check_pr_change_contract.py

      - name: PR change contract self-test
        run: python project_tools/test_pr_change_contract.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Deterministic JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test in project_tools/test_*.js; do
            echo "==> $test"
            node "$test"
            count=$((count + 1))
          done
          echo "Executed $count deterministic test files."

      - name: Recovery artifact provenance self-test
        run: python project_tools/test_recovery_archive.py

      - name: Release readiness — fail closed
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/check_release_readiness.py gate \
            --expected-sha "$CANDIDATE_SHA" \
            --expected-version "$CANDIDATE_VERSION"

# This workflow intentionally does not build, tag, publish, upload, mutate Releases,
# or write repository contents. READY is only a precondition for a separate explicit
# release action/decision.
