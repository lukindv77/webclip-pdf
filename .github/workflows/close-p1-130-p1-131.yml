name: Close P1-130 and P1-131

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-p1-130-p1-131.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited patch
        run: python3 project_tools/_close_p1_130_131.py

      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 77
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 64
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          git diff --check

      - name: Commit closure and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/close-p1-130-p1-131.yml project_tools/_close_p1_130_131.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: bound Chrome Action and global debugger settlements (P1-130 P1-131)'
          git push origin HEAD:main
