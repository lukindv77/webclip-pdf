name: Audit Cycle2 final reconciliation temporary guard

on:
  push:
    branches: [audit/cycle2-final-reconciliation-2026-09-01]

permissions:
  contents: read

jobs:
  cycle2-final-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Run final Cycle2 guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile project_tools/audit_cycle2_coverage_sweep.py project_tools/audit_cycle2_final_reconciliation.py
          python project_tools/audit_cycle2_coverage_sweep.py
          python project_tools/audit_cycle2_final_reconciliation.py
