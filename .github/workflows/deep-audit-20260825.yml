name: Deep architecture audit 2026-08-25
on:
  push:
    paths:
      - '.github/workflows/deep-audit-20260825.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository inventory and static risk scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          roots=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.parts[0]=='project_tools': continue
              if p.suffix.lower() in {'.js','.html','.json'}: roots.append(p)
          print('AUDIT_FILES', len(roots))
          for p in sorted(roots, key=lambda x:x.stat().st_size, reverse=True):
              print('SIZE', p.stat().st_size, str(p))
          patterns={
            'fetch':r'\bfetch\s*\(',
            'abort_controller':r'new\s+AbortController\s*\(',
            'chrome_api':r'\bchrome\.[A-Za-z0-9_.]+\s*\(',
            'runtime_send':r'chrome\.runtime\.sendMessage\s*\(',
            'tabs_send':r'chrome\.tabs\.sendMessage\s*\(',
            'execute_script':r'chrome\.scripting\.executeScript\s*\(',
            'downloads_download':r'chrome\.downloads\.download\s*\(',
            'storage_write':r'chrome\.storage\.(?:local|session)\.(?:set|remove|clear)\s*\(',
            'set_interval':r'\bsetInterval\s*\(',
            'set_timeout':r'\bsetTimeout\s*\(',
            'event_listener':r'\.addEventListener\s*\(',
            'chrome_listener':r'\.addListener\s*\(',
            'new_map_set':r'new\s+(?:Map|Set)\s*\(',
            'inner_html':r'\.innerHTML\s*=',
            'json_stringify':r'JSON\.stringify\s*\(',
            'query_all_spread':r'\[\.\.\.[^\n]{0,120}querySelectorAll\s*\(',
            'array_from_query':r'Array\.from\s*\([^\n]{0,120}querySelectorAll\s*\(',
            'promise_all':r'Promise\.all\s*\(',
            'eval_like':r'\b(?:eval|Function)\s*\(',
            'object_url':r'URL\.(?:createObjectURL|revokeObjectURL)\s*\(',
          }
          for label,pat in patterns.items():
              print('\n###',label)
              rx=re.compile(pat)
              count=0
              for p in roots:
                  text=p.read_text('utf-8',errors='replace')
                  for n,line in enumerate(text.splitlines(),1):
                      if rx.search(line):
                          count+=1
                          print(f'{p}:{n}: {line.strip()[:260]}')
              print('COUNT',label,count)
          # Direct awaited Chrome API calls which deserve manual deadline review.
          print('\n### awaited_chrome_calls')
          rx=re.compile(r'\bawait\s+chrome\.[A-Za-z0-9_.]+\s*\(')
          for p in roots:
              for n,line in enumerate(p.read_text('utf-8',errors='replace').splitlines(),1):
                  if rx.search(line): print(f'{p}:{n}: {line.strip()[:300]}')
          # Long-lived mutable collections and timer handles.
          print('\n### globals_maps_sets_timers')
          rx=re.compile(r'^(?:const|let)\s+[A-Za-z0-9_$]+\s*=\s*(?:new\s+(?:Map|Set)|null|0)')
          for p in roots:
              if p.suffix!='.js': continue
              for n,line in enumerate(p.read_text('utf-8',errors='replace').splitlines(),1):
                  if rx.search(line): print(f'{p}:{n}: {line.strip()[:240]}')
          # Registry maxima.
          reg=Path('project_docs/PRIORITIES_P0_P1_P2.md').read_text('utf-8')
          for pref in ('P0','P1','P2'):
              ids=[int(x) for x in re.findall(rf'\b{pref}-(\d{{3}})\b',reg)]
              print('REGISTRY_MAX',pref,max(ids) if ids else 0)
          PY
      - name: Baseline JS syntax and deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t js < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for f in "${js[@]}"; do node --check "$f"; done
          echo "JS_GATE ${#js[@]}/${#js[@]}"
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          for f in "${tests[@]}"; do node "$f" >/dev/null; done
          echo "TEST_GATE ${#tests[@]}/${#tests[@]}"
