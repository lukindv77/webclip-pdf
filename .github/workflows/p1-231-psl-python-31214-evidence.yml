name: P1-231 PSL Python 3.12.14 portability evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1-231-psl-python-31214-evidence.yml'
      - 'project_tools/check_p1_231_psl_portability.py'
      - 'project_tools/build_public_suffix_js.py'
      - 'public_suffix_list.dat'
      - 'public-suffix.js'

permissions:
  contents: read

jobs:
  portability:
    name: p1-231-psl-python-31214-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up exact CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Regenerate exact PSL output from Git blobs
        run: python project_tools/check_p1_231_psl_portability.py --expected-sha "${{ github.event.pull_request.head.sha }}"
