name: Fresh C04-C15 render audit

on:
  push:
    branches: [audit/fresh-c04-c15-render-fidelity-2026-09-01]

permissions:
  contents: read

concurrency:
  group: fresh-c04-c15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-render-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 PyMuPDF==1.26.4

      - name: Install Chrome for Testing 152
        run: |
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip \
            --output /tmp/chrome-linux64.zip
          unzip -q /tmp/chrome-linux64.zip -d /tmp/chrome-for-testing
          /tmp/chrome-for-testing/chrome-linux64/chrome --version

      - name: Apply runner-only harness compatibility adjustments
        run: |
          python - <<'PY'
          from pathlib import Path
          fresh = Path('project_tools/audit_fresh_c04_c15_render_fidelity.py')
          text = fresh.read_text(encoding='utf-8')
          text = text.replace("'SVG_C10_MARKER',", "")
          text = text.replace("'C10InlineSvg':art['pixels']['magenta']>100 and 'SVG_C10_MARKER' in text", "'C10InlineSvg':art['pixels']['magenta']>100")
          fresh.write_text(text, encoding='utf-8')

          p071 = Path('project_tools/audit_p0_071_print_render_guard.py')
          text = p071.read_text(encoding='utf-8')
          old = 'if "importScripts(\'pdf-print-guard.js\')" not in bootstrap:'
          new = 'if "\'pdf-print-guard.js\'" not in bootstrap:'
          if old not in text:
              raise SystemExit('P0-071 compatibility anchor missing')
          p071.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Fresh C04-C15 physical render probe
        env:
          CHROME_BIN: /tmp/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -o pipefail
          mkdir -p /tmp/webclip-fresh-c04-c15
          python project_tools/audit_fresh_c04_c15_render_fidelity.py \
            --chrome "$CHROME_BIN" \
            --output /tmp/webclip-fresh-c04-c15 \
            | tee /tmp/webclip-fresh-c04-c15/stdout.json

      - name: Fresh P0-071 actual render-cut control
        env:
          CHROME_BIN: /tmp/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -o pipefail
          mkdir -p /tmp/webclip-p0-071
          python project_tools/audit_p0_071_print_render_guard.py \
            --chrome "$CHROME_BIN" \
            --output /tmp/webclip-p0-071 \
            | tee /tmp/webclip-p0-071/results.json

      - name: Upload bounded audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-c04-c15-render-results
          path: |
            /tmp/webclip-fresh-c04-c15/results.json
            /tmp/webclip-fresh-c04-c15/*.pdf
            /tmp/webclip-p0-071/results.json
            /tmp/webclip-p0-071/*.pdf
          if-no-files-found: warn
          retention-days: 7
