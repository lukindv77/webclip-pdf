name: Research C25 top layer

on:
  push:
    branches: [research/evidence-c25-top-layer-2026-09-02]
    paths-ignore:
      - project_tools/.c25-exclude-result.json

permissions:
  contents: write

jobs:
  physical-c25:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4
      - name: Run focused C25 top-layer Exclude control
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'Chrome unavailable' >&2; exit 1; }
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          python project_tools/research_c25_top_layer_exclude.py --chrome "$chrome" --out "$RUNNER_TEMP/c25-exclude-pdfs" | tee "$RUNNER_TEMP/c25-exclude.log"
          result="$(grep '^C25_EXCLUDE_JSON=' "$RUNNER_TEMP/c25-exclude.log" | tail -n 1 | sed 's/^C25_EXCLUDE_JSON=//')"
          [[ -n "$result" ]] || { echo 'C25 exclude result missing' >&2; exit 1; }
          printf '%s\n' "$result" > project_tools/.c25-exclude-result.json
          echo "::notice title=C25_EXCLUDE_RESULT::$result"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c25-exclude-result.json
          git commit -m 'research: persist temporary C25 exclude result'
          git push origin HEAD:research/evidence-c25-top-layer-2026-09-02
