name: Audit P0-048 committed local download identity evidence temporary

on:
  push:
    branches:
      - fix/p0-048-local-download-identity-2026-09-01

permissions:
  contents: read

jobs:
  p0-048-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Verify P0-048 identity closure
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check local-download-identity.js
          node project_tools/test_p0_048_local_download_identity.js
          git diff --check
