name: P1-231 S0-A package authority research

on:
  push:
    branches:
      - research/p1-231-s0a-package-authority-source-spec-2026-09-10

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'

      - name: Prepare diagnostics
        run: mkdir -p artifacts

      - name: Syntax check model
        run: node --check project_tools/test_p1_231_s0a_package_authority_source_spec_model.js

      - name: Execute model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_p1_231_s0a_package_authority_source_spec_model.js 2>&1 | tee artifacts/p1-231-s0a-package-authority-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p1-231-s0a-package-authority-${{ github.sha }}
          path: artifacts/p1-231-s0a-package-authority-output.txt
          retention-days: 7
          if-no-files-found: warn
