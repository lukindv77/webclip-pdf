name: audit-sync-p1-090-post-move-identity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "62635849953ae4bb8a17b05043742dc59b8d5b88"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-090-post-move-identity.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          lines = p.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| P1-090 |')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one P1-090 row, got {len(matches)}')
          old = lines[matches[0]]
          if '| P1 | REGRESSION |' not in old:
              raise SystemExit('P1-090 baseline status changed; refuse stale sync')
          lines[matches[0]] = "| P1-090 | P1 | PARTIAL | Yandex Journal identity/locator contract уже хранит `accountUid + rootPath + resourceId + publicUrl + remotePath`, а pre-move `findYandexFileForJournalEntry()` при известном `resourceId` не принимает совпадение одного path как identity proof. Аудит обнаружил незакрытую вторую половину того же contract: после destructive `resources/move` и Trash, и `ReadmeLater → Upload` циклы verify запрашивают target `name/path/type/size/public_url/resource_id`, но считают результат доказанным сразу при `moved.type === 'file'`. `resource_id` исходного объекта с target не сравнивается, исчезновение/identity source после timeout не проверяется. При unknown settlement либо внешней гонке на target path посторонний файл может быть принят как результат операции; mark-read затем способен записать его `resourceId/publicUrl` в Journal, а delete→Trash — считать move успешным и удалить локальную entry, хотя исходный объект не доказанно перемещён. Перед POST snapshot immutable expected object identity из найденного source; post-move reconciliation обязан exact-сопоставить target с тем же `resourceId` (legacy `publicUrl` только по уже принятому secondary rule при реально отсутствующем API `resource_id`) и при unknown settlement дополнительно проверить source/target pair, чтобы отличить завершённый move от target collision/no-move. Никогда не усыновлять новый target `resourceId/publicUrl` только по path/type. Durable Trash checkpoint P1-183 должен хранить/проверять ту же identity; public-link lifecycle P0-069 остаётся отдельным обязательным gate. Добавить deterministic mocked-Yandex regression: другой `resourceId` на target после timeout = fail-closed с сохранённым checkpoint/entry; exact исходный `resourceId` на target = разрешённая финализация. Реальный Yandex move E2E остаётся release QA. |"
          p = '\n'.join(lines) + ('\n' if p.endswith('\n') else '')
          marker = '## Continuation 2026-08-26 — P1-090 post-move object identity proof'
          if marker in a:
              raise SystemExit('P1-090 post-move marker already present')
          a += "\n\n" + marker + "\n\nAudit baseline: `62635849953ae4bb8a17b05043742dc59b8d5b88`. Documentation-only sync; production runtime and manifest are unchanged, and the previously recorded product test gate was not rerun for this docs-only finding.\n\n**P1-090 is PARTIAL, not fully regression-closed.** Pre-move Yandex lookup already applies the stronger Journal object identity contract, but both destructive move completion paths weaken it at the target: Trash and `ReadmeLater → Upload` GET the exact `targetPath` including `resource_id`, then stop on `type === file` without proving that target is the same object found before the move. A timeout/unknown settlement or an external-client race can therefore place an unrelated file at the expected target path and make WebClip accept it. Mark-read may then replace the Journal entry's identity with that unrelated target `resourceId/publicUrl`; delete→Trash may proceed to local deletion without proving the original object moved. Snapshot the immutable source object identity before POST and reconcile the exact source/target/object tuple after the operation. Target success requires the same stable `resourceId`; the existing legacy public-URL fallback is only acceptable when the API truly omits resource_id and must never override a conflicting id. For unknown settlement also establish source outcome rather than trusting target path occupancy. Extend P1-183 Trash checkpoint with the same expected identity. Add mocked-Yandex collision/timeout regressions; real Yandex move E2E remains release QA.\n"
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p1-090-post-move-identity.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          expected=$'.github/workflows/audit-sync-20260826-p1-090-post-move-identity.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          m = json.load(open('manifest.json', encoding='utf-8'))
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reopen P1-090 move identity proof'
          git push