name: audit-sync-p0-022-provenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f92130307efad67946fdaecf36870ea940b4852a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p0-022-provenance.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          old = "| P0-022 | P0 | REGRESSION | Destructive Yandex move/delete доверяет `remotePath` из записи журнала/импорта. Перед `resources/move` источник обязан быть проверен как путь внутри текущих служебных веток WebClip; иначе только безопасная ошибка без изменения файла/локальной записи. |"
          new = "| P0-022 | P0 | PARTIAL | Managed-branch containment перед destructive Yandex move/delete реализован, но импортируемая remote identity всё ещё может стать authority без доказанного provenance. `normalizeImportedJournalEntry()` принимает из неподписанного backup `remotePath/resourceId/publicUrl/accountUid/rootPath`; поля identity могут быть пустыми. `findYandexFileForJournalEntry()` при отсутствии `resourceId/publicUrl` возвращает `true` для любого `file` по сохранённому `remotePath`; пустые imported `accountUid/rootPath` также не включают mismatch-fence. Поэтому crafted backup может создать запись, указывающую на другой реальный файл внутри текущих managed WebClip folders, и последующий явно выбранный пользователем `Trash` для этой ложной записи переместит тот файл. Path containment закрывает выход за служебные ветки, но не provenance внутри них. Imported/legacy path-only remote reference не должна автоматически давать destructive capability: новые записи должны хранить локально выданный versioned provenance/object receipt, import должен помечать remote reference как `imported-unverified`, а destructive action обязан сначала безопасно re-bind/доказать exact remote object identity либо fail-closed. Не считать imported resourceId/publicUrl сами по себе доверенной подписью; account/root fence P0-073/P0-074 и stronger content/object proof P1-184 сохранить. |"
          if p.count(old) != 1:
              raise SystemExit(f'Expected one P0-022 baseline row, got {p.count(old)}')
          p = p.replace(old, new, 1)
          marker = '## Continuation 2026-08-26 — imported remote-reference provenance'
          if marker in a:
              raise SystemExit('Audit provenance continuation already exists')
          section = "\n\n" + marker + "\n\nAudit baseline: `f92130307efad67946fdaecf36870ea940b4852a`. Documentation-only sync.\n\n**P0-022 is PARTIAL.** The earlier fix correctly fences destructive `resources/move` to the currently configured WebClip service branches, but that does not prove that an imported Journal record actually owns the object it names. Import accepts `remotePath`, `resourceId`, `publicUrl`, `accountUid` and `rootPath`; account/root checks are conditional when stored values are present. In `findYandexFileForJournalEntry()`, if neither stable resource id nor public URL is stored, `matchesKnownIdentity()` accepts any file returned at the stored path. A crafted/modified backup can therefore name another existing file under Upload/ReadmeLater/Trash and later cause that object to be moved when the user chooses the destructive file option on the imported record. The import confirmation code authenticates user intent to import, not remote-reference provenance. New remote references need an extension-generated versioned receipt/provenance marker; imported/path-only references must remain unverified until an explicit, fail-closed re-bind proves the exact remote object. This is independent of managed-path containment and composes with P0-073/P0-074/P1-184.\n"
          a += section
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p0-022-provenance.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p0-022-provenance.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine imported remote-reference provenance audit'
          git push
