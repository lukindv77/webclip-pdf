name: D0 D2 finalization delta research

on:
  push:
    branches:
      - research/d0-d2-production-entry-finalization-delta-2026-09-10

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare diagnostics directory
        run: mkdir -p artifacts

      - name: Syntax check deterministic model
        run: node --check project_tools/test_d0_d2_production_entry_finalization_delta_model.js

      - name: Execute deterministic model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_d0_d2_production_entry_finalization_delta_model.js 2>&1 | tee artifacts/d0-d2-model-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0-d2-finalization-delta-${{ github.sha }}
          path: artifacts/d0-d2-model-output.txt
          retention-days: 7
          if-no-files-found: warn
