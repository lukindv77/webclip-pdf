name: Research C21 lazy offscreen resources

on:
  push:
    branches: [research/evidence-c21-lazy-offscreen-resources-2026-09-02]
    paths-ignore:
      - project_tools/.c21-physical-result.json
      - project_tools/.c21-picture-control-result.json

permissions:
  contents: write

jobs:
  physical-c21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.4
      - name: Run exact-source physical C21 matrix and picture control
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then echo 'Chrome unavailable' >&2; exit 1; fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"

          set +e
          python project_tools/research_c21_lazy_offscreen_resources.py --chrome "$chrome" --out "$RUNNER_TEMP/c21-pdfs" | tee "$RUNNER_TEMP/c21-result.log"
          matrix_status=${PIPESTATUS[0]}
          set -e
          result="$(grep '^C21_RESULT_JSON=' "$RUNNER_TEMP/c21-result.log" | tail -n 1 | sed 's/^C21_RESULT_JSON=//')"
          if [[ -z "$result" ]]; then echo 'C21 matrix JSON missing' >&2; exit 1; fi
          printf '%s\n' "$result" > project_tools/.c21-physical-result.json
          echo "::notice title=C21_RESULT::$result"
          echo "matrix_status=$matrix_status" >> "$GITHUB_ENV"

          python project_tools/research_c21_picture_datasrcset_control.py --chrome "$chrome" --out "$RUNNER_TEMP/c21-picture-pdfs" | tee "$RUNNER_TEMP/c21-picture.log"
          control="$(grep '^C21_PICTURE_CONTROL_JSON=' "$RUNNER_TEMP/c21-picture.log" | tail -n 1 | sed 's/^C21_PICTURE_CONTROL_JSON=//')"
          if [[ -z "$control" ]]; then echo 'C21 picture control JSON missing' >&2; exit 1; fi
          printf '%s\n' "$control" > project_tools/.c21-picture-control-result.json
          echo "::notice title=C21_PICTURE_CONTROL::$control"

      - name: Persist temporary exact result receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_tools/.c21-physical-result.json project_tools/.c21-picture-control-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C21 physical results'
          git push origin HEAD:research/evidence-c21-lazy-offscreen-resources-2026-09-02

      - name: Validate observed C21 split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('project_tools/.c21-physical-result.json').read_text())
          c=json.loads(Path('project_tools/.c21-picture-control-result.json').read_text())
          for key in ('nativeLazy','dataSrc','dataSrcset','sameOriginFrameNativeLazy'):
              r=m[key]
              assert r['colorPixels'] > 500, (key,r)
              assert r['after']['naturalWidth'] > 0, (key,r)
              assert not r['excludePresent'] and not r['outsidePresent'], (key,r)
          p=m['pictureDataSrcset']
          assert p['requestsBefore'] == 0 and p['requestsAfter'] >= 1, p
          assert p['resourceReport']['failed'] == 0 and p['resourceReport']['deadlineExceeded'] is False, p
          assert p['colorPixels'] == 0 and p['after']['currentSrc'].startswith('data:image/gif'), p
          assert c['afterSettle']['currentSrc'].startswith('data:image/gif'), c
          assert c['settled']['colorPixels'] == 0, c
          assert c['causal']['colorPixels'] > 500 and c['causalState']['naturalWidth'] > 0, c
          print('C21 observed split validated; development matrix non-zero is expected for the pre-causal picture assertion.')
          PY
