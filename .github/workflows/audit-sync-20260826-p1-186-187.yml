name: audit-sync-p1-186-187

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b44d27f2bd55e2ebe4c40fc052e14cc9fc08d780"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-186-187.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-186' in p or 'P1-187' in p or 'P1-186' in a or 'P1-187' in a:
              raise SystemExit('P1-186/P1-187 already present; refuse duplicate sync')
          p += "\n\n## Продолжение глубокого аудита 2026-08-26 — import comment identity / flattened canvas fidelity\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-186 | P1 | OPEN | Import boundary ограничивает длину `journalComments[].id`, но не требует уникальности ID внутри одной entry. `sanitizeImportedComments()` передаёт каждый непустой imported ID в `normalizeJournalComments()` без `seen`/collision rewrite; последний сохраняет `item.id` как есть. Journal UI и worker edit/delete адресуют комментарий только по `commentId` и используют `find/findIndex`, поэтому при двух импортированных comments с одинаковым ID второй становится неоднозначным: edit/delete снова попадает в первый, а после его tombstone второй может быть фактически недоступен для управления. Entry IDs уже collision-safe re-ID, поэтому comment IDs должны получить такой же deterministic uniqueness contract: reject duplicate IDs либо versioned collision-safe rewrite при import, сохранив stable identity при последующем export. Добавить regression с duplicate non-empty comment IDs и проверить, что каждый импортированный комментарий адресуется независимо. |\n| P1-187 | P1 | OPEN | Same-origin selected-body iframe flattening теряет rendered state, которого нет в DOM attributes. `createFlattenedBodyFramePrintProxy()` использует deep `cloneNode(true)`, а `copyFrameCloneUrlState()` переносит link/image/media URL state, но не bitmap `<canvas>`. DOM/MDN semantics `cloneNode()` прямо не копируют painted canvas image, поэтому оригинальный iframe скрывается, а flattened proxy печатает пустой canvas вместо видимого графика/рисунка. Перед live insertion переносить rendered state bounded-safe способом: для canvas — bitmap snapshot/draw с node/pixel/byte budget и fail-closed diagnostics; отдельно browser-regression проверить current video frame и runtime form-control state и реализовать только доказанно нужные copy steps. Не создавать неограниченные data URLs/bitmap copies; P0-064/P0-068 memory/inertness budgets сохраняются. |\n"
          marker = '## Continuation 2026-08-26 — imported comment identity and flattened rendered state'
          a += "\n\n" + marker + "\n\nAudit baseline: `b44d27f2bd55e2ebe4c40fc052e14cc9fc08d780`. Documentation-only sync.\n\n**P1-186.** Imported comment IDs are length-bounded but not uniqueness-bounded. Two valid comment objects can retain the same non-empty ID; Journal edit/delete and editing-state lookup address by ID with first-match semantics, so the restored data model contains ambiguous identities. Entry IDs already avoid this class through collision-aware staging/re-ID.\n\n**P1-187.** Flattened selected iframe bodies are deep-cloned. The clone helper copies resolved href/src/poster state but has no canvas bitmap transfer. `Node.cloneNode()` does not copy a canvas painted image, so the flattening path can replace visible selected graphics with blank canvas output. Add bounded rendered-state capture and real Chromium regression; evaluate video/form live state separately rather than assuming clone fidelity.\n"
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p1-186-187.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p1-186-187.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record import identity and flattened canvas findings'
          git push
