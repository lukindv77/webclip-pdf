name: audit-sync-20260826-g

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4ec500f684e537a62f1e615f04d7e0be217f29fc"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-g.yml"
      - name: Update confirmed audit findings
        shell: python
        run: |
          from pathlib import Path

          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')

          rows = p.splitlines()
          seen = {'P0-048': 0, 'P0-073': 0, 'P1-156': 0}
          out = []
          for line in rows:
              if line.startswith('| P0-048 |'):
                  seen['P0-048'] += 1
                  line = '| P0-048 | P0 | PARTIAL | Local-download intent recovery использует exact Blob URL как primary identity; fallback `filename + expectedBytes + short window` остаётся только для Chrome, который больше не показывает исходный Blob URL. Аудит выявил незакрытую ambiguity: fallback берёт первый matching own-extension DownloadItem через `.find()` и не требует единственного кандидата/не резервирует уже сопоставленный `downloadId`. Два intents с одинаковыми requested filename+bytes могут оба выбрать один и тот же DownloadItem; второй `bindPendingLocalDownloadIntent()` делает `put()` по тому же numeric key и способен перезаписать durable checkpoint первого, потеряв Journal metadata одной физически успешной загрузки. Fallback должен fail-closed при 0 или >1 кандидатах, исключать уже claimed downloadId и использовать более сильную bounded identity/proximity; никакой эвристический match не должен перезаписывать существующий bound checkpoint. |'
              elif line.startswith('| P0-073 |'):
                  seen['P0-073'] += 1
                  line = '| P0-073 | P0 | OPEN | Yandex remote-save completion/recovery не fenced по immutable `accountUid + rootPath`, хотя checkpoint уже хранит эту identity. Live upload получает signed URL в аккаунте A, но post-transfer `publish`/metadata verify используют текущий OAuth token без exact UID revalidation; `recoverPendingRemoteSaves()` также читает `remotePath` текущего аккаунта и принимает file по path + exact size до сравнения checkpoint account. Дополнительно manual retry с тем же `journalEntryId` может вызвать `checkpointPendingRemoteSaveIntent()` в аккаунте B: существующий `prepared` checkpoint не сохраняется как immutable, а заменяется новым item с accountUid/rootPath B (сохраняется только исходный createdAt), то есть unresolved операция A может быть **re-bound** к B до recovery. Перед каждым retry/post-transfer publish/verify/recovery получить current account UID и exact-сравнить с immutable checkpoint; prepared identity нельзя перезаписывать другой account/root. Mismatch = visible deferred/fail-closed без API mutation в новом аккаунте; root/path также проверять как исходный namespace. |'
              elif line.startswith('| P1-156 |'):
                  seen['P1-156'] += 1
                  line = '| P1-156 | P1 | OPEN | Page-owned native Save As сохраняет правильное отсутствие timeout у `downloads.download({saveAs:true})`, но cleanup lifecycle неполон. `downloads.onChanged` listener может остаться навсегда при пропущенном terminal event, release RPC не имеет bounded/dedup control deadline. Дополнительно active durable index `webclipPreparedSaveAsIndex` (cap=64) используется только при PREPARE/RELEASE и не имеет reconciliation/GC: если `journal.html/options.html` закрылась после PREPARE до STARTED/RELEASE, Blob может позже исчезнуть по offscreen TTL, а `prepared` key + index entry останутся до конца browser session и постепенно заблокируют новые Save As. Нужны fallback lifetime + bounded `downloads.search` reconciliation для STARTED, TTL/owner-page-loss cleanup для never-started PREPARED, bounded/dedup RELEASE RPC и согласованное удаление active index. Released tombstone retention остаётся отдельно в P1-169. |'
              out.append(line)

          if any(v != 1 for v in seen.values()):
              raise SystemExit(f'Expected exactly one row for each target, got {seen}')
          p = '\n'.join(out) + ('\n' if p.endswith('\n') else '')

          marker = '## Continuation 2026-08-26 — local-download ambiguity / Save As active lifecycle / remote retry identity'
          if marker in a:
              raise SystemExit('Audit continuation already present; refuse duplicate sync')
          a += f'''\n\n{marker}\n\nAudit source-of-truth baseline: `4ec500f684e537a62f1e615f04d7e0be217f29fc`. Runtime code was inspected only; this sync changes documentation.\n\n### P0-048 reopened as PARTIAL — ambiguous filename/size fallback can bind two intents to one download\n\n`reconcilePendingLocalDownloads()` correctly filters candidates to `byExtensionId === chrome.runtime.id` and treats exact Blob URL as primary identity. The compatibility fallback is still unsafe under ambiguity: when the browser no longer exposes the original Blob URL it accepts matching basename + exact expected bytes within a short intent age and calls `.find()`. No uniqueness check or per-pass claimed-download set exists. `bindPendingLocalDownloadIntent()` then deletes the string intent and `put()`s the bound object under numeric `downloadId`; a second intent bound to the same id overwrites that durable key. A physically successful download can therefore lose its own Journal recovery metadata. The fallback must require exactly one unclaimed candidate and must never overwrite an existing numeric checkpoint belonging to another intent.\n\n### P0-073 expanded — manual retry can re-bind an unresolved remote save to another Yandex account\n\nThe earlier account-fence finding also affects retry admission, not only later recovery. `checkpointPendingRemoteSaveIntent()` preserves an existing `remote-verified` record, but for an existing ordinary `prepared` record it writes the newly constructed item while retaining only the old `createdAt`. A manual retry after account A→B reauthorization therefore replaces checkpoint `accountUid/rootPath` with B for the same `journalEntryId`. Combined with `allowExisting` path+size reuse, this can erase the evidence that the unresolved operation originated in A. Remote checkpoint identity must be immutable once the first external side effect is admitted; retry under another account/root must stop before lookup/upload/publish.\n\n### P1-156 expanded — active prepared Save As checkpoints have no session GC\n\n`prepared-save-as.js` deliberately leaves native `saveAs:true` without a local timeout. Page-owned terminal cleanup listens to `downloads.onChanged` and sends RELEASE. Worker checkpoints add a session id to `webclipPreparedSaveAsIndex` on PREPARE and remove it on RELEASE. The index has a hard cap of 64, but current worker code has no pass that enumerates/reconciles this index after owner-page loss. Closing an extension page after PREPARE but before STARTED/RELEASE can leave the index/key indefinitely for the current browser session even when the underlying Blob is later reclaimed. STARTED operations also need `downloads.search` fallback if terminal events are missed. This is distinct from P1-169, which concerns accumulation of already-released tombstones.\n'''

          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-g.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-g.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf '%s\n' "${changed[@]}"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine download and Save As recovery findings'
          git push
