name: Research C17 baseline update

on:
  push:
    branches:
      - research/evidence-c17-cross-origin-iframe-2026-09-02
    paths-ignore:
      - project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update baseline
        run: bash project_tools/.c17-update-baseline.sh
      - name: Commit baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git diff --cached --quiet && exit 0
          git commit -m 'research: advance fresh restart through C17'
          git push origin HEAD:research/evidence-c17-cross-origin-iframe-2026-09-02
