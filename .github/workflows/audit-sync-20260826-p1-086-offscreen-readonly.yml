name: audit-sync-p1-086-offscreen-readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sync-20260826-p1-086-offscreen-readonly.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard baseline and patch audit docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a2211a7b727db57c7205083aef5d3b79a9564a56"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-086-offscreen-readonly.yml"
          python3 - <<'PY'
          import base64, json, pathlib
          p = pathlib.Path('project_docs/PRIORITIES_P0_P1_P2.md')
          d = pathlib.Path('DEEP_AUDIT_2026-08-25.md')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          ap = base64.b64decode('').decode()
          text = p.read_text()
          if old not in text: raise SystemExit('P1-086 baseline text not found')
          p.write_text(text.replace(old, new, 1))
          dt = d.read_text()
          if '## Continuation 2026-08-26 — P1-086 cross-context readonly transaction completion' in dt: raise SystemExit('audit section already exists')
          d.write_text(dt + ap)
          m = json.loads(pathlib.Path('manifest.json').read_text())
          assert m['manifest_version'] == 3 and m['version'] == '0.9.8' and m['minimum_chrome_version'] == '118'
          PY
          rm .github/workflows/audit-sync-20260826-p1-086-offscreen-readonly.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md .github/workflows/audit-sync-20260826-p1-086-offscreen-readonly.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p1-086-offscreen-readonly.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine P1-086 offscreen readonly completion'
          git push
