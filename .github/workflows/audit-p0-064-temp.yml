name: Audit P0-064 frame proxy budget temporary evidence

on:
  push:
    branches: [fix/p0-064-frame-proxy-preflight-budget-2026-09-01]

permissions:
  contents: read

jobs:
  p0-064-current-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Deterministic frame proxy regressions
        run: |
          set -euo pipefail
          node --check frame-proxy-budget-guard.js
          node --check frame-proxy-inert-guard.js
          node --check content-injection-guard.js
          node project_tools/test_p0_064_frame_proxy_budget.js
          node project_tools/test_p0_068_inert_frame_proxy.js

      - name: Install evidence dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 PyMuPDF==1.26.4

      - name: Download Chrome for Testing 152
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cft"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cft/chrome.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/cft/chrome.zip" -d "$RUNNER_TEMP/cft"
          chmod +x "$RUNNER_TEMP/cft/chrome-linux64/chrome"
          "$RUNNER_TEMP/cft/chrome-linux64/chrome" --version

      - name: Current Chrome P0-064 budget evidence
        env:
          CHROME_BIN: ${{ runner.temp }}/cft/chrome-linux64/chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-064-evidence"
          xvfb-run -a python project_tools/audit_p0_064_frame_proxy_budget.py \
            --chrome "$CHROME_BIN" \
            --output "$RUNNER_TEMP/p0-064-evidence"

      - name: Revalidate P0-068 inertness under budget-first bootstrap
        env:
          CHROME_BIN: ${{ runner.temp }}/cft/chrome-linux64/chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-068-revalidation"
          xvfb-run -a python project_tools/audit_p0_068_inert_frame_proxy.py \
            --chrome "$CHROME_BIN" \
            --output "$RUNNER_TEMP/p0-068-revalidation"
