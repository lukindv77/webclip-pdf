name: audit-sync-p1-158-yandex-config-read
on:
  push:
    paths:
      - '.github/workflows/audit-sync-20260826-p1-158-yandex-config-read.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        run: |
          test "$(git rev-parse HEAD^)" = "595639c709c453fc9c43cb0285fd2f22239f5592"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-158-yandex-config-read.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          text = priorities.read_text(encoding='utf-8')
          old = "| P1-158 | P1 | OPEN | В service-worker остались direct awaited Chrome maintenance/config reads (в т.ч. отдельные yandexConfig/version-refresh/tabs paths), которые не все проходят центральный bounded read/serialized mutation слой. Нужен полный per-call reconciliation. |"
          new = "| P1-158 | P1 | OPEN | В service-worker остались direct awaited Chrome reads вне центрального bounded read/serialized mutation слоя. Аудит подтвердил auth-critical путь: `readYandexAuthState()` запускает bounded чтения `storage.session`/legacy token через `runYandexAuthStorageOperation`, но `yandexConfig` в том же `Promise.all` читает прямым `chrome.storage.local.get('yandexConfig')` без deadline. `getValidYandexAccessToken()` вызывает `readYandexAuthState()` перед Yandex API, поэтому hung config read способен удержать upload/recovery/backup **до** сетевого `fetch` и обойти их HTTP/operation deadlines; тот же путь используется status/account/root flows. Свести auth/config reads к bounded helper с фактическим late-settlement semantics для read-only вызова; сетевой operation deadline должен включать prerequisite auth/config reads либо явно передавать remaining budget. Сохранить fail-closed legacy-token cleanup и P0-074 immutable operation context. Отдельно остаются version-refresh/tabs и другие direct awaited Chrome paths — нужен полный per-call audit. Regression: never-settling `storage.local.get('yandexConfig')` даёт контролируемый timeout и не удерживает Yandex upload/recovery/backup бесконечно; поздний read result не запускает side effect после terminal timeout. |"
          if old not in text:
              raise SystemExit('P1-158 source row not found or changed')
          priorities.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = Path('DEEP_AUDIT_2026-08-25.md')
          a = audit.read_text(encoding='utf-8')
          section = '''\n\n## Continuation 2026-08-26 — P1-158 auth-critical Chrome config read\n\n- **P1-158 OPEN refined — Yandex prerequisite config read can bypass network deadlines.** Current `readYandexAuthState()` performs three reads in one `Promise.all`: session auth and legacy persistent auth are bounded by `runYandexAuthStorageOperation`, but `chrome.storage.local.get('yandexConfig')` is direct/unbounded. `getValidYandexAccessToken()` calls this before `yandexApi()` creates/uses the network request, so a never-settling Chrome Storage read can hold PDF upload, remote-save recovery, backup and account/status flows indefinitely even though their HTTP requests have timeouts. The fix belongs to existing P1-158: make every prerequisite auth/config read bounded, include it in the operation budget where applicable, and do not let a late read result start a side effect after the caller has already received terminal timeout. P0-074 remains the separate immutable account/root/auth-generation contract.\n\nThis continuation is docs-only. Production source and `manifest.json` are unchanged; the previous product test gate was not rerun.\n'''
          if '## Continuation 2026-08-26 — P1-158 auth-critical Chrome config read' in a:
              raise SystemExit('audit section already exists')
          audit.write_text(a.rstrip() + section + '\n', encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/audit-sync-20260826-p1-158-yandex-config-read.yml
      - name: Verify scope and manifest invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
          git add -A
          printf '%s\n' "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p1-158-yandex-config-read.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
      - name: Commit docs-only sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine P1-158 Yandex config read deadline'
          git push origin HEAD:main
