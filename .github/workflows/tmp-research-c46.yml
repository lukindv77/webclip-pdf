name: Research C46

on:
  push:
    branches:
      - research/evidence-c46-unpacked-permissions-debugger-2026-09-03

permissions:
  contents: read

jobs:
  c46:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install supported extension test browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save puppeteer@25.9.0
      - name: Trace headed C46 chrome.debugger printing
        shell: bash
        env:
          C46_TRACE_HEADLESS: '0'
        run: |
          set -euo pipefail
          xvfb="$(command -v xvfb-run || true)"
          test -n "$xvfb"
          xvfb-run -a node project_tools/.c46_debugger_trace.mjs | tee c46-headed-trace.txt
          sha256sum c46-headed-trace.txt
      - name: Trace headless C46 chrome.debugger printing
        shell: bash
        env:
          C46_TRACE_HEADLESS: '1'
        run: |
          set -euo pipefail
          node project_tools/.c46_debugger_trace.mjs | tee c46-headless-trace.txt
          sha256sum c46-headless-trace.txt
