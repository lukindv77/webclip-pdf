name: Research C46

on:
  push:
    branches:
      - research/evidence-c46-unpacked-permissions-debugger-2026-09-03

permissions:
  contents: read

jobs:
  c46:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install supported extension test browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save puppeteer@25.9.0
      - name: Run C46 real-unpacked evidence
        shell: bash
        env:
          C46_SOURCE_BASELINE: 5ad7ba6b2f29502c3810a4b5d589dd0a965b270e
        run: |
          set -euo pipefail
          xvfb="$(command -v xvfb-run || true)"
          test -n "$xvfb"
          xvfb-run -a node project_tools/research_c46_unpacked_permissions_debugger_v2.mjs | tee c46-result.txt
          sha256sum c46-result.txt
