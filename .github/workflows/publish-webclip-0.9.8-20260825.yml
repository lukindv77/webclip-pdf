name: Publish requested WebClip 0.9.8 build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-webclip-0.9.8-20260825.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean build tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/webclip-build
          mkdir -p /tmp/webclip-build
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd()
          out = Path('/tmp/webclip-build')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          excluded_prefixes = ('.github/', 'handoff/', 'builds/')
          excluded_names = {'GITHUB_REPOSITORY_STATE.md'}

          for raw in tracked:
              if not raw:
                  continue
              rel = raw.decode('utf-8')
              if rel in excluded_names or rel.startswith(excluded_prefixes):
                  continue
              src = root / rel
              if not src.is_file():
                  continue
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          gitignore = out / '.gitignore'
          if gitignore.is_file():
              text = gitignore.read_text(encoding='utf-8')
              marker = '\n# Canonical handoff checkpoint is intentionally versioned under handoff/'
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip() + '\n'
              gitignore.write_text(text, encoding='utf-8')
          PY

      - name: Verify manifest and deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/webclip-build
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('manifest_version') == 3, manifest
          assert manifest.get('version') == '0.9.8', manifest
          print('manifest gate: MV3 / 0.9.8 PASS')
          PY

          mapfile -t js_files < <(find . -type f -name '*.js' -not -path './project_recovery/*' | sort)
          if [ "${#js_files[@]}" -ne 68 ]; then
            echo "Expected 68 JavaScript files, got ${#js_files[@]}" >&2
            exit 1
          fi
          for f in "${js_files[@]}"; do node --check "$f" >/dev/null; done
          echo "JavaScript syntax: 68/68 PASS"

          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          if [ "${#tests[@]}" -ne 55 ]; then
            echo "Expected 55 deterministic tests, got ${#tests[@]}" >&2
            exit 1
          fi
          for f in "${tests[@]}"; do node "$f"; done
          echo "Deterministic tests: 55/55 PASS"

      - name: Build mandatory recovery archive
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/webclip-build
          python3 project_tools/build_recovery_archive.py
          test -f project_recovery/WebClip_Project_Recovery_v0_9_8.zip

      - name: Package requested build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/0.9.8
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          stage = Path('/tmp/webclip-build')
          out_dir = Path('builds/0.9.8')
          name = 'WebClip_PDF_Prototype_v0_9_8_build_2026-08-25_1442_github.zip'
          out = out_dir / name

          files = sorted(p for p in stage.rglob('*') if p.is_file())
          if len(files) != 150:
              raise SystemExit(f'Expected 150 build files including recovery, got {len(files)}')

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  zf.write(path, path.relative_to(stage).as_posix())

          with zipfile.ZipFile(out, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = set(zf.namelist())
              required = {
                  'manifest.json',
                  'service-worker.js',
                  'content.js',
                  'project_recovery/WebClip_Project_Recovery_v0_9_8.zip',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing build files: ' + ', '.join(missing))

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          (out_dir / (name + '.sha256')).write_text(f'{digest}  {name}\n', encoding='ascii')
          metadata = {
              'artifact': name,
              'sha256': digest,
              'manifest_version': 3,
              'version': '0.9.8',
              'source_commit': '${{ github.sha }}',
              'syntax_gate': '68/68 PASS',
              'deterministic_gate': '55/55 PASS',
              'recovery_archive': 'project_recovery/WebClip_Project_Recovery_v0_9_8.zip',
              'publication_kind': 'requested build artifact; not a GitHub Release and no version bump',
              'handoff_included': False,
          }
          (out_dir / 'BUILD_INFO_2026-08-25_1442.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(f'published candidate: {out} sha256={digest}')
          PY

      - name: Commit published build to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/0.9.8/
          git commit -m 'build: publish requested WebClip 0.9.8 artifact'
          git push origin HEAD:main
