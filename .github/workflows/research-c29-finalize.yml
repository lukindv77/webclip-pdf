name: Research C29 finalize

on:
  push:
    branches: [research/evidence-c29-viewport-container-geometry-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c29:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance C29 baseline and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = p.read_text(encoding='utf-8')
          old = '| C29 | Viewport units / container-query dependent geometry | `NOT-TRIAGED / UNKNOWN` |'
          new = '| C29 | Viewport units / container-query dependent geometry | `L4-REVALIDATED / FINDING + POSITIVE/DIRECT/ALIGNED/CONTAINER/FROZEN/CAUSAL CONTROLS (P0-070, P0-004)` |'
          if old not in text:
              raise SystemExit('C29 baseline row did not match expected current text')
          text = text.replace(old, new, 1)
          checkpoint = base64.b64decode('').decode('utf-8')
          anchor = '\n## Delivery rule\n'
          if anchor not in text:
              raise SystemExit('Delivery rule anchor missing')
          text = text.replace(anchor, '\n' + checkpoint + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/research-c29-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m 'research: finalize fresh C29 evidence'
          git push origin HEAD:research/evidence-c29-viewport-container-geometry-2026-09-02
