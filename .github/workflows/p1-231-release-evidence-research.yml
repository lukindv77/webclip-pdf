name: P1-231 release evidence generation research

on:
  push:
    branches:
      - research/implementation-evidence-architecture-2026-09-10

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare diagnostics directory
        run: mkdir -p artifacts

      - name: Syntax check P1-231 model
        run: node --check project_tools/test_p1_231_release_evidence_generation_model.js

      - name: Execute P1-231 model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_p1_231_release_evidence_generation_model.js 2>&1 | tee artifacts/p1-231-release-evidence-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: p1-231-release-evidence-${{ github.sha }}
          path: artifacts/p1-231-release-evidence-output.txt
          retention-days: 7
          if-no-files-found: warn
