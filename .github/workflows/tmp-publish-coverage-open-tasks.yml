name: Temporary publish coverage open tasks

on:
  push:
    branches:
      - research/publish-coverage-open-tasks-2026-09-03

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/publish-coverage-open-tasks-2026-09-03
      - name: Synchronize canonical Coverage Matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('| C45 | Later reading / reopened PDF usefulness | `NOT-TRIAGED / UNKNOWN` |', '| C45 | Later reading / reopened PDF usefulness | `L4-REVALIDATED / PARTIAL/PASS + POSITIVE/PHYSICAL-PDF/TWO-INDEPENDENT-READERS/SELECTED-SCOPE/SEARCHABLE-TEXT/METADATA/EXTERNAL-URI/INTERNAL-DESTINATION CONTROLS; DEGRADED-RESOURCE/GUI-L5 OPEN (P0-004, P1-003, P1-187, P0-066 candidate/supporting)` |'),
              ('| C45 | OPEN — unknown | Reopen produced PDFs in an independent reader and verify selected-scope fidelity, readable metadata, external/internal links, text selection/search and truthful degraded-resource information against the admitted operation. | Candidate duplicate map: P0-004, P1-003, P1-187, P0-066 | B6/B9; physical saved/reopened artifacts (L4/L5) |', '| C45 | OPEN — L4 partial; degraded-resource truthfulness and GUI-reader L5 remain | Produce a current WebClip PDF with an admitted degraded-resource condition (`resourceReport.failed > 0`, omission or truncation), reopen the physical artifact in a real GUI PDF reader, and verify selected text remains selectable/searchable, readable metadata remains available, external/internal links are activatable, and the artifact truthfully exposes the admitted degraded condition without fabricating success. Reconcile all observations against the exact admitted operation. | Candidate duplicate/supporting map: P0-004, P1-003, P1-187, P0-066 | B6/B9; physical saved/reopened artifact plus real GUI reader/degraded-resource case (L4/L5) |'),
              ('Execution stays sequential unless an earlier row exposes a cross-boundary blocker. **C41 remains blocked on real native/restart L5; C42 remains blocked on an explicitly authorized Yandex test account/root; C43 remote shares the C42 external prerequisite. C44 advances locally to L4 partial but remains the next coordinate because its real UI/full-browser restart and replace/merge decision are still locally executable; C45 stays queued.** External-account/user-owned UI work must not be simulated as L5; unavailable external prerequisites remain explicit blockers rather than inferred success.', 'Execution stays sequential unless an earlier row exposes a cross-boundary blocker. **C41 remains blocked on real native/restart L5; C42 remains blocked on an explicitly authorized Yandex test account/root; C43 remote shares the C42 external prerequisite. C44 and C45 have advanced locally to bounded L4 partials while their remaining UI/restart/degraded/external boundaries stay open. C46 is now the next not-triaged coordinate and requires real unpacked interactive Chrome L5.** External-account/user-owned UI work must not be simulated as L5; unavailable external prerequisites remain explicit blockers rather than inferred success.')
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exactly one occurrence, got {text.count(old)}')
                  text = text.replace(old, new)
                  changed = True
              elif new not in text:
                  raise SystemExit('neither old nor new canonical text found')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized matrix when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md; then
            echo "Coverage Matrix already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m "research: publish current open Coverage tasks"
          git push origin HEAD:research/publish-coverage-open-tasks-2026-09-03
