name: Research C41 Native L5

on:
  push:
    branches: [research/evidence-c41-native-l5-2026-09-03]
    paths-ignore:
      - project_tools/.c41-native-result.json

permissions:
  contents: write

jobs:
  native-c41:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install native X11 harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool wmctrl openbox

      - name: Run real native Save As matrix
        id: native
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium unavailable' >&2
            echo 1 > "$RUNNER_TEMP/c41-native-status"
            exit 0
          fi
          "$chrome" --version
          export WEBCLIP_CHROME_FOR_TESTING="$chrome"
          set +e
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c 'openbox >/tmp/c41-openbox.log 2>&1 & exec node project_tools/research_c41_native_l5_cdp.js' | tee "$RUNNER_TEMP/c41-native-result.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$RUNNER_TEMP/c41-native-status"
          result="$(grep '^C41_NATIVE_RESULT_JSON=' "$RUNNER_TEMP/c41-native-result.log" | tail -n 1 | sed 's/^C41_NATIVE_RESULT_JSON=//')"
          if [[ -n "$result" ]]; then
            printf '%s\n' "$result" > project_tools/.c41-native-result.json
            echo "::notice title=C41_NATIVE_RESULT::$result"
          fi
          exit 0

      - name: Persist temporary exact result receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -s project_tools/.c41-native-result.json ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c41-native-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C41 native result'
          git push origin HEAD:research/evidence-c41-native-l5-2026-09-03

      - name: Assert native harness status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/c41-native-status" 2>/dev/null || echo 1)" = 0
