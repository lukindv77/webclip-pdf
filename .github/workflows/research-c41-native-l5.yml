name: Research C41 Native L5

on:
  push:
    branches: [research/evidence-c41-native-l5-2026-09-03]
    paths-ignore:
      - project_tools/.c41-native-result.json
      - project_tools/.c41-native-cancel-result.json
      - project_tools/.c41-native-worker-restart-result.json
      - project_tools/.c41-native-browser-restart-result.json

permissions:
  contents: write

jobs:
  native-c41:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Chrome and native X11 harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool wmctrl openbox unzip curl
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip \
            -o "$RUNNER_TEMP/chrome-152.zip"
          unzip -q "$RUNNER_TEMP/chrome-152.zip" -d "$RUNNER_TEMP/chrome-152"
          "$RUNNER_TEMP/chrome-152/chrome-linux64/chrome" --version

      - name: Run real native Save As matrix
        id: native
        shell: bash
        run: |
          set -uo pipefail
          chrome="$RUNNER_TEMP/chrome-152/chrome-linux64/chrome"
          test -x "$chrome" || { echo 'Pinned Chrome unavailable' >&2; echo 1 > "$RUNNER_TEMP/c41-native-status"; exit 0; }
          "$chrome" --version
          export WEBCLIP_CHROME_FOR_TESTING="$chrome"
          set +e
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c 'openbox >/tmp/c41-openbox.log 2>&1 & exec node project_tools/research_c41_native_l5_runner.js' | tee "$RUNNER_TEMP/c41-native-result.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$RUNNER_TEMP/c41-native-status"
          for spec in \
            'C41_NATIVE_RESULT_JSON project_tools/.c41-native-result.json' \
            'C41_CANCEL_RESULT_JSON project_tools/.c41-native-cancel-result.json' \
            'C41_WORKER_RESTART_RESULT_JSON project_tools/.c41-native-worker-restart-result.json' \
            'C41_BROWSER_RESTART_RESULT_JSON project_tools/.c41-native-browser-restart-result.json'
          do
            marker="${spec%% *}"
            target="${spec#* }"
            value="$(grep "^${marker}=" "$RUNNER_TEMP/c41-native-result.log" | tail -n 1 | sed "s/^${marker}=//")"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" > "$target"
              echo "::notice title=${marker}::$value"
            fi
          done
          exit 0

      - name: Persist temporary exact result receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=(
            project_tools/.c41-native-result.json
            project_tools/.c41-native-cancel-result.json
            project_tools/.c41-native-worker-restart-result.json
            project_tools/.c41-native-browser-restart-result.json
          )
          found=0
          for file in "${files[@]}"; do
            if [[ -s "$file" ]]; then git add -f "$file"; found=1; fi
          done
          [[ "$found" = 1 ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C41 native result'
          git pull --rebase origin research/evidence-c41-native-l5-2026-09-03
          git push origin HEAD:research/evidence-c41-native-l5-2026-09-03

      - name: Assert native harness status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/c41-native-status" 2>/dev/null || echo 1)" = 0
