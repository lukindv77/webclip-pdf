name: Temporary C15 links and anchors evidence

on:
  push:
    branches: [research/c15-links-anchors-2026-09-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-c15-links-anchors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c15-links-anchors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install PDF inspection dependency
        run: python -m pip install --disable-pip-version-check --no-input PyMuPDF==1.26.6

      - name: Show browser identity
        run: |
          set -euo pipefail
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
          (google-chrome-stable || google-chrome || chromium) --version

      - name: Run C15 physical PDF matrix
        run: python project_tools/research_c15_links_anchors.py
