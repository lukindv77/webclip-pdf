name: Research C45

on:
  push:
    branches:
      - research/evidence-c45-reopened-pdf-usefulness-2026-09-03

permissions:
  contents: read

jobs:
  c45:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check playwright pypdf pymupdf
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Run C45 physical reopened-reader probe
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.path }}
          C45_SOURCE_BASELINE: 22b13604c71b2c46e846850405a339cee7bdbff8
          C45_CONTENT_BLOB_SHA: f3ee7b51fe9ee94fdfe36e8a7c99f14a548fdc4e
        run: |
          set -euo pipefail
          python project_tools/research_c45_reopened_pdf_usefulness.py --chrome "$CHROMIUM_BIN" | tee c45-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c45-result
          path: c45-result.txt
          if-no-files-found: error
