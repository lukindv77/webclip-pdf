name: Close P1-125 and P1-126

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-p1-125-p1-126.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical source, regressions and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          sw_path = root / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')

          # ---------- Constants / state ----------
          old = "const FRAME_AGENT_COMMAND_TIMEOUT_MS = 5_000;\nconst FRAME_AGENT_MAX_PER_TAB = 64;\nconst TAB_CREATE_TIMEOUT_MS = 10_000;\nconst TAB_CREATE_LATE_SUCCESS_TTL_MS = 60_000;\nconst frameAgentsByTab = new Map();\nconst tabCreateSettlements = new Map();"
          new = "const FRAME_AGENT_COMMAND_TIMEOUT_MS = 5_000;\nconst FRAME_AGENT_MAX_PER_TAB = 64;\nconst SCRIPT_EXECUTION_TIMEOUT_MS = 10_000;\nconst SCRIPT_EXECUTION_LATE_SUCCESS_TTL_MS = 60_000;\nconst TAB_GET_TIMEOUT_MS = 5_000;\nconst TAB_CREATE_TIMEOUT_MS = 10_000;\nconst TAB_CREATE_LATE_SUCCESS_TTL_MS = 60_000;\nconst frameAgentsByTab = new Map();\nconst scriptExecutionSettlements = new Map();\nconst tabCreateSettlements = new Map();"
          if old not in sw:
              raise SystemExit('P1-125/126 constants anchor missing')
          sw = sw.replace(old, new, 1)

          # ---------- P1-125: actual-settlement tracked executeScript ----------
          marker = "function makeTabCreatePendingError(label = 'Создание вкладки Chrome') {"
          if marker not in sw:
              raise SystemExit('P1-125 helper insertion marker missing')
          script_helpers = r'''function makeScriptExecutionPendingError(label = 'Инъекция скрипта Chrome') {
            const error = new Error(`${label} ещё выполняется Chrome. WebClip не запускает повторную инъекцию, пока исходный scripting.executeScript() не завершится.`);
            error.code = 'WEBCLIP_SCRIPT_EXECUTION_PENDING';
            return error;
          }

          function scriptExecutionRequestKey(details = {}, requestKey = '') {
            const explicit = String(requestKey || '').trim();
            if (explicit) return `logical:${explicit.slice(0, 512)}`;
            const target = details?.target && typeof details.target === 'object' ? details.target : {};
            const tabId = Math.max(0, Math.floor(Number(target.tabId) || 0));
            const frameIds = (Array.isArray(target.frameIds) ? target.frameIds : [])
              .map((value) => Math.floor(Number(value)))
              .filter((value) => Number.isInteger(value) && value >= 0)
              .sort((a, b) => a - b);
            const documentIds = (Array.isArray(target.documentIds) ? target.documentIds : [])
              .map((value) => String(value || '').slice(0, 256))
              .filter(Boolean)
              .sort();
            const files = (Array.isArray(details?.files) ? details.files : [])
              .map((value) => String(value || '').slice(0, 512))
              .filter(Boolean);
            return `tab:${tabId}|all:${target.allFrames === true ? 1 : 0}|frames:${frameIds.join(',')}|documents:${documentIds.join(',')}|files:${files.join(',')}|world:${String(details?.world || 'ISOLATED')}`;
          }

          function clearScriptExecutionSettlement(key, entry) {
            if (entry?.cleanupTimer) clearTimeout(entry.cleanupTimer);
            if (scriptExecutionSettlements.get(key) === entry) scriptExecutionSettlements.delete(key);
          }

          function waitForScriptExecutionSettlement(entry, label, timeoutMs = SCRIPT_EXECUTION_TIMEOUT_MS) {
            return new Promise((resolve, reject) => {
              let settled = false;
              const finish = (fn, value) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                fn(value);
              };
              const timer = setTimeout(() => {
                entry.timedOut = true;
                finish(reject, makeScriptExecutionPendingError(label));
              }, Math.max(1, Number(timeoutMs) || SCRIPT_EXECUTION_TIMEOUT_MS));
              entry.raw.then(
                (result) => finish(resolve, result),
                (error) => finish(reject, error)
              );
            });
          }

          async function executeScriptSingletonBounded(details, { requestKey = '', label = 'Инъекция скрипта Chrome', timeoutMs = SCRIPT_EXECUTION_TIMEOUT_MS } = {}) {
            const key = scriptExecutionRequestKey(details, requestKey);
            const existing = scriptExecutionSettlements.get(key);
            if (existing) {
              if (existing.hasLateSuccess) {
                const result = existing.lateSuccess;
                clearScriptExecutionSettlement(key, existing);
                return result;
              }
              const result = await waitForScriptExecutionSettlement(existing, `${label}: ожидание уже начатого scripting.executeScript()`, timeoutMs);
              if (existing.timedOut) clearScriptExecutionSettlement(key, existing);
              return result;
            }

            let raw;
            try { raw = Promise.resolve(chrome.scripting.executeScript(details)); }
            catch (error) { raw = Promise.reject(error); }
            const entry = { raw, timedOut: false, hasLateSuccess: false, lateSuccess: null, cleanupTimer: 0 };
            scriptExecutionSettlements.set(key, entry);

            raw.then(
              (result) => {
                if (entry.timedOut) {
                  entry.hasLateSuccess = true;
                  entry.lateSuccess = result;
                  entry.cleanupTimer = setTimeout(() => clearScriptExecutionSettlement(key, entry), SCRIPT_EXECUTION_LATE_SUCCESS_TTL_MS);
                } else {
                  clearScriptExecutionSettlement(key, entry);
                }
              },
              () => clearScriptExecutionSettlement(key, entry)
            );

            return waitForScriptExecutionSettlement(entry, label, timeoutMs);
          }

          '''
          script_helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in script_helpers.splitlines())
          sw = sw.replace(marker, script_helpers + marker, 1)

          old = """    results = await withOperationTimeout(
              chrome.scripting.executeScript({ target: { tabId: id, allFrames: true }, files: ['frame-agent.js'] }),
              10_000,
              'Инъекция frame-agent в разрешённые iframe'
            );"""
          new = """    results = await executeScriptSingletonBounded(
              { target: { tabId: id, allFrames: true }, files: ['frame-agent.js'] },
              {
                requestKey: `frame-agent:${id}:all`,
                label: 'Инъекция frame-agent в разрешённые iframe',
                timeoutMs: SCRIPT_EXECUTION_TIMEOUT_MS
              }
            );"""
          if old not in sw:
              raise SystemExit('P1-125 frame-agent executeScript anchor missing')
          sw = sw.replace(old, new, 1)

          old = """async function ensureWebClipContentScript(tabId) {
            await ensureStorageAccessInitialized();
            await chrome.scripting.executeScript({ target: { tabId }, files: ['content.js'] });
          }"""
          new = """async function ensureWebClipContentScript(tabId) {
            await ensureStorageAccessInitialized();
            const id = Math.max(0, Math.floor(Number(tabId) || 0));
            if (!id) throw new Error('Не указана вкладка для подключения WebClip content script.');
            await executeScriptSingletonBounded(
              { target: { tabId: id }, files: ['content.js'] },
              {
                requestKey: `content:${id}`,
                label: 'Инъекция WebClip content script',
                timeoutMs: SCRIPT_EXECUTION_TIMEOUT_MS
              }
            );
          }"""
          if old not in sw:
              raise SystemExit('P1-125 content executeScript anchor missing')
          sw = sw.replace(old, new, 1)

          # ---------- P1-126: centralized bounded tabs.get ----------
          marker = "async function createTabNextTo(sourceTabId, url, active = true, requestKey = '') {"
          if marker not in sw:
              raise SystemExit('P1-126 helper insertion marker missing')
          tab_get_helper = r'''function getChromeTabBounded(tabId, label = 'Чтение вкладки Chrome', timeoutMs = TAB_GET_TIMEOUT_MS) {
            const id = Math.max(0, Math.floor(Number(tabId) || 0));
            if (!id) {
              const error = new Error('Не указан корректный tabId для Chrome tabs.get().');
              error.code = 'WEBCLIP_INVALID_TAB_ID';
              return Promise.reject(error);
            }
            return withOperationTimeout(
              Promise.resolve().then(() => chrome.tabs.get(id)),
              Math.max(1, Number(timeoutMs) || TAB_GET_TIMEOUT_MS),
              label
            );
          }

          '''
          tab_get_helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in tab_get_helper.splitlines())
          sw = sw.replace(marker, tab_get_helper + marker, 1)

          replacements = [
            ("const source = await chrome.tabs.get(id);", "const source = await getChromeTabBounded(id, 'Определение позиции новой вкладки');"),
            ("sourceTab = await withOperationTimeout(chrome.tabs.get(tabId), 5_000, 'Проверка исходной вкладки журнала');", "sourceTab = await getChromeTabBounded(tabId, 'Проверка исходной вкладки журнала');"),
            ("placementTab = await withOperationTimeout(chrome.tabs.get(placementTabId), 5_000, 'Проверка anchor-вкладки журнала');", "placementTab = await getChromeTabBounded(placementTabId, 'Проверка anchor-вкладки журнала');"),
            ("currentUrl = normalizeJournalUrl((await chrome.tabs.get(tabId))?.url || '');", "currentUrl = normalizeJournalUrl((await getChromeTabBounded(tabId, 'Проверка текущего URL PDF retry cache'))?.url || '');"),
            ("const tab = await chrome.tabs.get(tabId);", "const tab = await getChromeTabBounded(tabId, 'Чтение URL вкладки для Chrome Action');")
          ]
          for old, new in replacements:
              if old not in sw:
                  raise SystemExit(f'P1-126 tabs.get anchor missing: {old}')
              sw = sw.replace(old, new, 1)

          if sw.count('chrome.scripting.executeScript(') != 1:
              raise SystemExit(f'P1-125 expected exactly one low-level executeScript call, got {sw.count("chrome.scripting.executeScript(")}')
          if sw.count('chrome.tabs.get(') != 1:
              raise SystemExit(f'P1-126 expected exactly one low-level tabs.get call, got {sw.count("chrome.tabs.get(")}')

          sw_path.write_text(sw, encoding='utf-8')

          # P1-124 VM harness now needs the centralized read-only tabs.get helper dependency.
          p1124_path = root / 'project_tools' / 'test_p1_124_tab_create_late_settlement.js'
          p1124 = p1124_path.read_text(encoding='utf-8')
          old = "const context = vm.createContext({ console, Promise, Error, Number, Math, String, Map, setTimeout, clearTimeout, chrome });"
          new = "const context = vm.createContext({ console, Promise, Error, Number, Math, String, Map, setTimeout, clearTimeout, chrome, withOperationTimeout: (promise) => Promise.resolve(promise) });"
          if old not in p1124:
              raise SystemExit('P1-126 P1-124 VM dependency anchor missing')
          p1124_path.write_text(p1124.replace(old, new, 1), encoding='utf-8')

          # ---------- Dedicated P1-125 regression ----------
          p1125 = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const sw = fs.readFileSync(path.join(root, 'service-worker.js'), 'utf8');
          const content = fs.readFileSync(path.join(root, 'content.js'), 'utf8');
          const frameAgent = fs.readFileSync(path.join(root, 'frame-agent.js'), 'utf8');

          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          assert(sw.includes('const SCRIPT_EXECUTION_TIMEOUT_MS = 10_000;'));
          assert(sw.includes('const SCRIPT_EXECUTION_LATE_SUCCESS_TTL_MS = 60_000;'));
          assert(sw.includes('const scriptExecutionSettlements = new Map();'));
          assert.strictEqual((sw.match(/chrome\.scripting\.executeScript\(/g) || []).length, 1, 'all worker executeScript calls must pass through one low-level helper');
          assert(content.includes('__WEBCLIP_PDF_PROTOTYPE_LOADED__'), 'content.js must keep its singleton guard');
          assert(frameAgent.includes('__WEBCLIP_FRAME_AGENT_LOADED__'), 'frame-agent.js must keep its singleton guard');

          const frameBlock = section(sw, 'async function enableFrameAgentsForTab', 'function makeTabCreatePendingError');
          assert(frameBlock.includes('executeScriptSingletonBounded('), 'frame-agent injection must use actual-settlement wrapper');
          assert(frameBlock.includes('requestKey: `frame-agent:${id}:all`'));
          const contentBlock = section(sw, 'async function ensureWebClipContentScript', 'async function sendWebClipPageCommand');
          assert(contentBlock.includes('executeScriptSingletonBounded('), 'content injection must use actual-settlement wrapper');
          assert(contentBlock.includes('requestKey: `content:${id}`'));

          const helperBlock = section(sw, 'function makeScriptExecutionPendingError', 'function makeTabCreatePendingError');

          (async () => {
            let calls = 0;
            let resolveFirst;
            const firstRaw = new Promise((resolve) => { resolveFirst = resolve; });
            const chrome = {
              scripting: {
                executeScript() {
                  calls += 1;
                  if (calls === 1) return firstRaw;
                  return Promise.resolve([{ frameId: 0, result: 'normal' }]);
                }
              }
            };
            const context = vm.createContext({ console, Promise, Error, Number, Math, String, Array, Map, setTimeout, clearTimeout, chrome });
            const code = `const SCRIPT_EXECUTION_TIMEOUT_MS = 20;\nconst SCRIPT_EXECUTION_LATE_SUCCESS_TTL_MS = 1000;\nconst scriptExecutionSettlements = new Map();\n${helperBlock}\nthis.execForTest = executeScriptSingletonBounded; this.pendingForTest = scriptExecutionSettlements;`;
            vm.runInContext(code, context);

            const details = { target: { tabId: 7 }, files: ['content.js'] };
            let firstError = null;
            try { await context.execForTest(details, { requestKey: 'content:7', label: 'test injection' }); }
            catch (error) { firstError = error; }
            assert(firstError, 'hung executeScript must hit a caller deadline');
            assert.strictEqual(firstError.code, 'WEBCLIP_SCRIPT_EXECUTION_PENDING');
            assert.strictEqual(calls, 1);
            assert.strictEqual(context.pendingForTest.size, 1, 'non-cancellable executeScript remains tracked after local timeout');

            let retryError = null;
            try { await context.execForTest(details, { requestKey: 'content:7', label: 'test injection' }); }
            catch (error) { retryError = error; }
            assert(retryError, 'identical retry must remain bounded while original injection is unresolved');
            assert.strictEqual(retryError.code, 'WEBCLIP_SCRIPT_EXECUTION_PENDING');
            assert.strictEqual(calls, 1, 'identical retry must not launch duplicate executeScript');

            resolveFirst([{ frameId: 0, result: 'late' }]);
            await new Promise((resolve) => setTimeout(resolve, 0));
            assert.strictEqual(context.pendingForTest.size, 1, 'late success receipt must remain bounded for a retry');

            const recovered = await context.execForTest(details, { requestKey: 'content:7', label: 'test injection' });
            assert.strictEqual(recovered[0].result, 'late');
            assert.strictEqual(calls, 1, 'retry after late success must consume original result instead of reinjecting');
            assert.strictEqual(context.pendingForTest.size, 0, 'late success receipt must be consumed once');

            const normal = await context.execForTest(details, { requestKey: 'content:7', label: 'test injection' });
            assert.strictEqual(normal[0].result, 'normal');
            assert.strictEqual(calls, 2, 'after receipt consumption a later legitimate ensure may invoke executeScript again; singleton script guards keep it harmless');
            assert.strictEqual(context.pendingForTest.size, 0);

            console.log('P1-125 bounded executeScript actual-settlement/singleton regression PASS');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          p1125 = '\n'.join(line[10:] if line.startswith('          ') else line for line in p1125.splitlines()) + '\n'
          (root / 'project_tools' / 'test_p1_125_execute_script_settlement.js').write_text(p1125, encoding='utf-8')

          # ---------- Dedicated P1-126 regression ----------
          p1126 = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const sw = fs.readFileSync(path.join(root, 'service-worker.js'), 'utf8');

          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          assert(sw.includes('const TAB_GET_TIMEOUT_MS = 5_000;'));
          assert.strictEqual((sw.match(/chrome\.tabs\.get\(/g) || []).length, 1, 'service worker must have exactly one low-level tabs.get call');
          const getHelper = section(sw, 'function getChromeTabBounded', 'async function createTabNextTo');
          assert(getHelper.includes('withOperationTimeout('));
          assert(getHelper.includes('chrome.tabs.get(id)'));

          const createBlock = section(sw, 'async function createTabNextTo', 'const CONTENT_SCRIPT_MESSAGE_TYPES');
          assert(createBlock.includes("getChromeTabBounded(id, 'Определение позиции новой вкладки')"));
          const journalBlock = section(sw, 'async function openJournalPage', 'function makeTabCreatePendingError');
          assert(journalBlock.includes("getChromeTabBounded(tabId, 'Проверка исходной вкладки журнала')"));
          assert(journalBlock.includes("getChromeTabBounded(placementTabId, 'Проверка anchor-вкладки журнала')"));
          const cacheBlock = section(sw, 'async function getValidCachedPdfForTab', 'async function cleanupExpiredPdfCache');
          assert(cacheBlock.includes("getChromeTabBounded(tabId, 'Проверка текущего URL PDF retry cache')"));
          const actionBlock = section(sw, 'async function updateActionForTab', 'chrome.tabs.onActivated.addListener');
          assert(actionBlock.includes("getChromeTabBounded(tabId, 'Чтение URL вкладки для Chrome Action')"));

          (async () => {
            let calls = 0;
            const chrome = { tabs: { get() { calls += 1; return new Promise(() => {}); } } };
            function withOperationTimeout(promise, timeoutMs, label) {
              let timer = 0;
              return Promise.race([
                Promise.resolve(promise),
                new Promise((_, reject) => {
                  timer = setTimeout(() => {
                    const error = new Error(`${label} timeout`);
                    error.code = 'WEBCLIP_TIMEOUT';
                    reject(error);
                  }, timeoutMs);
                })
              ]).finally(() => { if (timer) clearTimeout(timer); });
            }
            const context = vm.createContext({ Promise, Error, Number, Math, chrome, withOperationTimeout });
            vm.runInContext(`const TAB_GET_TIMEOUT_MS = 20;\n${getHelper}\nthis.getForTest = getChromeTabBounded;`, context);
            let error = null;
            try { await context.getForTest(9, 'hung tabs.get'); }
            catch (caught) { error = caught; }
            assert(error, 'hung tabs.get must reject by deadline');
            assert.strictEqual(error.code, 'WEBCLIP_TIMEOUT');
            assert.strictEqual(calls, 1);

            let invalid = null;
            try { await context.getForTest(0); }
            catch (caught) { invalid = caught; }
            assert(invalid);
            assert.strictEqual(invalid.code, 'WEBCLIP_INVALID_TAB_ID');
            assert.strictEqual(calls, 1, 'invalid tabId must fail before Chrome API call');

            console.log('P1-126 centralized bounded tabs.get regression PASS');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          p1126 = '\n'.join(line[10:] if line.startswith('          ') else line for line in p1126.splitlines()) + '\n'
          (root / 'project_tools' / 'test_p1_126_tabs_get_deadlines.js').write_text(p1126, encoding='utf-8')

          # ---------- Registry reconciliation ----------
          priorities_path = root / 'project_docs' / 'PRIORITIES_P0_P1_P2.md'
          priorities = priorities_path.read_text(encoding='utf-8')
          rows = {
            'P1-125': '| P1-125 | P1 | REGRESSION | Все service-worker `chrome.scripting.executeScript()` проходят через bounded actual-settlement helper: local timeout не запускает identical reinjection, late success сохраняется bounded one-use receipt; `content.js` и `frame-agent.js` сохраняют singleton guards. |',
            'P1-126': '| P1-126 | P1 | REGRESSION | Все service-worker `chrome.tabs.get()` сведены к одному `getChromeTabBounded()` с deadline 5 с. Journal source/anchor остаются fail-closed, PDF retry cache при неизвестном текущем URL инвалидируется, Action update молча прекращается, а tab positioning безопасно деградирует без зависания. |'
          }
          for code, row in rows.items():
              if re.search(rf'^\|\s*{re.escape(code)}\s*\|', priorities, re.M):
                  priorities = re.sub(rf'^\|\s*{re.escape(code)}\s*\|.*$', row, priorities, count=1, flags=re.M)
              else:
                  priorities = priorities.rstrip() + '\n' + row + '\n'
          priorities_path.write_text(priorities, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '''### Audit WIP — P1-125 / P1-126

          Service-worker script injection теперь имеет 10-секундный caller deadline с actual-settlement tracking: одинаковый retry не запускает второй `executeScript()`, а late success временно сохраняется как одноразовый receipt; `content.js`/`frame-agent.js` остаются singleton-safe. Все `tabs.get()` worker-кода проходят через единый 5-секундный bounded helper с прежними fail-safe/fail-closed семантиками каждого caller. Manifest остаётся `0.9.8`; это не release QA.

          '''
          note = '\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines()) + '\n'
          if '### Audit WIP — P1-125 / P1-126' not in readme:
              marker = '## Изменения 0.9.7'
              if marker not in readme: raise SystemExit('README marker missing')
              readme_path.write_text(readme.replace(marker, note + marker, 1), encoding='utf-8')

          qa_path = root / 'QA_STATUS_0_9_9.md'
          qa = qa_path.read_text(encoding='utf-8')
          qa_note = '''

          ## 2026-08-25 — P1-125 / P1-126

          - P1-125: оба service-worker `scripting.executeScript()` пути используют один bounded actual-settlement helper. Unknown local timeout держит per-request barrier; identical retry не выполняет повторную инъекцию, late success возвращается один раз из bounded receipt. Script-level singleton guards `content.js` и `frame-agent.js` сохранены.
          - P1-126: все пять service-worker `tabs.get()` мест сведены к `getChromeTabBounded()` (5 с); низкоуровневый `chrome.tabs.get()` остался ровно в одном helper.
          - Dedicated regressions: `test_p1_125_execute_script_settlement.js`, `test_p1_126_tabs_get_deadlines.js`.
          - Manifest остаётся `0.9.8`; реальные Chrome timing/navigation races остаются release regression QA.
          '''
          qa_note = '\n'.join(line[10:] if line.startswith('          ') else line for line in qa_note.splitlines()) + '\n'
          if '## 2026-08-25 — P1-125 / P1-126' not in qa:
              qa_path.write_text(qa.rstrip() + qa_note, encoding='utf-8')

          print('P1-125/P1-126 patch complete')
          PY

      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 73
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 60
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          test "$(grep -o 'chrome\.scripting\.executeScript(' service-worker.js | wc -l)" -eq 1
          test "$(grep -o 'chrome\.tabs\.get(' service-worker.js | wc -l)" -eq 1
          git diff --check

      - name: Write closure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > P1-125_CLOSURE.md <<'EOF'
          # P1-125 closure — bounded scripting.executeScript with singleton-safe late injection

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          Both service-worker injection paths now use one `executeScriptSingletonBounded()` contract with a 10-second caller deadline while retaining the actual non-cancellable Chrome promise until settlement. An identical request cannot start a second injection while the original settlement is unknown. A late successful result is held as a bounded 60-second one-use receipt so the next identical retry consumes the original result instead of reinjecting.

