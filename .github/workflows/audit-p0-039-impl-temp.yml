name: Audit P0-039 exact implementation temporary

on:
  push:
    branches:
      - fix/p0-039-local-download-dead-letter-2026-09-01

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply and commit exact source patch
        run: |
          set -euo pipefail
          python project_tools/apply_p0_039_patch_temp.py
          node --check service-worker.js
          git diff --check
          rm project_tools/apply_p0_039_patch_temp.py
          rm .github/workflows/audit-p0-039-impl-temp.yml
          git config user.name lukindv77
          git config user.email lukindv@gmail.com
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'fix: preserve unknown local download recovery checkpoints'
          git push origin HEAD:fix/p0-039-local-download-dead-letter-2026-09-01
