name: Close P1-081 and P1-084

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-p1-081-p1-084.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          sw_path = root / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')

          def replace_block(text, start, end, new):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'missing start marker: {start}')
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'missing end marker: {end}')
              return text[:i] + new.rstrip() + text[j:]

          old_constants = "const MAINTENANCE_IDB_TX_TIMEOUT_MS = 20_000;\nconst JOURNAL_CRUD_IDB_TX_TIMEOUT_MS = 20_000;"
          new_constants = "const MAINTENANCE_IDB_TX_TIMEOUT_MS = 20_000;\nconst OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS = 20_000;\nconst PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS = 20_000;\nconst JOURNAL_CRUD_IDB_TX_TIMEOUT_MS = 20_000;"
          if old_constants not in sw:
              raise SystemExit('timeout constant anchor not found')
          sw = sw.replace(old_constants, new_constants, 1)

          sw = replace_block(sw,
          "async function mutateOperationLogOnce(operationId, mutate) {",
          "\n\nfunction isStorageQuotaError",
          r'''async function mutateOperationLogOnce(operationId, mutate) {
            const db = await openOperationLogDb();
            try {
              return await runIndexedDbTransactionBounded(
                db,
                OPERATION_LOG_STORE,
                'readwrite',
                'Изменение заголовка диагностического лога',
                ({ store, setResult, fail }) => {
                  const operationStore = store();
                  const get = operationStore.get(operationId);
                  get.onsuccess = () => {
                    try {
                      const now = Date.now();
                      const record = get.result || {
                        operationId,
                        type: 'operation',
                        title: 'Операция WebClip',
                        createdAt: now,
                        updatedAt: now,
                        status: 'running',
                        summary: '',
                        meta: {},
                        events: []
                      };
                      let output = mutate(record, now) || record;
                      if (!Array.isArray(output.events)) output.events = [];
                      output.updatedAt = now;
                      output = boundOperationLogRecord(output);
                      operationStore.put(output);
                      setResult(output);
                    } catch (error) {
                      fail(error);
                    }
                  };
                  get.onerror = () => fail(get.error || new Error('Не удалось прочитать диагностический лог.'));
                },
                OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally {
              db.close();
            }
          }''')

          sw = replace_block(sw,
          "async function appendOperationLogEventOnce(operationId, event = {}) {",
          "\n\nasync function appendOperationLogEventDurable",
          r'''async function appendOperationLogEventOnce(operationId, event = {}) {
            const id = String(operationId || '').trim();
            if (!id) return null;
            const normalized = boundOperationLogEvent({
              timestamp: Number(event.timestamp || Date.now()),
              category: String(event.category || 'event'),
              level: String(event.level || 'info'),
              stage: String(event.stage || ''),
              message: String(sanitizeOperationLogValue(String(event.message || ''), 'message')),
              data: sanitizeOperationLogValue(event.data || {})
            });
            const eventChars = Math.min(MAX_OPERATION_LOG_EVENT_JSON_CHARS, jsonSizeChars(normalized));
            const db = await openOperationLogDb();
            try {
              return await runIndexedDbTransactionBounded(
                db,
                [OPERATION_LOG_STORE, OPERATION_LOG_EVENT_STORE],
                'readwrite',
                'Сохранение события диагностического лога',
                ({ tx, setResult, fail }) => {
                  const operations = tx.objectStore(OPERATION_LOG_STORE);
                  const events = tx.objectStore(OPERATION_LOG_EVENT_STORE);
                  const get = operations.get(id);
                  const abortWith = (error) => fail(error instanceof Error
                    ? error
                    : new Error(String(error || 'Не удалось сохранить событие диагностического лога.')));

                  get.onsuccess = () => {
                    try {
                      const now = Date.now();
                      const record = get.result || {
                        operationId: id,
                        type: 'operation',
                        title: 'Операция WebClip',
                        createdAt: now,
                        updatedAt: now,
                        status: 'running',
                        summary: '',
                        meta: {},
                        events: []
                      };

                      // One-time migration for a legacy v1 record. Keep the start event in
                      // the small operation header and move the remaining timeline to the
                      // append-only event store so future events no longer rewrite history.
                      const legacy = Array.isArray(record.events) ? record.events : [];
                      if (legacy.length) {
                        const startEvent = record.operationStartEvent || legacy.find((item) => item?.category === 'operation-start') || null;
                        if (startEvent) record.operationStartEvent = boundOperationLogEvent(startEvent);
                        const tail = legacy.filter((item) => item !== startEvent && item?.category !== 'operation-start').slice(-(MAX_OPERATION_LOG_EVENTS - 1));
                        let seq = 1;
                        let chars = 0;
                        for (const item of tail) {
                          const bounded = boundOperationLogEvent(item);
                          const size = Math.min(MAX_OPERATION_LOG_EVENT_JSON_CHARS, jsonSizeChars(bounded));
                          events.put({ operationId: id, seq, event: bounded, jsonChars: size });
                          chars += size;
                          seq += 1;
                        }
                        record.events = [];
                        record.eventStoreCount = tail.length;
                        record.eventStoreChars = chars;
                        record.nextEventSeq = seq;
                        if (legacy.length > tail.length + (startEvent ? 1 : 0)) record.eventsTruncated = true;
                      }

                      if (!record.operationStartEvent) {
                        record.operationStartEvent = boundOperationLogEvent({ timestamp: Number(record.createdAt || now), category: 'operation-start', level: 'info', message: 'Операция начата.', data: {} });
                      }
                      let count = Math.max(0, Number(record.eventStoreCount) || 0);
                      let chars = Math.max(0, Number(record.eventStoreChars) || 0);
                      const seq = Math.max(1, Math.floor(Number(record.nextEventSeq) || 1));
                      events.put({ operationId: id, seq, event: normalized, jsonChars: eventChars });
                      count += 1;
                      chars += eventChars;
                      record.nextEventSeq = seq + 1;

                      const needsPrune = () => count > (MAX_OPERATION_LOG_EVENTS - 1) || chars > MAX_OPERATION_LOG_EVENT_TOTAL_JSON_CHARS;
                      const finalize = () => {
                        record.eventStoreCount = count;
                        record.eventStoreChars = chars;
                        record.eventCount = 1 + count;
                        if (event.status) record.status = String(event.status);
                        if (event.summary) record.summary = String(sanitizeOperationLogValue(String(event.summary), 'summary'));
                        record.updatedAt = now;
                        const output = boundOperationLogRecord(record);
                        operations.put(output);
                        setResult(output);
                      };

                      if (!needsPrune()) {
                        finalize();
                        return;
                      }

                      const range = IDBKeyRange.bound([id, 0], [id, Number.MAX_SAFE_INTEGER]);
                      const cursorRequest = events.openCursor(range, 'next');
                      cursorRequest.onsuccess = () => {
                        try {
                          const cursor = cursorRequest.result;
                          if (!cursor || !needsPrune()) {
                            if (needsPrune()) {
                              abortWith(new Error('Не удалось ограничить размер timeline диагностического лога.'));
                              return;
                            }
                            finalize();
                            return;
                          }
                          const row = cursor.value || {};
                          // Never delete the event we just appended unless it is individually
                          // too large (boundOperationLogEvent already prevents that case).
                          if (Number(row.seq) === seq && count <= 1) {
                            finalize();
                            return;
                          }
                          chars = Math.max(0, chars - Math.max(0, Number(row.jsonChars) || jsonSizeChars(row.event || {})));
                          count = Math.max(0, count - 1);
                          record.eventsTruncated = true;
                          cursor.delete();
                          cursor.continue();
                        } catch (error) {
                          abortWith(error);
                        }
                      };
                      cursorRequest.onerror = () => abortWith(cursorRequest.error || new Error('Не удалось ограничить timeline диагностического лога.'));
                    } catch (error) {
                      abortWith(error);
                    }
                  };
                  get.onerror = () => abortWith(get.error || new Error('Не удалось прочитать диагностический лог.'));
                },
                OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally {
              db.close();
            }
          }''')

          sw = replace_block(sw,
          "async function listOperationLogs(limit = 100) {",
          "\n\nasync function clearOperationLogs() {",
          r'''async function listOperationLogs(limit = 100) {
            const capped = Math.max(1, Math.min(500, Number(limit) || 100));
            const db = await openOperationLogDb();
            try {
              return await runIndexedDbTransactionBounded(
                db,
                OPERATION_LOG_STORE,
                'readonly',
                'Чтение списка диагностических логов',
                ({ store, setResult, fail }) => {
                  const index = store().index('updatedAt');
                  const result = [];
                  const request = index.openCursor(null, 'prev');
                  request.onsuccess = () => {
                    try {
                      const cursor = request.result;
                      if (!cursor || result.length >= capped) {
                        setResult({ ok: true, operations: result });
                        return;
                      }
                      const record = cursor.value || {};
                      result.push({
                        operationId: record.operationId || '', type: record.type || 'operation', title: record.title || 'Операция WebClip',
                        description: record.description || describeOperation(record.type, record.title, record.meta || {}),
                        createdAt: Number(record.createdAt || 0), updatedAt: Number(record.updatedAt || 0),
                        status: record.status || 'running', summary: record.summary || '', eventCount: Math.max(0, Number(record.eventCount) || (Array.isArray(record.events) ? record.events.length : 0))
                      });
                      cursor.continue();
                    } catch (error) {
                      fail(error);
                    }
                  };
                  request.onerror = () => fail(request.error || new Error('Не удалось прочитать список логов.'));
                },
                OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { db.close(); }
          }''')

          sw = replace_block(sw,
          "async function clearOperationLogs() {",
          "\n\nfunction operationLogExportFilename",
          r'''async function clearOperationLogs() {
            const pending = [...operationLogWriteChains.values()];
            if (pending.length) await Promise.allSettled(pending);
            operationLogWriteChains.clear();
            const db = await openOperationLogDb();
            try {
              await runIndexedDbTransactionBounded(
                db,
                [OPERATION_LOG_STORE, OPERATION_LOG_EVENT_STORE],
                'readwrite',
                'Очистка диагностических логов',
                ({ tx, fail }) => {
                  const operationRequest = tx.objectStore(OPERATION_LOG_STORE).clear();
                  const eventRequest = tx.objectStore(OPERATION_LOG_EVENT_STORE).clear();
                  operationRequest.onerror = () => fail(operationRequest.error || new Error('Не удалось удалить диагностические логи.'));
                  eventRequest.onerror = () => fail(eventRequest.error || new Error('Не удалось удалить timeline диагностических логов.'));
                },
                OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { db.close(); }
            return { ok: true };
          }''')

          sw = replace_block(sw,
          "async function getOperationLog(operationId) {",
          "\n\nfunction deleteOperationLogEventsInTransaction",
          r'''async function getOperationLog(operationId) {
            const id = String(operationId || '').trim();
            if (!id) throw new Error('Укажите ID операции.');
            const pending = operationLogWriteChains.get(id);
            if (pending) await pending.catch(() => {});
            const db = await openOperationLogDb();
            try {
              const record = await runIndexedDbTransactionBounded(
                db,
                [OPERATION_LOG_STORE, OPERATION_LOG_EVENT_STORE],
                'readonly',
                'Чтение диагностического лога',
                ({ tx, setResult, fail }) => {
                  const operations = tx.objectStore(OPERATION_LOG_STORE);
                  const events = tx.objectStore(OPERATION_LOG_EVENT_STORE);
                  const request = operations.get(id);
                  let header = null;
                  const storedEvents = [];
                  request.onsuccess = () => {
                    try {
                      header = request.result || null;
                      if (!header) {
                        setResult(null);
                        return;
                      }
                      const range = IDBKeyRange.bound([id, 0], [id, Number.MAX_SAFE_INTEGER]);
                      const cursorRequest = events.openCursor(range, 'next');
                      cursorRequest.onsuccess = () => {
                        try {
                          const cursor = cursorRequest.result;
                          if (!cursor) {
                            const legacy = Array.isArray(header.events) ? header.events : [];
                            const startEvent = header.operationStartEvent || legacy.find((item) => item?.category === 'operation-start') || null;
                            const legacyTail = legacy.filter((item) => item !== startEvent && item?.category !== 'operation-start');
                            const output = { ...header };
                            output.events = [startEvent, ...legacyTail, ...storedEvents].filter(Boolean).slice(-MAX_OPERATION_LOG_EVENTS);
                            if (startEvent && output.events[0] !== startEvent) {
                              output.events = [startEvent, ...output.events.slice(-(MAX_OPERATION_LOG_EVENTS - 1))];
                            }
                            delete output.operationStartEvent;
                            delete output.eventStoreCount;
                            delete output.eventStoreChars;
                            delete output.nextEventSeq;
                            output.eventCount = output.events.length;
                            setResult(output);
                            return;
                          }
                          storedEvents.push(cursor.value?.event || {});
                          cursor.continue();
                        } catch (error) {
                          fail(error);
                        }
                      };
                      cursorRequest.onerror = () => fail(cursorRequest.error || new Error('Не удалось прочитать timeline диагностического лога.'));
                    } catch (error) {
                      fail(error);
                    }
                  };
                  request.onerror = () => fail(request.error || new Error('Не удалось получить диагностический лог.'));
                },
                OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS
              );
              if (!record) throw new Error(`Лог операции ${id} не найден или уже удалён по сроку хранения.`);
              if (!record.description) record.description = describeOperation(record.type, record.title, record.meta || {});
              return { ok: true, log: record };
            } finally { db.close(); }
          }''')

          sw = replace_block(sw,
          "async function putCachedPdf(record) {",
          "\n\nasync function getCachedPdfByKey(key) {",
          r'''async function putCachedPdf(record) {
            if (!record?.key) throw new Error('Не указан ключ PDF cache.');
            const normalizedRecord = { ...record };
            const sourceBase64 = typeof normalizedRecord.pdfBase64 === 'string' ? normalizedRecord.pdfBase64 : '';
            const anticipatedPdfBytes = sourceBase64
              ? base64DecodedByteLength(sourceBase64)
              : normalizedRecord.pdfBlob instanceof Blob
                ? normalizedRecord.pdfBlob.size
                : Math.max(0, Number(normalizedRecord.pdfByteLength) || 0);
            await ensureStorageBudget(anticipatedPdfBytes, 'временного PDF cache');
            if (sourceBase64) {
              const blob = pdfBase64ToBlob(sourceBase64);
              normalizedRecord.pdfBlob = blob;
              normalizedRecord.pdfByteLength = blob.size;
              normalizedRecord.pdfBase64Chars = sourceBase64.length;
              normalizedRecord.cacheFormat = 'blob-v3';
              delete normalizedRecord.pdfBase64;
            }
            const metadata = pdfCacheMetadataFromRecord(normalizedRecord);
            normalizedRecord.pdfByteLength = metadata.pdfByteLength;
            normalizedRecord.pdfBase64Chars = metadata.pdfBase64Chars;
            normalizedRecord.cacheFormat = metadata.cacheFormat;
            const db = await openPdfCacheDb();
            try {
              await runIndexedDbTransactionBounded(
                db,
                [PDF_CACHE_STORE, PDF_CACHE_META_STORE],
                'readwrite',
                'Сохранение PDF retry-cache',
                ({ tx, fail }) => {
                  const pdfRequest = tx.objectStore(PDF_CACHE_STORE).put(normalizedRecord);
                  const metaRequest = tx.objectStore(PDF_CACHE_META_STORE).put(metadata);
                  pdfRequest.onerror = () => fail(pdfRequest.error || new Error('Не удалось сохранить PDF для повторной отправки.'));
                  metaRequest.onerror = () => fail(metaRequest.error || new Error('Не удалось сохранить metadata PDF для повторной отправки.'));
                },
                PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { db.close(); }
            return metadata;
          }''')

          sw = replace_block(sw,
          "async function getCachedPdfByKey(key) {",
          "\n\nasync function getCachedPdfMetadataByKey(key) {",
          r'''async function getCachedPdfByKey(key) {
            const cacheKey = String(key || '');
            if (!cacheKey) return null;
            const db = await openPdfCacheDb();
            try {
              return await runIndexedDbTransactionBounded(
                db,
                PDF_CACHE_STORE,
                'readonly',
                'Чтение PDF retry-cache',
                ({ store, setResult, fail }) => {
                  const request = store().get(cacheKey);
                  request.onsuccess = () => setResult(request.result || null);
                  request.onerror = () => fail(request.error || new Error('Не удалось прочитать локальный кэш PDF.'));
                },
                PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { db.close(); }
          }''')

          sw = replace_block(sw,
          "async function getCachedPdfMetadataByKey(key) {",
          "\n\nasync function getValidCachedPdfForTab(tabId) {",
          r'''async function getCachedPdfMetadataByKey(key) {
            const cacheKey = String(key || '');
            if (!cacheKey) return null;
            const db = await openPdfCacheDb();
            try {
              const metadata = await runIndexedDbTransactionBounded(
                db,
                PDF_CACHE_META_STORE,
                'readonly',
                'Чтение metadata PDF retry-cache',
                ({ store, setResult, fail }) => {
                  const request = store().get(cacheKey);
                  request.onsuccess = () => setResult(request.result || null);
                  request.onerror = () => fail(request.error || new Error('Не удалось прочитать metadata PDF cache.'));
                },
                PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS
              );
              if (metadata) return metadata;
            } finally { db.close(); }

            // Compatibility fallback for a cache record left by a pre-v2 build.
            const legacy = await getCachedPdfByKey(cacheKey);
            if (!legacy) return null;
            const metadata = pdfCacheMetadataFromRecord(legacy);
            const repairDb = await openPdfCacheDb();
            try {
              await runIndexedDbTransactionBounded(
                repairDb,
                PDF_CACHE_META_STORE,
                'readwrite',
                'Восстановление metadata PDF retry-cache',
                ({ store, fail }) => {
                  const request = store().put(metadata);
                  request.onerror = () => fail(request.error || new Error('Не удалось восстановить metadata PDF cache.'));
                },
                PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { repairDb.close(); }
            return metadata;
          }''')

          sw = replace_block(sw,
          "async function deleteCachedPdfByKey(key) {",
          "\n\nasync function deleteCachedPdf(tabId) {",
          r'''async function deleteCachedPdfByKey(key) {
            const cacheKey = String(key || '');
            if (!cacheKey) return;
            const db = await openPdfCacheDb();
            try {
              await runIndexedDbTransactionBounded(
                db,
                [PDF_CACHE_STORE, PDF_CACHE_META_STORE],
                'readwrite',
                'Удаление PDF retry-cache',
                ({ tx, fail }) => {
                  const pdfRequest = tx.objectStore(PDF_CACHE_STORE).delete(cacheKey);
                  const metaRequest = tx.objectStore(PDF_CACHE_META_STORE).delete(cacheKey);
                  pdfRequest.onerror = () => fail(pdfRequest.error || new Error('Не удалось очистить локальный кэш PDF.'));
                  metaRequest.onerror = () => fail(metaRequest.error || new Error('Не удалось очистить metadata локального кэша PDF.'));
                },
                PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS
              );
            } finally { db.close(); }
          }''')

          sw_path.write_text(sw, encoding='utf-8')

          # Existing v1->v2 OperationLog regression now executes through the common
          # bounded helper as production does.
          op_test_path = root / 'project_tools' / 'test_operation_log_v1_v2.js'
          op_test = op_test_path.read_text(encoding='utf-8')
          anchor = "    MAX_OPERATION_LOG_EVENT_TOTAL_JSON_CHARS: 3 * 1024 * 1024,\n    operationLogWriteChains: new Map(),"
          replacement = "    MAX_OPERATION_LOG_EVENT_TOTAL_JSON_CHARS: 3 * 1024 * 1024,\n    OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS: 20_000,\n    operationLogWriteChains: new Map(),"
          if anchor not in op_test:
              raise SystemExit('OperationLog test context anchor not found')
          op_test = op_test.replace(anchor, replacement, 1)
          anchor = "  const boundsCode = section(swSource, 'function sanitizeOperationLogValue', 'function queueOperationLogWrite');"
          replacement = "  const helperCode = section(swSource, 'function runIndexedDbTransactionBounded', 'function openOperationLogDb');\n  const boundsCode = section(swSource, 'function sanitizeOperationLogValue', 'function queueOperationLogWrite');"
          if anchor not in op_test:
              raise SystemExit('OperationLog helper extraction anchor not found')
          op_test = op_test.replace(anchor, replacement, 1)
          old_vm = "  vm.runInContext(`${boundsCode}\\n${appendCode}\\n${getCode}\\nthis.appendForTest = appendOperationLogEventOnce; this.getForTest = getOperationLog;`, context);"
          new_vm = "  vm.runInContext(`${helperCode}\\n${boundsCode}\\n${appendCode}\\n${getCode}\\nthis.appendForTest = appendOperationLogEventOnce; this.getForTest = getOperationLog;`, context);"
          if old_vm not in op_test:
              raise SystemExit('OperationLog vm execution anchor not found')
          op_test = op_test.replace(old_vm, new_vm, 1)
          op_test_path.write_text(op_test, encoding='utf-8')

          deadline_test = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const sw = fs.readFileSync(path.join(root, 'service-worker.js'), 'utf8');
          const offscreen = fs.readFileSync(path.join(root, 'offscreen.js'), 'utf8');

          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing source markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          assert(sw.includes('const OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS = 20_000;'));
          assert(sw.includes('const PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS = 20_000;'));

          const operationSections = [
            section(sw, 'async function mutateOperationLogOnce(operationId, mutate) {', 'function isStorageQuotaError'),
            section(sw, 'async function appendOperationLogEventOnce(operationId, event = {}) {', 'async function appendOperationLogEventDurable'),
            section(sw, 'async function listOperationLogs(limit = 100) {', 'async function clearOperationLogs() {'),
            section(sw, 'async function clearOperationLogs() {', 'function operationLogExportFilename'),
            section(sw, 'async function getOperationLog(operationId) {', 'function deleteOperationLogEventsInTransaction')
          ];
          for (const source of operationSections) {
            assert(source.includes('runIndexedDbTransactionBounded'), 'ordinary OperationLog transaction must use bounded helper');
            assert(source.includes('OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS'), 'ordinary OperationLog transaction must use dedicated CRUD timeout');
          }
          assert(!operationSections[2].includes('resolve({ ok: true'), 'OperationLog list must not publish from cursor request success');
          assert(operationSections[2].includes('setResult({ ok: true, operations: result })'));
          assert(operationSections[4].includes('setResult(output)'), 'OperationLog detail result must be staged until tx completion');

          const operationMaintenance = section(sw, 'async function cleanupExpiredOperationLogs', 'async function runLoggedOperationLogCleanup');
          assert(operationMaintenance.includes('MAINTENANCE_IDB_TX_TIMEOUT_MS'), 'maintenance deadline domain must remain separate');

          const pdfSections = [
            section(sw, 'async function putCachedPdf(record) {', 'async function getCachedPdfByKey(key) {'),
            section(sw, 'async function getCachedPdfByKey(key) {', 'async function getCachedPdfMetadataByKey(key) {'),
            section(sw, 'async function getCachedPdfMetadataByKey(key) {', 'async function getValidCachedPdfForTab(tabId) {'),
            section(sw, 'async function deleteCachedPdfByKey(key) {', 'async function deleteCachedPdf(tabId) {')
          ];
          for (const source of pdfSections) {
            assert(source.includes('runIndexedDbTransactionBounded'), 'ordinary PDF retry-cache transaction must use bounded helper');
            assert(source.includes('PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS'), 'ordinary PDF retry-cache transaction must use dedicated CRUD timeout');
          }
          assert(pdfSections[1].includes('setResult(request.result || null)'), 'PDF cache readonly result must be staged');
          assert(pdfSections[2].includes('setResult(request.result || null)'), 'PDF metadata readonly result must be staged');
          assert(pdfSections[0].includes('[PDF_CACHE_STORE, PDF_CACHE_META_STORE]'), 'PDF + metadata write must remain atomic in one transaction');
          assert(pdfSections[3].includes('[PDF_CACHE_STORE, PDF_CACHE_META_STORE]'), 'PDF + metadata delete must remain atomic in one transaction');

          const validCache = section(sw, 'async function getValidCachedPdfForTab(tabId) {', 'async function cleanupExpiredPdfCache() {');
          assert(validCache.includes('PDF_CACHE_TTL_MS'));
          assert(validCache.includes('currentUrl !== cachedUrl'), 'P0-023 URL binding must remain intact');
          const pdfMaintenance = section(sw, 'async function cleanupExpiredPdfCache() {', 'async function deleteCachedPdfByKey(key) {');
          assert(pdfMaintenance.includes('MAINTENANCE_IDB_TX_TIMEOUT_MS'), 'PDF maintenance keeps its maintenance deadline domain');

          // Offscreen already has an independent bounded IDB deadline path for
          // reading retry-cache bytes during Blob creation/Yandex upload. P1-084
          // must not regress or duplicate that subsystem.
          assert(offscreen.includes('function timeoutIdbTransaction'));
          assert(offscreen.includes('async function getPdfCacheRecord'));
          assert(offscreen.includes('boundedIdbPhaseTimeout'));

          const helperCode = section(sw, 'function runIndexedDbTransactionBounded', 'function openOperationLogDb');
          const context = vm.createContext({ console, Promise, Error, Number, Math, String, Array, Object, setTimeout, clearTimeout });
          vm.runInContext(`${helperCode}\nthis.runBoundedForTest = runIndexedDbTransactionBounded;`, context);

          class HungTransaction {
            constructor() {
              this.oncomplete = null;
              this.onerror = null;
              this.onabort = null;
              this.error = null;
              this.aborted = false;
            }
            objectStore() { return {}; }
            abort() {
              if (this.aborted) return;
              this.aborted = true;
              queueMicrotask(() => this.onabort?.());
            }
          }

          let hungTx = null;
          const hungDb = { transaction() { hungTx = new HungTransaction(); return hungTx; } };
          let timeoutError = null;
          try {
            await context.runBoundedForTest(hungDb, 'store', 'readonly', 'hung-test', () => {}, 20);
          } catch (error) {
            timeoutError = error;
          }
          assert(timeoutError, 'hung transaction must reject');
          assert.strictEqual(timeoutError.code, 'WEBCLIP_IDB_TIMEOUT');
          assert.strictEqual(hungTx.aborted, true, 'deadline must abort the IndexedDB transaction');

          let manualTx = null;
          let settled = false;
          const manualDb = { transaction() { manualTx = new HungTransaction(); return manualTx; } };
          const pending = context.runBoundedForTest(
            manualDb,
            'store',
            'readonly',
            'readonly-completion-test',
            ({ setResult }) => setResult('staged-result'),
            1000
          ).then((value) => { settled = true; return value; });
          await new Promise((resolve) => setTimeout(resolve, 20));
          assert.strictEqual(settled, false, 'readonly result must not publish before tx.oncomplete');
          manualTx.oncomplete();
          assert.strictEqual(await pending, 'staged-result');

          console.log('P1-081/P1-084 bounded IDB CRUD regression OK');
          '''
          # Remove workflow indentation from the generated JS.
          deadline_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in deadline_test.splitlines()) + '\n'
          (root / 'project_tools' / 'test_p1_081_084_idb_deadlines.js').write_text(deadline_test, encoding='utf-8')

          # Registry: these two history-stable identifiers now have physical closure.
          priorities_path = root / 'project_docs' / 'PRIORITIES_P0_P1_P2.md'
          priorities = priorities_path.read_text(encoding='utf-8')
          for code in ('P1-081', 'P1-084'):
              pattern = re.compile(rf'(\|\s*{re.escape(code)}\s*\|\s*P1\s*\|\s*)(DONE|REGRESSION|PARTIAL|OPEN|AUDIT)(\s*\|)')
              priorities, count = pattern.subn(r'\1REGRESSION\3', priorities)
              if count != 1:
                  raise SystemExit(f'expected exactly one registry row for {code}, found {count}')
          priorities_path.write_text(priorities, encoding='utf-8')

          # Concise WIP note; release/version wording remains unchanged.
          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '''### Audit WIP — P1-081 / P1-084

          Обычные IndexedDB CRUD-пути OperationLog v2 и PDF retry-cache получили отдельные abortable transaction deadlines по 20 секунд. Readonly результаты публикуются только после `tx.oncomplete`; OperationLog сохраняет append-only `events` и v1→v2 migration, а PDF retry-cache сохраняет атомарные пары `pdfs`+`meta`, 24-часовой TTL и URL binding P0-023. Maintenance/offscreen deadline domains остаются отдельными. Manifest остаётся `0.9.8`; это не release QA.

          '''
          note = '\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines()) + '\n'
          if '### Audit WIP — P1-081 / P1-084' not in readme:
              marker = '## Изменения 0.9.7'
              if marker not in readme:
                  raise SystemExit('README insertion marker missing')
              readme = readme.replace(marker, note + marker, 1)
              readme_path.write_text(readme, encoding='utf-8')

          qa_path = root / 'QA_STATUS_0_9_9.md'
          qa = qa_path.read_text(encoding='utf-8')
          qa_note = '''

          ## 2026-08-25 — P1-081 / P1-084: bounded ordinary IDB CRUD

          - P1-081: обычные OperationLog v2 mutate/append/list/get/clear переведены на общий abortable transaction helper с отдельным deadline 20 с; append-only timeline и v1→v2 migration сохранены.
          - P1-084: обычные PDF retry-cache put/get/meta-repair/delete переведены на тот же completion-aware helper с отдельным deadline 20 с; `pdfs`+`meta` остаются атомарной парой, TTL/URL binding не изменены.
          - Maintenance cleanup сохраняет свой deadline domain; offscreen retry-cache reads уже имели independent bounded deadline и не менялись.
          - Добавлен deterministic regression `project_tools/test_p1_081_084_idb_deadlines.js`, включая hung transaction abort и запрет readonly publication до `tx.oncomplete`.
          - Manifest намеренно остаётся `0.9.8`; это не release QA.
          '''
          qa_note = '\n'.join(line[10:] if line.startswith('          ') else line for line in qa_note.splitlines()) + '\n'
          if '## 2026-08-25 — P1-081 / P1-084: bounded ordinary IDB CRUD' not in qa:
              qa_path.write_text(qa.rstrip() + qa_note, encoding='utf-8')

          print('source/tests/docs patch complete')
          PY

      - name: Run deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 69
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 56
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          git diff --check

      - name: Write closure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > P1-081_CLOSURE.md <<'EOF'
          # P1-081 closure — bounded ordinary OperationLog v2 IDB CRUD

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          ## Problem

          OperationLog v2 already had bounded IndexedDB open and bounded maintenance cleanup, but ordinary mutate/append/list/get/clear transactions could still wait indefinitely if an IndexedDB transaction stopped making progress. `list` could also publish a cursor result before the readonly transaction completed.

          ## Closure

          - Added `OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS = 20_000`.
          - Header mutation, append/migration/pruning, list, detail read and full clear use `runIndexedDbTransactionBounded()`.
          - Timeout aborts the transaction and rejects with `WEBCLIP_IDB_TIMEOUT`.
          - Readonly list/detail results are staged and become visible only after `tx.oncomplete`.
          - The v2 append-only `events` store, retained `operationStartEvent`, event count/size pruning and one-time v1 timeline migration remain inside the same atomic readwrite transaction.
          - Maintenance retention/size cleanup keeps its separate maintenance deadline domain.

          ## Evidence

          - `project_tools/test_p1_081_084_idb_deadlines.js` PASS: ordinary OperationLog paths are covered, hung transaction is aborted, readonly result is not published before transaction completion.
          - Existing `project_tools/test_operation_log_v1_v2.js` PASS through the production bounded helper and preserves v1→v2 reconstruction/order.
          - Full post-change deterministic gate: **69/69** JavaScript syntax PASS; **56/56** `project_tools/test_*.js` PASS.

          Real unpacked Chrome remains release QA; this closure does not bump the manifest.
          EOF

          cat > P1-084_CLOSURE.md <<'EOF'
          # P1-084 closure — bounded ordinary PDF retry-cache IDB CRUD

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          ## Problem

          The PDF retry-cache had bounded database open and bounded maintenance cleanup, but ordinary save/read/metadata-repair/delete transactions had no transaction deadline. A hung IndexedDB transaction could therefore retain a generated PDF flow or cache invalidation indefinitely.

          ## Closure

          - Added `PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS = 20_000`.
          - PDF+metadata save remains one atomic readwrite transaction over `pdfs` + `meta` and is abortable on deadline.
          - Full PDF record read and metadata read stage their results and publish only after `tx.oncomplete`.
          - Legacy metadata repair is bounded/abortable.
          - Delete still removes `pdfs` + `meta` atomically in one bounded readwrite transaction.
          - P0-023 invariants are unchanged: retry metadata keeps the 24-hour TTL and exact normalized current-URL binding; stale/mismatched cache is deleted fail-closed.
          - Maintenance cleanup keeps `MAINTENANCE_IDB_TX_TIMEOUT_MS`; offscreen cache reads already have their independent bounded transfer/IDB deadline path and were intentionally not duplicated.

          ## Evidence

          - `project_tools/test_p1_081_084_idb_deadlines.js` PASS: all ordinary service-worker PDF cache CRUD paths use the dedicated deadline, paired writes/deletes stay atomic, readonly publication is completion-aware, and TTL/URL binding remains present.
          - Full post-change deterministic gate: **69/69** JavaScript syntax PASS; **56/56** `project_tools/test_*.js` PASS.

          Real unpacked Chrome/Yandex remains release QA; this closure does not bump the manifest.
          EOF

          cat > STATIC_CHECKS_P1-081_P1-084.md <<'EOF'
          # Static checks — P1-081 / P1-084

          Checkpoint date: 2026-08-25 +07:00.

          Executed on canonical GitHub `main` source patched for P1-081/P1-084 before commit:

          - Manifest parse: PASS; Manifest V3 PASS; version remains **0.9.8**.
          - JavaScript `node --check`: **69/69 PASS**.
          - Deterministic `project_tools/test_*.js`: **56/56 PASS**.
          - Dedicated `project_tools/test_p1_081_084_idb_deadlines.js`: **PASS**.
          - Existing OperationLog v1→v2 migration regression: **PASS**.
          - Ordinary OperationLog CRUD uses dedicated 20 s abortable transaction deadline; readonly result publication is `tx.oncomplete`-gated.
          - Ordinary PDF retry-cache save/read/meta-repair/delete uses dedicated 20 s abortable transaction deadline; paired stores remain atomic.
          - Maintenance/offscreen timeout domains remain separate.

          This is not release QA. Unmanaged unpacked Chrome and real Yandex remain required before any 0.9.9 release claim.
          EOF

          git diff --check

      - name: Commit coherent P1 closure and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
