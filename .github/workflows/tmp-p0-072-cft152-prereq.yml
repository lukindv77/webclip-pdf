name: TEMP P0-072 pinned CfT prerequisite

on:
  push:
    branches:
      - research/p0-072-cft152-prereq-e6cb567b

permissions:
  contents: read

concurrency:
  group: temp-p0-072-cft152-e6cb567b
  cancel-in-progress: false

jobs:
  pinned-cft-headed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WEBCLIP_CANONICAL_SHA: e6cb567b44eeff28a89fc90cc82294bf064bad23
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e6cb567b44eeff28a89fc90cc82294bf064bad23
          fetch-depth: 0

      - name: Overlay exact runtime candidate and research-only physical harness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$WEBCLIP_CANONICAL_SHA"
          git cat-file -e "$GITHUB_SHA^{commit}"
          for path in \
            local-download-identity.js \
            project_tools/browser_p1_007_unpacked_integration.js \
            project_tools/research_p0_072_real_chrome_reset_restart.js \
            project_tools/test_p0_048_local_download_identity.js \
            project_tools/test_p0_072_real_chrome_reset_restart_harness.js \
            service-worker.js
          do
            git show "$GITHUB_SHA:$path" > "$path"
          done
          test "$(git diff --name-only)" = "$(printf '%s\n' \
            local-download-identity.js \
            project_tools/browser_p1_007_unpacked_integration.js \
            project_tools/research_p0_072_real_chrome_reset_restart.js \
            project_tools/test_p0_048_local_download_identity.js \
            project_tools/test_p0_072_real_chrome_reset_restart_harness.js \
            service-worker.js)"
          test "$(git show "$GITHUB_SHA:local-download-identity.js" | git hash-object --stdin)" = "$(git hash-object local-download-identity.js)"
          test "$(git show "$GITHUB_SHA:service-worker.js" | git hash-object --stdin)" = "$(git hash-object service-worker.js)"
          node --check local-download-identity.js
          node --check service-worker.js
          node project_tools/test_p0_048_local_download_identity.js
          node project_tools/test_p0_072_real_chrome_reset_restart_harness.js

      - name: Install historically proven pinned Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          xvfb="$(command -v xvfb-run || true)"
          test -n "$xvfb"
          curl --fail --location --silent --show-error             https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip             -o "$RUNNER_TEMP/chrome-152.zip"
          unzip -q "$RUNNER_TEMP/chrome-152.zip" -d "$RUNNER_TEMP/chrome-152"
          chrome="$RUNNER_TEMP/chrome-152/chrome-linux64/chrome"
          test -x "$chrome"
          "$chrome" --version
          echo "WEBCLIP_CHROME_FOR_TESTING=$chrome" >> "$GITHUB_ENV"

      - name: Run existing P1-007 prerequisite headed under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a env WEBCLIP_CHROME_HEADED=1             node project_tools/browser_p1_007_unpacked_integration.js

      - name: Run P0-072 reset restart harness headed under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a env WEBCLIP_CHROME_HEADED=1             node project_tools/research_p0_072_real_chrome_reset_restart.js

      - name: Witness exact P1-231 candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node project_tools/test_p1_231_s0e_identity_engine_source_spec_model.js
