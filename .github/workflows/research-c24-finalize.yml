name: Research C24 finalize

on:
  push:
    branches: [research/evidence-c24-inert-disclosure-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c24:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Advance C24 baseline and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/.c24-finalize.py
          git rm .github/workflows/research-c24-finalize.yml project_tools/.c24-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m 'research: finalize fresh C24 evidence'
          git push origin HEAD:research/evidence-c24-inert-disclosure-2026-09-02
