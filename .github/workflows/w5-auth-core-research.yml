name: W5 AUTH-CORE research
on:
  push:
    branches:
      - research/w5-auth-core-production-entry-source-spec-2026-09-09
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node project_tools/test_w5_auth_core_production_entry_model.js
      - run: node project_tools/test_w5_auth_core_current_source_inventory.js
      - name: Download exact Chrome for Testing Stable
        run: |
          curl -fL --retry 3 -o chrome.zip https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chrome-linux64.zip
          unzip -q chrome.zip
          ./chrome-linux64/chrome --version
      - name: Run W5 Chrome identity fixture
        run: xvfb-run -a env CHROME_BIN="$PWD/chrome-linux64/chrome" node project_tools/run_w5_auth_core_chrome_identity_fixture.js
