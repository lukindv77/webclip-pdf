name: P1-231 S0-I PR checker research

on:
  push:
    branches:
      - research/p1-231-s0i-pr-checker-integration-2026-09-10

permissions:
  contents: read

jobs:
  s0i-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          check-latest: false

      - name: Run S0-I predecessor and integration models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research-output
          {
            node project_tools/test_p1_231_s0a_package_authority_source_spec_model.js
            node project_tools/test_p1_231_s0b_source_generation_authority_source_spec_model.js
            node project_tools/test_p1_231_s0b_strict_parser_composition_refinement_model.js
            node project_tools/test_p1_231_s0i_pr_checker_integration_source_spec_model.js
          } | tee .research-output/s0i-pr-checker-output.txt

      - name: Upload bounded proof output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: s0i-pr-checker-${{ github.sha }}
          path: .research-output/s0i-pr-checker-output.txt
          if-no-files-found: error
          retention-days: 7
