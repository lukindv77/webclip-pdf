name: Wave 1 SaveOperationReceipt research model

on:
  push:
    branches:
      - research/wave1-save-operation-receipt-architecture-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record Node version
        run: node --version
      - name: Run Wave 1 cross-owner model
        run: node project_tools/test_wave1_save_operation_receipt_model.js
