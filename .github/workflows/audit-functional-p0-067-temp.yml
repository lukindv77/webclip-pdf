name: Audit functional P0-067 temporary browser check

on:
  push:
    branches: [audit/functional-p0-067-host-control-activation-2026-09-01]

permissions:
  contents: read

jobs:
  host-control-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0

      - name: Install Chrome for Testing 152 headless shell
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/chrome-headless-shell.zip \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-headless-shell-linux64.zip
          unzip -q /tmp/chrome-headless-shell.zip -d /tmp/chrome152
          test -x /tmp/chrome152/chrome-headless-shell-linux64/chrome-headless-shell
          /tmp/chrome152/chrome-headless-shell-linux64/chrome-headless-shell --version

      - name: Run P0-067 browser audit
        shell: bash
        env:
          CHROME_BIN: /tmp/chrome152/chrome-headless-shell-linux64/chrome-headless-shell
        run: |
          set -euo pipefail
          python -m py_compile project_tools/audit_host_control_activation.py
          mkdir -p /tmp/p0-067-evidence
          python project_tools/audit_host_control_activation.py --output /tmp/p0-067-evidence
          cat /tmp/p0-067-evidence/result.json
