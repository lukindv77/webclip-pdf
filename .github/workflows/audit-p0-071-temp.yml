name: Audit P0-071 current Chrome closure temporary

on:
  push:
    branches: [fix/p0-071-print-script-freeze-2026-09-01]

permissions:
  contents: read

jobs:
  p0-071-current-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Deterministic preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check pdf-print-guard.js
          node --check project_tools/test_p0_071_print_render_guard.js
          node project_tools/test_p0_071_print_render_guard.js
          python -m py_compile project_tools/audit_p0_071_print_render_guard.py

      - name: Install physical-evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 PyMuPDF==1.26.4
          curl --fail --location --retry 3 --silent --show-error \
            https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip \
            -o /tmp/chrome-linux64.zip
          unzip -q /tmp/chrome-linux64.zip -d /tmp/chrome-for-testing
          /tmp/chrome-for-testing/chrome-linux64/chrome --version

      - name: Chrome 152 physical closure evidence
        shell: bash
        env:
          CHROME_BIN: /tmp/chrome-for-testing/chrome-linux64/chrome
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0-071-evidence
          xvfb-run -a python project_tools/audit_p0_071_print_render_guard.py \
            --chrome "$CHROME_BIN" \
            --headed-extension \
            --output /tmp/p0-071-evidence \
            | tee /tmp/p0-071-evidence/result.json
