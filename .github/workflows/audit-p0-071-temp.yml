name: Audit P0-071 temporary render-cut link guard

on:
  push:
    branches: [audit/functional-p0-071-print-link-scheme-2026-09-01]

permissions:
  contents: read

jobs:
  p0-071-render-cut-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 PyMuPDF==1.26.4

      - name: Install Chrome for Testing 152
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-headless-shell-linux64.zip
          unzip -q /tmp/chrome.zip -d /tmp/chrome
          chmod +x /tmp/chrome/chrome-headless-shell-linux64/chrome-headless-shell
          /tmp/chrome/chrome-headless-shell-linux64/chrome-headless-shell --version

      - name: Run P0-071 physical harness
        shell: bash
        env:
          CHROME_BIN: /tmp/chrome/chrome-headless-shell-linux64/chrome-headless-shell
        run: |
          set -euo pipefail
          python -m py_compile project_tools/audit_print_link_scheme_render_cut.py
          python project_tools/audit_print_link_scheme_render_cut.py --output /tmp/p0-071-evidence | tee /tmp/p0-071-result.json

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-071-render-cut-link-evidence
          path: |
            /tmp/p0-071-evidence
            /tmp/p0-071-result.json
          if-no-files-found: error
