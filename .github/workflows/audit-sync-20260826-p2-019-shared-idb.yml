name: audit-sync-p2-019-shared-idb

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-p2-019:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "13d93b7b840a2f3537a9e1c6610c6d523426aa98"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p2-019-shared-idb.yml"
      - name: Sync P2-019 finding
        shell: python
        env:
          ROW_B64: 
          AUDIT_B64: 
        run: |
          import base64, os
          from pathlib import Path
          priority = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          deep = Path('DEEP_AUDIT_2026-08-25.md')
          p = priority.read_text(encoding='utf-8')
          lines = p.splitlines()
          new_row = base64.b64decode(os.environ['ROW_B64']).decode('utf-8')
          hits = [i for i, line in enumerate(lines) if line.startswith('| P2-019 |')]
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one P2-019 row, got {len(hits)}')
          lines[hits[0]] = new_row
          priority.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          d = deep.read_text(encoding='utf-8')
          marker = '## Continuation 2026-08-26 — shared IndexedDB migration ownership'
          if marker not in d:
              audit = base64.b64decode(os.environ['AUDIT_B64']).decode('utf-8')
              deep.write_text(d.rstrip() + '\n\n' + audit.rstrip() + '\n', encoding='utf-8')
      - name: Verify scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p2-019-shared-idb.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          expected=$'.github/workflows/audit-sync-20260826-p2-019-shared-idb.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          python - <<'PY'
          import json
          m=json.load(open('manifest.json', encoding='utf-8'))
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
      - name: Commit docs-only sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: extend P2-019 shared IDB migration ownership'
          git push