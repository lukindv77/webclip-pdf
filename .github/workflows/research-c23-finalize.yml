name: Research C23 finalize

on:
  push:
    branches: [research/evidence-c23-virtualized-history-2026-09-02]
    paths:
      - .github/workflows/research-c23-finalize.yml

permissions:
  contents: write

jobs:
  finalize-c23:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance C23 baseline and remove temporary receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          s=p.read_text(encoding='utf-8')
          old='| C23 | Virtualized/windowed content history within user-reached range | `NOT-TRIAGED / UNKNOWN` |'
          new='| C23 | Virtualized/windowed content history within user-reached range | `L4-REVALIDATED / FINDING + POSITIVE/GRADUAL-WHEEL/SCROLL-BACK/RECYCLED-HISTORY/CAUSAL CONTROLS (P1-230)` |'
          if s.count(old)!=1: raise SystemExit(f'C23 row count={s.count(old)}')
          s=s.replace(old,new,1)
          marker='\n## Delivery rule\n'
          checkpoint='''\n## Fresh continuation checkpoint — focused C23 Virtualized/windowed user-reached history\n\n`RESEARCH_FULL_RESTART_C23_VIRTUALIZED_HISTORY_2026-09-02.md` records the accepted C23 exact-source physical tranche on canonical source `7d0774054d434b4dd897af3a14a51732018c4cb9`, exact `content.js` blob `f3ee7b51fe9ee94fdfe36e8a7c99f14a548fdc4e`, Google Chrome `151.0.7922.173`, workflow run `33606883094`, job `100172789243`, exact accepted workflow head `355cc40f5d754b45d3da29c69fb466b50e187ef5`, conclusion SUCCESS and raw result SHA-256 `67d332fc775670fec9b2c42a4d6952a9f8df948f40d2e8789e246b18211d3964`.\n\nA window-scrolling virtualizer reuses eight DOM rows. Browser wheel input gradually mounts every logical ID `1…57`; at the deepest point the current window is `50…57`, and after returning to `scrollY=0` the current DOM window is again `1…8` while the fixture still proves every `1…57` was actually mounted/seen. Current WebClip physical PDF after scroll-back contains only IDs `1…8`. Test-only static materialization of the exact seen history inside the same selected host restores IDs `1…57` and the reached-last sentinel, with Exclude/outside controls still omitted.\n\nDuplicate/root-cause reconciliation maps this direct B6 history-loss finding to existing **P1-230 ACTIVE**. No new P-code or Registry wording/status change is required; C20 is excluded by fixture design because no retained nested scrollport exists. C23 therefore advances to `L4-REVALIDATED / FINDING + POSITIVE/GRADUAL-WHEEL/SCROLL-BACK/RECYCLED-HISTORY/CAUSAL CONTROLS (P1-230)`. C24 — Spoilers/disclosures / inert expansion — is next.\n'''
          if marker not in s: raise SystemExit('Delivery marker missing')
          s=s.replace(marker,checkpoint+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/research-c23-virtualized-history.yml
          rm -f .github/workflows/research-c23-finalize.yml
          rm -f project_tools/.c23-physical-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: finalize fresh C23 evidence'
          git push origin HEAD:research/evidence-c23-virtualized-history-2026-09-02
