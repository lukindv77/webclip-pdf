name: audit-sync-20260826-i

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d450b34818a4b7ad1cf1a1db83f3807de0a82c6a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-i.yml"
      - name: Update audit registry
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-181' in p or 'P1-181' in a:
              raise SystemExit('P1-181 already exists; refuse duplicate sync')
          rows = p.splitlines()
          count = 0
          out = []
          for line in rows:
              if line.startswith('| P1-009 |'):
                  count += 1
                  line = '| P1-009 | P1 | PARTIAL | Универсальный многострочный Journal filter функционально работает поверх bounded cursor architecture: до 8 строк × 512 символов, поля Наименование/Комментарии/Сайт/URL, AND/OR и поиск за первой страницей. Аудит выявил незакрытый CPU/deadline worst case. Exact page/count scan всё равно проходит весь подходящий Journal; для поля `Комментарии` `WebClipJournalTextFilter.contains()` многократно делает chunked `slice(...).toLocaleLowerCase()` по `fileComment/journalComment/journalComments`. При допустимых 100k entries и до ~2 MiB comment text на entry worst-case превращается в десятки/сотни GiB повторной нормализации и закономерно упирается в 20-секундный view deadline; последовательные filter refresh могут повторять full scan. Нужен persisted/derived bounded searchable summary/index или другая candidate strategy с versioned self-rebuild, чтобы стоимость запроса зависела от bounded index/candidates, а не от полного heavy payload; точность AND/OR/fields и import/update/delete consistency сохранить. |'
              out.append(line)
          if count != 1:
              raise SystemExit(f'Expected exactly one P1-009 row, got {count}')
          p = '\n'.join(out) + ('\n' if p.endswith('\n') else '')
          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — startup refresh crash consistency\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-181 | P1 | OPEN | `reloadOpenExtensionPagesAfterVersionChange()` делает version-refresh marker не crash-consistent. При новой версии worker сначала выполняет `chrome.storage.local.set({webclipRuntimeBuildVersion: version})`, **после этого** `chrome.tabs.query({})` и best-effort `tabs.reload()` открытых extension pages. Ошибка/timeout/query failure или partial reload после уже committed marker приводит к тому, что следующий MV3 worker start видит текущую version и больше не повторяет repair; старая Journal/Options extension-page может остаться с invalidated/stale runtime context до ручной перезагрузки. Эти Chrome calls также остаются direct/unbounded, что подтверждает P1-158. Нужен durable phase marker `refresh-pending` → bounded tab enumeration/reload receipts → `refresh-complete`, либо commit version marker только после доказанного прохода; partial failures должны сохранять retry state и не создавать reload storm. |\n'''
          marker = '## Continuation 2026-08-26 — P1-009 CPU bound and P1-181 startup refresh'
          if marker in a:
              raise SystemExit('Audit continuation already present')
          a += f'''\n\n{marker}\n\nAudit source-of-truth baseline: `d450b34818a4b7ad1cf1a1db83f3807de0a82c6a`. Documentation-only sync.\n\n### P1-009 is PARTIAL: memory-bounded filtering is not CPU-bounded\n\n`journal-text-filter.js` bounds query shape and avoids constructing one giant lowercase comments string, but each `contains()` call repeatedly slices up to 8192-character chunks and lowercases them. Comment matching traverses file comment, legacy comment and every journal comment. Service-worker Journal view/count code applies this predicate while cursor-scanning the full candidate population in order to compute exact totals and page results. The data model separately permits up to 100k entries and roughly 2 MiB aggregate comment text per entry. Therefore a valid worst-case Journal can require enormous synchronous string processing before the existing view deadline fires; the deadline prevents an infinite wait but does not make the feature usable at its admitted data limits. Repeated search changes can launch repeated scans. A derived/indexed search representation should be rebuildable secondary data, not another unbounded copy of raw comments.\n\n### P1-181: version marker commits before the repair it represents\n\n`reloadOpenExtensionPagesAfterVersionChange()` reads `webclipRuntimeBuildVersion`; on mismatch it writes the new version immediately, then performs a direct `chrome.tabs.query({})`, and best-effort reloads matching extension tabs. Query errors return silently and individual reload errors are swallowed. Because the marker already says the refresh happened, later worker starts skip the entire repair. This is a classic commit-before-side-effect crash-consistency inversion. A phase/receipt state should remain pending until bounded enumeration and reload attempts are durably accounted for. This path also supplies concrete evidence for the broader direct-Chrome-API coverage item P1-158.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-i.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-i.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf '%s\n' "${changed[@]}"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Journal CPU and startup refresh audit findings'
          git push
