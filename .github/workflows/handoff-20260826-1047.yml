name: handoff-20260826-1047

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=a57042fe82e9c8659a6241b23728f613ae905531
          test "$(git rev-parse HEAD~2)" = "$SOURCE"
          mapfile -t changed < <(git diff --name-only "$SOURCE" HEAD | sort)
          expected=$'.github/workflows/handoff-20260826-1047.yml\nproject_tools/_build_handoff_20260826_1047.py'
          actual="$(printf '%s\n' "${changed[@]}")"
          printf '%s\n' "${changed[@]}"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json

      - name: Build synchronized handoff
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/_build_handoff_20260826_1047.py
          python -m zipfile -t handoff/WebClip_Handoff_Audit_2026-08-26_1047_a57042fe.zip
          sha256sum -c handoff/WebClip_Handoff_Audit_2026-08-26_1047_a57042fe.zip.sha256

      - name: Verify scope and clean temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/handoff-20260826-1047.yml
          git rm project_tools/_build_handoff_20260826_1047.py
          git add GITHUB_REPOSITORY_STATE.md PROMPT_FOR_NEW_CHAT.md handoff/LATEST.md \
            handoff/CURRENT_STATE_2026-08-26_1047.md \
            handoff/ARCHIVE_MANIFEST_2026-08-26_1047.txt \
            handoff/WebClip_Handoff_Audit_2026-08-26_1047_a57042fe.zip \
            handoff/WebClip_Handoff_Audit_2026-08-26_1047_a57042fe.zip.sha256

          SOURCE=a57042fe82e9c8659a6241b23728f613ae905531
          git diff --exit-code "$SOURCE" -- manifest.json service-worker.js content.js offscreen.js frame-agent.js journal.js options.js popup.js prepared-save-as.js journal-import-stream.js public-suffix.js || {
            echo 'Production source changed during handoff build' >&2
            exit 1
          }
          git diff --exit-code "$SOURCE" -- project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md || {
            echo 'Canonical audit docs unexpectedly changed during handoff packaging' >&2
            exit 1
          }

          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/handoff-20260826-1047.yml|project_tools/_build_handoff_20260826_1047.py|GITHUB_REPOSITORY_STATE.md|PROMPT_FOR_NEW_CHAT.md|handoff/*) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done
          grep -q 'P0-077' handoff/CURRENT_STATE_2026-08-26_1047.md
          grep -q 'P1-188' handoff/CURRENT_STATE_2026-08-26_1047.md
          grep -q 'P2-019' handoff/CURRENT_STATE_2026-08-26_1047.md
          grep -q 'GitHub `main`' PROMPT_FOR_NEW_CHAT.md

      - name: Commit handoff checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'handoff: snapshot audit state for new chat'
          git push
