name: Research C20 finalize

on:
  push:
    branches: [research/evidence-c20-nested-scroll-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c20:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Advance C20 baseline and remove temporary receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = path.read_text(encoding='utf-8')
          old = "| C20 | Nested scroll / retained scrollports | `NOT-TRIAGED / UNKNOWN` |"
          new = "| C20 | Nested scroll / retained scrollports | `L4-REVALIDATED / FINDING + POSITIVE/SCROLL-POSITION/NESTED/CAUSAL CONTROLS (P0-004)` |"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one C20 baseline row, found {text.count(old)}')
          text = text.replace(old, new)
          marker = '\n## Delivery rule\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one Delivery rule marker, found {text.count(marker)}')
          section = '''\n## Fresh continuation checkpoint — focused C20 Nested scroll / retained scrollports\n\n`RESEARCH_FULL_RESTART_C20_NESTED_SCROLL_2026-09-02.md` records the accepted C20 exact-source physical tranche on canonical source `ae2f6110901471b5a9968cc77c3a58dffe3d7700`, exact `content.js` blob `f3ee7b51fe9ee94fdfe36e8a7c99f14a548fdc4e`, evidence head `7b48bd919e0ce6a16457893d50346abb0c929306`, Google Chrome `151.0.7922.173`, workflow run `33601196091`, job `100155044941`, conclusion SUCCESS and raw result SHA-256 `a58e76e49b94dd52f95257e507c1220b66c656d6222b21896ccb15104e78a89f`.\n\nFresh normal-flow control preserves all `120/120` mounted rows. Current WebClip keeps an ordinary selected `overflow:auto` scrollbox at its `360px` live viewport and physically preserves only rows `1…8`; moving the Include to the long descendant behind that retained ancestor still yields only `1…8`. Setting the same ancestor to `scrollTop=2404` changes the PDF to rows `58…65`. A two-level nested scrollport case preserves only rows `28…34`. Test-only static expansion of the exact prepared nested scrollports to auto height / visible overflow restores all `120/120` rows and FIRST/MIDDLE/LAST while Exclude and outside controls remain omitted.\n\nDuplicate/root-cause reconciliation maps the fresh failure directly to existing **P0-004 ACTIVE**; no new P-code or Registry wording/status change is required. P1-230 remains the separate dynamic/virtualized user-reached-history owner and is not exercised because every C20 node already exists and remains mounted. C20 therefore advances to `L4-REVALIDATED / FINDING + POSITIVE/SCROLL-POSITION/NESTED/CAUSAL CONTROLS (P0-004)`. C21 — Lazy/offscreen resources already belonging to content — is the next sequential coordinate.\n'''
          text = text.replace(marker, section + marker)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f project_tools/.c20-physical-result.json
          rm -f .github/workflows/research-c20-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'research: finalize fresh C20 evidence'
          git push origin HEAD:research/evidence-c20-nested-scroll-2026-09-02
