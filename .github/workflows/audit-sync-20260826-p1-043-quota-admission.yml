name: audit-sync-p1-043-quota-admission
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sync-20260826-p1-043-quota-admission.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard baseline and patch audit docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "06ad6944b6e8b0d3855d58b67baa0dcf51d0a81d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-043-quota-admission.yml"
          python3 - <<'PY'
          import base64, json, pathlib
          p = pathlib.Path('project_docs/PRIORITIES_P0_P1_P2.md')
          d = pathlib.Path('DEEP_AUDIT_2026-08-25.md')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          ap = base64.b64decode('').decode()
          text = p.read_text()
          if old not in text: raise SystemExit('P1-043 baseline text not found')
          if new in text: raise SystemExit('P1-043 already patched')
          p.write_text(text.replace(old, new, 1))
          dt = d.read_text()
          if '## Continuation 2026-08-26 — P1-043 concurrent storage quota admission' in dt: raise SystemExit('audit section already exists')
          d.write_text(dt + ap)
          m = json.loads(pathlib.Path('manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
          rm .github/workflows/audit-sync-20260826-p1-043-quota-admission.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md .github/workflows/audit-sync-20260826-p1-043-quota-admission.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p1-043-quota-admission.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refine P1-043 concurrent quota admission'
          git push
