name: Create synchronized handoff archive
on:
  push:
    paths:
      - '.github/workflows/create-handoff-20260825.yml'
permissions:
  contents: write
jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact handoff source
        shell: bash
        run: |
          set -euo pipefail
          expected='b4874159274113fbf9a65faba06fdd1dce80ad1c'
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$expected"
          git diff --exit-code "$expected" -- . ':(exclude).github/workflows/create-handoff-20260825.yml'
          echo "HANDOFF_SOURCE=$expected"
      - name: Final syntax gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for file in "${files[@]}"; do node --check "$file"; done
          echo "JavaScript syntax PASS: ${#files[@]}/${#files[@]}"
      - name: Final deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          for test_file in "${tests[@]}"; do node "$test_file"; done
          echo "Deterministic tests PASS: ${#tests[@]}/${#tests[@]}"
      - name: Prepare archive source marker
        shell: bash
        run: |
          set -euo pipefail
          cat > project_handoff/HANDOFF_ARCHIVE_SOURCE.txt <<'EOF'
          WebClip PDF Prototype handoff archive
          date=2026-08-25
          archive_source_head=b4874159274113fbf9a65faba06fdd1dce80ad1c
          canonical_product_audit_head=bccb2aa2debfcd32f3c585326829d9f3241e5c71
          manifest_version=0.9.8
          minimum_chrome_version=118
          syntax_gate=86/86 PASS
          deterministic_gate=73/73 PASS
          security_manifest_gate=PASS
          note=Archive contains the tracked repository tree based on archive_source_head plus this marker. The temporary archive-creation workflow and the archive/checksum files themselves are intentionally not stored inside the ZIP. For development always prefer a newer GitHub main if it exists.
          EOF
          git add project_handoff/HANDOFF_ARCHIVE_SOURCE.txt
      - name: Build ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile

          archive = Path('project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip')
          archive.parent.mkdir(parents=True, exist_ok=True)
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          files = [item.decode('utf-8') for item in raw.split(b'\0') if item]
          skip = {
              '.github/workflows/create-handoff-20260825.yml',
              str(archive),
              str(archive) + '.sha256',
              'project_handoff/HANDOFF_ARCHIVE_INDEX.md',
          }
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in files:
                  if name in skip or name.endswith('.zip') or name.endswith('.zip.sha256'):
                      continue
                  path = Path(name)
                  if path.is_file():
                      zf.write(path, arcname=name)
          print(archive)
          PY
          archive='project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip'
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$(basename "$archive")" > "$archive.sha256"
          cat > project_handoff/HANDOFF_ARCHIVE_INDEX.md <<EOF
          # Handoff archive index — 2026-08-25

          - Archive source HEAD: \`b4874159274113fbf9a65faba06fdd1dce80ad1c\`
          - Canonical product/audit HEAD before handoff docs: \`bccb2aa2debfcd32f3c585326829d9f3241e5c71\`
          - Archive: \`$(basename "$archive")\`
          - SHA-256: \`$sha\`
          - Manifest: \`0.9.8\`, MV3, minimum Chrome 118.
          - Final pre-archive gate: JavaScript syntax 86/86 PASS; deterministic tests 73/73 PASS.

          The ZIP contains source, tests, project docs, deep-audit report, closure docs, handoff state and startup prompt. It excludes \`.git\`, this one-shot workflow and the ZIP/checksum themselves. Continue development from the freshest GitHub \`main\`; use the archive only as a recovery snapshot.
          EOF
          ls -lh "$archive" "$archive.sha256" project_handoff/HANDOFF_ARCHIVE_INDEX.md
      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebClip-PDF-handoff-2026-08-25-b487415
          path: |
            project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip
            project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Commit synchronized handoff state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/create-handoff-20260825.yml
          git add project_handoff/HANDOFF_ARCHIVE_SOURCE.txt project_handoff/HANDOFF_ARCHIVE_INDEX.md project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip project_handoff/WebClip_PDF_Prototype_handoff_2026-08-25_b487415.zip.sha256
          git commit -m 'handoff: add synchronized project archive and startup context'
          git push origin HEAD:main
          echo "FINAL_HANDOFF_HEAD=$(git rev-parse HEAD)"
