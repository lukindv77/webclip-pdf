name: Research C33 CSS WAAPI temporal

on:
  push:
    branches: [research/evidence-c33-css-waapi-temporal-2026-09-02]
    paths-ignore:
      - project_tools/.c33-physical-result.json

permissions:
  contents: write

jobs:
  physical-c33:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4
      - name: Run exact-source physical C33 matrix
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'Chrome unavailable' >&2; exit 1; }
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          status=0
          python -m py_compile project_tools/research_c33_temporal_matrix.py || status=$?
          if [[ "$status" = 0 ]]; then
            python project_tools/research_c33_temporal_matrix.py --chrome "$chrome" --out "$RUNNER_TEMP/c33-pdfs" | tee "$RUNNER_TEMP/c33-result.log" || status=${PIPESTATUS[0]}
          fi
          result="$(grep '^C33_RESULT_JSON=' "$RUNNER_TEMP/c33-result.log" 2>/dev/null | tail -n 1 | sed 's/^C33_RESULT_JSON=//')"
          if [[ -n "$result" ]]; then
            printf '%s\n' "$result" > project_tools/.c33-physical-result.json
            echo "::notice title=C33_RESULT::$result"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -s project_tools/.c33-physical-result.json ]]; then
            git add -f project_tools/.c33-physical-result.json
            if ! git diff --cached --quiet; then
              git commit -m 'research: persist temporary C33 physical result'
              git push origin HEAD:research/evidence-c33-css-waapi-temporal-2026-09-02
            fi
          fi
          exit "$status"
