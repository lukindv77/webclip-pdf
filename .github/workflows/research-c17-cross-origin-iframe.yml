name: Research C17 cross-origin iframe

on:
  push:
    branches: [research/evidence-c17-cross-origin-iframe-2026-09-02]
    paths-ignore:
      - project_tools/.c17-physical-result.json
      - project_tools/.c17-geometry-result.json
      - project_tools/.c17-geometry-log.txt
      - project_tools/.c17-geometry-status.txt

permissions:
  contents: write

jobs:
  physical-c17:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0

      - name: Run C17 effective-geometry causal control
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium is unavailable on runner' >&2
            printf '127\n' > project_tools/.c17-geometry-status.txt
            exit 0
          fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          export FRAME_AGENT_BLOB_SHA="$(git rev-parse HEAD:frame-agent.js)"
          set +e
          python project_tools/research_c17_cross_origin_geometry_control.py --chrome "$chrome" --out "$RUNNER_TEMP/c17-geometry-pdfs" 2>&1 | tee project_tools/.c17-geometry-log.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > project_tools/.c17-geometry-status.txt
          geometry="$(grep '^C17_GEOMETRY_RESULT_JSON=' project_tools/.c17-geometry-log.txt | tail -n 1 | sed 's/^C17_GEOMETRY_RESULT_JSON=//' || true)"
          if [[ -n "$geometry" ]]; then
            printf '%s\n' "$geometry" > project_tools/.c17-geometry-result.json
            echo "::notice title=C17_GEOMETRY_RESULT::$geometry"
          fi

      - name: Persist temporary geometry receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_tools/.c17-geometry-result.json project_tools/.c17-geometry-log.txt project_tools/.c17-geometry-status.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C17 geometry result'
          git push origin HEAD:research/evidence-c17-cross-origin-iframe-2026-09-02

      - name: Assert geometry harness status
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat project_tools/.c17-geometry-status.txt)"
          [[ "$status" == '0' ]]
