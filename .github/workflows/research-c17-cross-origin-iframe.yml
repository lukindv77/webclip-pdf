name: Research C17 cross-origin iframe

on:
  push:
    branches: [research/evidence-c17-cross-origin-iframe-2026-09-02]

permissions:
  contents: read

jobs:
  physical-c17:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0

      - name: Run exact-source physical C17 matrix
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium is unavailable on runner' >&2
            exit 1
          fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          export FRAME_AGENT_BLOB_SHA="$(git rev-parse HEAD:frame-agent.js)"
          python project_tools/research_c17_cross_origin_iframe.py --chrome "$chrome" --out "$RUNNER_TEMP/c17-pdfs" | tee "$RUNNER_TEMP/c17-result.log"
          result="$(grep '^C17_RESULT_JSON=' "$RUNNER_TEMP/c17-result.log" | tail -n 1 | sed 's/^C17_RESULT_JSON=//')"
          if [[ -z "$result" ]]; then
            echo 'C17 result JSON missing' >&2
            exit 1
          fi
          echo "::notice title=C17_RESULT::$result"
