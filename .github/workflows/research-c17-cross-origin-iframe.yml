name: Research C17 cross-origin iframe

on:
  push:
    branches: [research/evidence-c17-cross-origin-iframe-2026-09-02]
    paths-ignore:
      - project_tools/.c17-physical-result.json
      - project_tools/.c17-geometry-result.json

permissions:
  contents: write

jobs:
  physical-c17:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0

      - name: Run exact-source physical C17 matrix
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium is unavailable on runner' >&2
            exit 1
          fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          export FRAME_AGENT_BLOB_SHA="$(git rev-parse HEAD:frame-agent.js)"
          python project_tools/research_c17_cross_origin_iframe.py --chrome "$chrome" --out "$RUNNER_TEMP/c17-pdfs" | tee "$RUNNER_TEMP/c17-result.log"
          result="$(grep '^C17_RESULT_JSON=' "$RUNNER_TEMP/c17-result.log" | tail -n 1 | sed 's/^C17_RESULT_JSON=//')"
          if [[ -z "$result" ]]; then
            echo 'C17 result JSON missing' >&2
            exit 1
          fi
          printf '%s\n' "$result" > project_tools/.c17-physical-result.json
          echo "::notice title=C17_RESULT::$result"

          python project_tools/research_c17_cross_origin_geometry_control.py --chrome "$chrome" --out "$RUNNER_TEMP/c17-geometry-pdfs" | tee "$RUNNER_TEMP/c17-geometry-result.log"
          geometry="$(grep '^C17_GEOMETRY_RESULT_JSON=' "$RUNNER_TEMP/c17-geometry-result.log" | tail -n 1 | sed 's/^C17_GEOMETRY_RESULT_JSON=//')"
          if [[ -z "$geometry" ]]; then
            echo 'C17 geometry result JSON missing' >&2
            exit 1
          fi
          printf '%s\n' "$geometry" > project_tools/.c17-geometry-result.json
          echo "::notice title=C17_GEOMETRY_RESULT::$geometry"

      - name: Persist temporary exact result receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_tools/.c17-physical-result.json project_tools/.c17-geometry-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C17 physical results'
          git push origin HEAD:research/evidence-c17-cross-origin-iframe-2026-09-02
