name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository consistency
        run: python project_tools/check_repository_consistency.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Deterministic JavaScript tests
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failures=0
          for test in project_tools/test_*.js; do
            echo "==> $test"
            count=$((count + 1))
            if ! node "$test"; then
              echo "::error file=$test,title=Deterministic test failed::$test failed on commit $GITHUB_SHA"
              failures=$((failures + 1))
            fi
          done
          echo "Executed $count deterministic test files; failures=$failures."
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

      - name: Recovery artifact provenance self-test
        if: ${{ always() }}
        run: python project_tools/test_recovery_archive.py
