name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository consistency
        run: python project_tools/check_repository_consistency.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Deterministic JavaScript tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          count=0
          failures=()
          for test in project_tools/test_*.js; do
            echo "==> $test"
            count=$((count + 1))
            if ! node "$test"; then
              echo "::error file=$test,title=Deterministic test failed::$test failed on commit $GITHUB_SHA"
              failures+=("$(basename "$test")")
            fi
          done

          if [ "${#failures[@]}" -eq 0 ]; then
            description="all $count deterministic JS test files passed"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success -f context=deterministic-tests-detail -f description="$description" >/dev/null
            echo "Executed $count deterministic test files; failures=0."
            exit 0
          fi

          joined=$(IFS=,; echo "${failures[*]}")
          description="${#failures[@]} fail: $joined"
          description="${description:0:140}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=deterministic-tests-detail -f description="$description" >/dev/null
          echo "Executed $count deterministic test files; failures=${#failures[@]}."
          exit 1

      - name: Recovery artifact provenance self-test
        run: python project_tools/test_recovery_archive.py

      - name: One-shot audit family consolidation
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/consolidate_audit_families.py
          python project_tools/check_repository_consistency.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "Audit families already consolidated; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: losslessly consolidate remaining audit families"
          git push origin HEAD:main
