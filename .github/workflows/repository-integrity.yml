name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Repository consistency
        run: python project_tools/check_repository_consistency.py

      - name: CI action pinning
        run: python project_tools/check_ci_pins.py

      - name: CI pinning self-test
        run: python project_tools/test_ci_pins.py

      - name: PR change contract
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python project_tools/check_pr_change_contract.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: PR change contract self-test
        run: python project_tools/test_pr_change_contract.py

      - name: Release readiness schema/status
        run: python project_tools/check_release_readiness.py status

      - name: Release readiness checker self-test
        run: python project_tools/test_release_readiness.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Deterministic JavaScript tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          count=0
          failures=()
          for test in project_tools/test_*.js; do
            echo "==> $test"
            count=$((count + 1))
            if ! node "$test"; then
              echo "::error file=$test,title=Deterministic test failed::$test failed on commit $GITHUB_SHA"
              failures+=("$(basename "$test")")
            fi
          done

          if [ "${#failures[@]}" -eq 0 ]; then
            description="all $count deterministic JS test files passed"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success -f context=deterministic-tests-detail -f description="$description" >/dev/null
            echo "Executed $count deterministic test files; failures=0."
            exit 0
          fi

          joined=$(IFS=,; echo "${failures[*]}")
          description="${#failures[@]} fail: $joined"
          description="${description:0:140}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=deterministic-tests-detail -f description="$description" >/dev/null
          echo "Executed $count deterministic test files; failures=${#failures[@]}."
          exit 1

      - name: Recovery artifact provenance self-test
        run: python project_tools/test_recovery_archive.py
