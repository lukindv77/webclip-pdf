name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error title=Exact checkout mismatch::expected $EXPECTED_SHA, got $actual"
            exit 1
          fi
          echo "Exact checkout verified: $actual"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Repository consistency
        run: python project_tools/check_repository_consistency.py

      - name: Repository consistency self-test
        run: python project_tools/test_repository_consistency.py

      - name: Repository growth hygiene
        run: python project_tools/check_repository_hygiene.py

      - name: Repository growth hygiene self-test
        run: python project_tools/test_repository_hygiene.py

      - name: Final research-delta retirement self-test
        run: python project_tools/test_final_delta_retirement.py

      - name: Staged evidence compaction self-test
        run: python project_tools/test_staged_evidence_compaction.py

      - name: Research terminology contract
        run: python project_tools/check_research_terminology.py

      - name: Research terminology checker self-test
        run: python project_tools/test_research_terminology.py

      - name: Context/bootstrap contract
        run: python project_tools/check_context_contract.py

      - name: Context/bootstrap self-test
        run: python project_tools/test_context_contract.py

      - name: CI action pinning
        run: python project_tools/check_ci_pins.py

      - name: CI pinning self-test
        run: python project_tools/test_ci_pins.py

      - name: PR change contract structure
        run: python project_tools/check_pr_change_contract.py

      - name: PR change contract
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python project_tools/check_pr_change_contract.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: PR change contract self-test
        run: python project_tools/test_pr_change_contract.py

      - name: Release readiness schema/status
        run: python project_tools/check_release_readiness.py status

      - name: Release readiness checker self-test
        run: python project_tools/test_release_readiness.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')

      - name: Deterministic JavaScript tests
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failures=()
          for test in project_tools/test_*.js; do
            echo "==> $test"
            count=$((count + 1))
            if ! node "$test"; then
              echo "::error file=$test,title=Deterministic test failed::$test failed on commit $GITHUB_SHA"
              failures+=("$(basename "$test")")
            fi
          done

          if [ "${#failures[@]}" -eq 0 ]; then
            echo "Executed $count deterministic test files; failures=0."
            exit 0
          fi

          joined=$(IFS=,; echo "${failures[*]}")
          echo "Deterministic failures (${#failures[@]}): $joined"
          exit 1

      - name: Recovery artifact provenance self-test
        run: python project_tools/test_recovery_archive.py


  p1-231-source-generation-authority:
    name: p1-231-source-generation-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact S0-B candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact S0-B checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error title=S0-B exact checkout mismatch::expected $EXPECTED_SHA, got $actual"
            exit 1
          fi
          echo "S0-B exact checkout verified: $actual"

      - name: Set up S0-B Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up S0-B Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Verify P1-231 S0-B source generation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node project_tools/release_source_generation_authority.js --candidate "$EXPECTED_SHA"

      - name: Verify P1-231 S0-F candidate admission
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node project_tools/release_candidate_generation.js --candidate "$EXPECTED_SHA"

      - name: Verify P1-231 S0-G evidence settlement
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node project_tools/release_evidence_settlement.js --candidate "$EXPECTED_SHA"


  p1-231-shadow-identity:
    name: p1-231-shadow-identity
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact S1-A candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact S1-A checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error title=S1-A exact checkout mismatch::expected $EXPECTED_SHA, got $actual"
            exit 1
          fi
          echo "S1-A exact checkout verified: $actual"

      - name: Set up S1-A Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Set up S1-A Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Evaluate P1-231 S1-A shadow identity
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/webclip-s1a-shadow.json"

          if [[ "$EVENT_KIND" == "pull_request" ]]; then
            node project_tools/release_shadow_identity.js \
              --event pull_request \
              --candidate "$CANDIDATE_SHA" \
              --base "$PR_BASE_SHA" \
              --pr-head "$PR_HEAD_SHA" > "$result"
          elif [[ "$EVENT_KIND" == "push" ]]; then
            node project_tools/release_shadow_identity.js \
              --event push \
              --candidate "$CANDIDATE_SHA" > "$result"
          else
            echo "::error title=S1-A unsupported event::$EVENT_KIND"
            exit 1
          fi

          cat "$result"

          RESULT_PATH="$result" node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));

          function fail(message) {
            console.error('S1-A result invariant failed: ' + message);
            process.exit(1);
          }

          if (
            result.schema !== 'webclip-shadow-identity/v1'
            || result.candidate_sha !== process.env.CANDIDATE_SHA
            || result.generation_gate !== 'pass'
            || result.policy_mutation !== false
            || result.receipt_mutation !== false
            || result.evidence_settlement !== false
            || result.artifact_build !== false
            || result.release_authorized !== false
          ) {
            fail('passive result envelope');
          }

          if (process.env.EVENT_KIND === 'push') {
            if (
              result.eligible !== true
              || result.shadow_outcome !== 'eligible'
              || !result.impact_context
              || result.impact_context.kind !== 'push-main'
              || result.impact_context.trustedControlPlaneReview !== false
              || result.impact_context.automaticClassificationTrusted !== true
            ) {
              fail('push-main eligibility');
            }
          } else {
            const impact = result.impact_context;
            if (
              !impact
              || impact.kind !== 'pull-request-synthetic-merge'
              || impact.baseSha !== process.env.PR_BASE_SHA
              || impact.prHeadSha !== process.env.PR_HEAD_SHA
              || impact.candidateSha !== process.env.CANDIDATE_SHA
            ) {
              fail('pull-request provenance');
            }

            if (impact.trustedControlPlaneReview === true) {
              if (
                impact.automaticClassificationTrusted !== false
                || result.eligible !== false
                || result.shadow_outcome !== 'control-plane-review-required'
              ) {
                fail('control-plane review state');
              }
            } else if (
              impact.automaticClassificationTrusted !== true
              || result.eligible !== true
              || result.shadow_outcome !== 'eligible'
            ) {
              fail('ordinary pull-request eligibility');
            }
          }

          console.log(
            'S1-A permanent shadow result verified: outcome=' + result.shadow_outcome
            + '; eligible=' + result.eligible
            + '; release_authorized=' + result.release_authorized
          );
          NODE

      - name: Evaluate P1-231 S1-B/C/D pre-S2 shadow
        shell: bash
        env:
          EVENT_KIND: \${{ github.event_name }}
          CANDIDATE_SHA: \${{ github.sha }}
          PR_BASE_SHA: \${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const s1bAuthority = require('./project_tools/release_shadow_settlement.js');
          const s1cAuthority = require('./project_tools/release_builder_equivalence.js');
          const s1dAuthority = require('./project_tools/release_migration_rehearsal.js');

          function fail(message) {
            console.error('S1-B/C/D pre-S2 invariant failed: ' + message);
            process.exit(1);
          }

          const eventKind = process.env.EVENT_KIND;
          const candidate = process.env.CANDIDATE_SHA;
          const prBase = process.env.PR_BASE_SHA || null;
          const prHead = process.env.PR_HEAD_SHA || null;
          const s1aPath = path.join(process.env.RUNNER_TEMP, 'webclip-s1a-shadow.json');
          const s1a = JSON.parse(fs.readFileSync(s1aPath, 'utf8'));

          const shadowInput = {
            eventKind,
            candidateSha: candidate,
            baseSha: eventKind === 'pull_request' ? prBase : null,
            prHeadSha: eventKind === 'pull_request' ? prHead : null
          };

          const s1b = s1bAuthority.evaluateShadowSettlement(
            shadowInput,
            { shadowProvider: () => s1a }
          );
          const s1c = s1cAuthority.observeCandidate(
            shadowInput,
            { shadowProvider: () => s1a }
          );

          const observedMain = eventKind === 'pull_request' ? prBase : candidate;
          const s1d = s1dAuthority.rehearseMigration({
            candidateSha: candidate,
            execution: {
              checkoutSha: candidate,
              candidateAdmissionSha: candidate,
              workflowRef: s1dAuthority.WORKFLOW_REF,
              workflowBlobSha: s1dAuthority.V1_ANCHORS['.github/workflows/repository-integrity.yml'],
              evidenceMainSha: observedMain,
              decisionMainSha: observedMain,
              receiptHistoryAppendOnly: true,
              syntheticMergeRequired: eventKind === 'pull_request',
              prHeadSha: eventKind === 'pull_request' ? prHead : null
            },
            s1a,
            s1b,
            s1c
          });

          if (
            s1b.schema !== 'webclip-shadow-settlement/v1'
            || s1b.candidate_sha !== candidate
            || s1b.policy_mutation !== false
            || s1b.receipt_mutation !== false
            || s1b.readiness_mutation !== false
            || s1b.artifact_build !== false
            || s1b.release_authorized !== false
          ) {
            fail('S1-B passive envelope');
          }

          if (
            s1c.schema !== 'webclip-builder-equivalence/v1'
            || s1c.candidate_sha !== candidate
            || s1c.product_projection_loaded !== false
            || s1c.product_zip_built !== false
            || s1c.official_artifact !== false
            || s1c.authoritative !== false
            || s1c.policy_mutation !== false
            || s1c.receipt_mutation !== false
            || s1c.readiness_mutation !== false
            || s1c.release_authorized !== false
          ) {
            fail('S1-C passive envelope');
          }

          if (
            s1d.schema !== 'webclip-shadow-migration-rehearsal/v1'
            || s1d.candidate_sha !== candidate
            || s1d.state !== 'shadow-observed'
            || s1d.failure !== null
            || s1d.v1_authority !== 'unchanged'
            || s1d.rollback_target !== 'v1-only'
            || s1d.release_ready !== false
            || s1d.release_authorized !== false
            || s1d.s2_authorized !== false
            || s1d.product_zip !== false
            || s1d.authoritative !== false
            || s1d.policy_mutation !== false
            || s1d.receipt_mutation !== false
            || s1d.readiness_mutation !== false
          ) {
            fail('S1-D passive envelope');
          }

          if (s1a.eligible === false) {
            if (
              s1b.shadow_outcome !== 'candidate-ineligible'
              || s1b.settlement_evaluated !== false
              || s1c.state !== 'candidate-ineligible'
              || s1c.equivalence_evaluated !== false
              || s1d.shadow.identity !== 'candidate-ineligible'
              || s1d.shadow.settlement !== 'candidate-ineligible'
              || s1d.shadow.builder_equivalence !== 'candidate-ineligible'
            ) {
              fail('control-plane ineligible propagation');
            }
          } else {
            if (
              s1b.identity_eligible !== true
              || s1b.settlement_evaluated !== true
              || s1c.identity_eligible !== true
              || s1c.state !== 'not-evaluated'
              || s1c.blocker_reason !== 'product-build-not-authorized'
              || s1d.shadow.identity !== 'eligible'
              || s1d.shadow.builder_equivalence !== 'not-evaluated'
            ) {
              fail('eligible passive observation');
            }
            if (
              s1b.all_required_slots_pass === false
              && !['evidence-missing', 'evidence-blocked'].includes(s1b.s0g_settlement_state)
            ) {
              fail('eligible settlement blocker semantics');
            }
          }

          for (const [name, result] of Object.entries({s1b, s1c, s1d})) {
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'webclip-' + name + '-shadow.json'),
              JSON.stringify(result, null, 2) + '\n'
            );
            console.log(name.toUpperCase() + ' result:');
            console.log(JSON.stringify(result, null, 2));
          }

          console.log(
            'P1-231 permanent pre-S2 shadow verified: '
            + 'identity=' + s1d.shadow.identity
            + '; settlement=' + s1d.shadow.settlement
            + '; builder=' + s1d.shadow.builder_equivalence
            + '; s2_authorized=' + s1d.s2_authorized
          );
          NODE
