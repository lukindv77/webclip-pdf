name: C0 C1 remote-save delta research

on:
  push:
    branches:
      - research/c0-c1-remote-save-admission-delta-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic model
        run: node project_tools/test_c0_c1_remote_save_admission_delta_model.js
      - name: Controlled HTTP verification fixture
        run: node project_tools/run_c0_c1_remote_verification_http_fixture.js
