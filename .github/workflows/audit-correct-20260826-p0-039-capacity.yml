name: audit-correct-p0-039-capacity
on:
  push:
    paths:
      - '.github/workflows/audit-correct-20260826-p0-039-capacity.yml'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        run: |
          test "$(git rev-parse HEAD^)" = "5e1ba87605f983a5b1c07d84647602d982df2968"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-correct-20260826-p0-039-capacity.yml"
      - name: Correct audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          text = priorities.read_text(encoding='utf-8')
          old = "| P0-039 | P0 | PARTIAL | После физически успешного локального/Yandex сохранения сбой append в Journal не должен скрыто терять metadata. Основной path уже использует idempotent recovery-checkpoint с фиксированными `journalEntryId/createdAt`, а `pendingAppends` находится в Journal IndexedDB и восстанавливается maintenance. Аудит выявил незакрытую capacity-ветку: очередь ограничена 20 checkpoints и 4 MiB; `markPendingJournalAppendFailure()` лишь увеличивает `attemptCount/lastError`, но у `pendingAppends` нет stale/dead-letter relief или пользовательского resolution. Если 20 старых append checkpoints длительно не могут commit, `checkpointPendingJournalAppend()` для новой уже **физически успешной** local/Yandex операции fail-closed по capacity; `safeAppendJournalEntry()` после этого всё равно пробует обычный append. Если тот падает по той же продолжающейся IDB/quota причине, новая metadata остаётся без durable recovery, что нарушает исходный инвариант P0-039. Нужен fail-safe capacity contract: физический side effect не должен стартовать, если заранее невозможно зарезервировать recovery slot для его будущей metadata, либо используется отдельный durable overflow/dead-letter envelope, который не теряет item; уже существующие unresolved checkpoints нельзя автоматически удалять только ради места. Должен быть bounded diagnostics/UI для permanently failing items и явное recovery/export/resolution, а после actual append checkpoint удаляется атомарно как сейчас. Regression: заполнить 20 checkpoint'ов детерминированными failing appends; 21-я операция не может физически завершить download/upload без гарантированного recovery receipt либо её metadata должна пережить отдельный durable overflow; восстановление одного slot возобновляет admission без потери старых items. |"
          original = "| P0-039 | P0 | REGRESSION | После физически успешного локального/Yandex сохранения сбой append в Journal не должен скрыто терять metadata. `safeAppendJournalEntry` использует idempotent recovery-checkpoint с фиксированными `journalEntryId/createdAt`; пользователь получает статус `partial`. После `P0-041` pending appends находятся в Journal IndexedDB, а не в `storage.local`, и восстанавливаются hourly maintenance. |"
          if old not in text:
              raise SystemExit('incorrect P0-039 row not found or changed')
          priorities.write_text(text.replace(old, original, 1), encoding='utf-8')

          audit = Path('DEEP_AUDIT_2026-08-25.md')
          a = audit.read_text(encoding='utf-8')
          heading = '## Correction 2026-08-26 — P0-039 capacity hypothesis rejected'
          if heading in a:
              raise SystemExit('correction already exists')
          addition = '''\n\n## Correction 2026-08-26 — P0-039 capacity hypothesis rejected\n\nThe immediately preceding P0-039 capacity refinement was re-checked against current live callers and is **retracted**. `safeAppendJournalEntry()` / creation of new generic `pendingAppends` no longer has a live save caller in the current product path; the generic store remains for legacy recovery compatibility. Current irreversible save paths use specialized pre-side-effect checkpoints instead: local downloads persist `pendingDownloads` before `chrome.downloads.download()`, and Yandex saves persist `pendingRemoteSaves` before signed PUT/publication. Therefore a full generic `pendingAppends` queue does not currently cause the claimed 21st live download/upload to complete without durable recovery.\n\nP0-039 is restored to `REGRESSION`. This correction is intentionally preserved in the audit trail rather than deleting the rejected hypothesis, so future readers can see why it was not promoted into the active registry. If a future code change reintroduces a live caller of `safeAppendJournalEntry()`, capacity admission must be re-audited before that caller is accepted.\n\nThis correction is docs-only. Production source and `manifest.json` are unchanged; product tests were not rerun.\n'''
          audit.write_text(a.rstrip() + addition + '\n', encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/audit-correct-20260826-p0-039-capacity.yml
      - name: Verify scope and manifest invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-correct-20260826-p0-039-capacity.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: correct P0-039 capacity audit classification'
          git push origin HEAD:main
