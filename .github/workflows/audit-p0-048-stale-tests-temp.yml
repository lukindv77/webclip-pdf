name: Audit P0-048 stale integration tests temporary

on:
  push:
    branches:
      - fix/p0-048-local-download-identity-2026-09-01

permissions:
  contents: write

jobs:
  repair-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update only stale wiring expectations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('project_tools/test_p0_033_signed_yandex_log_redaction.js')
          text = p.read_text(encoding='utf-8')
          old = "  assert.match(workerSource, /^importScripts\\('public-suffix\\.js', 'journal-import-stream\\.js', 'journal-text-filter\\.js'\\);/);"
          new = "  assert.match(workerSource, /^importScripts\\('public-suffix\\.js', 'journal-import-stream\\.js', 'journal-text-filter\\.js'(?:, [^)]*)?\\);/);"
          if text.count(old) != 1:
              raise SystemExit(f'P0-033 stale import assertion mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('project_tools/test_p1_086_087_readonly_download_identity.js')
          text = p.read_text(encoding='utf-8')
          old = "  assert(recovery.includes('.filter(isOwnExtensionDownload).find((candidate) => {'), 'P1-087: intent/fallback candidates must be ownership-filtered before URL/name/size matching');"
          new = "  assert(recovery.includes('downloads: (Array.isArray(matches) ? matches : []).filter(isOwnExtensionDownload)'), 'P1-087: intent/fallback candidates must be ownership-filtered before identity classification');\n  assert(recovery.includes('WebClipLocalDownloadIdentity?.chooseUniqueDownloadForIntent'), 'P1-087: ownership-filtered fallback candidates must flow through the unique identity classifier');"
          if text.count(old) != 1:
              raise SystemExit(f'P1-087 stale matcher assertion mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node project_tools/test_p0_033_signed_yandex_log_redaction.js
          node project_tools/test_p1_086_087_readonly_download_identity.js
          node project_tools/test_p0_048_local_download_identity.js
          git diff --check
          rm .github/workflows/audit-p0-048-stale-tests-temp.yml
          git config user.name lukindv77
          git config user.email lukindv@gmail.com
          git add -A
          expected=".github/workflows/audit-p0-048-stale-tests-temp.yml project_tools/test_p0_033_signed_yandex_log_redaction.js project_tools/test_p1_086_087_readonly_download_identity.js "
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$expected"
          git commit -m 'test: align download identity integration expectations'
          git push origin HEAD:fix/p0-048-local-download-identity-2026-09-01
