name: Temporary C27 focus and selection evidence

on:
  push:
    branches: [research/evidence-c27-focus-selection-2026-09-02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-c27-focus-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c27-focus-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install pinned harness dependencies
        run: python -m pip install --disable-pip-version-check --no-input playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4

      - name: Show browser identity
        run: /usr/bin/google-chrome-stable --version

      - name: Run C27 physical PDF matrix
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome-stable
          C27_BASE_SHA: 6fa613f24116c48a76ee45d7bf75d127884e79f5
        run: python project_tools/research_c27_focus_selection_state.py --out "$RUNNER_TEMP/c27"
