name: Audit P0-039 registry sync temporary

on:
  push:
    branches:
      - fix/p0-039-local-download-dead-letter-2026-09-01

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Synchronize Registry and index
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          registry_path = Path('project_docs/AUDIT_REGISTRY.md')
          registry = registry_path.read_text(encoding='utf-8')
          active = "| P0-039 | ACTIVE | Unknown local-download physical outcome must not lose its only durable recovery evidence merely because Download history disappeared/TTL elapsed. |"
          if registry.count(active) != 1:
              raise SystemExit(f'expected one P0-039 ACTIVE row, found {registry.count(active)}')
          registry = registry.replace(active + '\n', '', 1)
          marker = "| P0-033 | DONE | Signed Yandex Disk transport URLs are treated as opaque capabilities at the OperationLog boundary. A worker-only bootstrap guard wraps direct and nested log sanitization so `.disk.yandex.net` and `.disk.yandex.ru` host families retain only origin + `[REDACTED_SIGNED_PATH]`; deterministic failure/positive/negative/bootstrap controls passed at run `33469046270` / job `99734845451`. See `AUDIT_P0_033_SIGNED_YANDEX_LOG_REDACTION_CLOSURE_2026-09-01_EVIDENCE.md`. |"
          if registry.count(marker) != 1:
              raise SystemExit('P0-033 terminal insertion marker mismatch')
          done = "| P0-039 | DONE | Unknown local-download outcomes no longer lose their only durable checkpoint when Chrome Download history disappears after 24 hours. Both unbound and bound TTL paths transition into a bounded `unknown` / `manual-resolution` state preserving metadata and operationId, skip ordinary retry batches, remain late-settlement resolvable, and never fabricate Journal success. Deterministic evidence passed at run `33469941122` / job `99737473577`. See `AUDIT_P0_039_LOCAL_DOWNLOAD_UNKNOWN_RECOVERY_CLOSURE_2026-09-01_EVIDENCE.md`. |"
          registry = registry.replace(marker, marker + '\n' + done, 1)
          registry_path.write_text(registry, encoding='utf-8')

          index_path = Path('project_docs/README_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          heading = '## Functional Closure Sweep evidence\n\n'
          if index.count(heading) != 1:
              raise SystemExit('Functional Closure Sweep heading mismatch')
          bullet = '- `AUDIT_P0_039_LOCAL_DOWNLOAD_UNKNOWN_RECOVERY_CLOSURE_2026-09-01_EVIDENCE.md` — deterministic closure of unknown automatic local-download recovery: missing Chrome history after TTL now preserves bounded manual-resolution metadata/operation evidence instead of deleting it, with no false Journal success. **P0-039 is DONE.**\n'
          if bullet not in index:
              index = index.replace(heading, heading + bullet, 1)
          tools = '## Current audit tools\n\n'
          if index.count(tools) != 1:
              raise SystemExit('Current audit tools heading mismatch')
          tool_bullet = '- `project_tools/test_p0_039_local_download_dead_letter.js` — deterministic P0-039 regression for both TTL paths, bounded unknown/manual-resolution state, metadata preservation, maintenance exclusion and late exact settlement compatibility.\n'
          if tool_bullet not in index:
              index = index.replace(tools, tools + tool_bullet, 1)
          index_path.write_text(index, encoding='utf-8')
          PY
          git diff --check
          git config user.name lukindv77
          git config user.email lukindv@gmail.com
          git add project_docs/AUDIT_REGISTRY.md project_docs/README_INDEX.md
          git diff --cached --quiet && exit 1
          git commit -m 'docs: mark P0-039 unknown download recovery done'
          git push origin HEAD:fix/p0-039-local-download-dead-letter-2026-09-01
