name: P1-231 S1-B shadow settlement research

on:
  push:
    branches:
      - research/p1-231-s1b-shadow-settlement-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1b-shadow-settlement-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Prove S1-B composition on exact checkout
        shell: bash
        run: |
          set -euo pipefail
          node project_tools/test_p1_231_s0g_evidence_settlement_engine_source_spec_model.js
          node project_tools/test_p1_231_s1a_shadow_identity_source_spec_model.js
          node project_tools/test_p1_231_s1b_shadow_settlement_source_spec_model.js | tee s1b-shadow-settlement-output.txt

      - name: Upload bounded S1-B output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: s1b-shadow-settlement-${{ github.sha }}
          path: s1b-shadow-settlement-output.txt
          if-no-files-found: warn
          retention-days: 7
