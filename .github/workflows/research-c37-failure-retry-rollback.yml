name: Research C37 failure retry rollback

on:
  push:
    branches: [research/evidence-c37-failure-retry-rollback-2026-09-03]
    paths-ignore:
      - project_tools/.c37-capture-result.json
      - project_tools/.c37-link-result.json

permissions:
  contents: write

jobs:
  physical-c37:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4
      - name: Run exact-source C37 controls
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'Chrome unavailable' >&2; exit 1; }
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          python project_tools/research_c37_failure_retry_capture.py --chrome "$chrome" --out "$RUNNER_TEMP/c37-pdfs" | tee "$RUNNER_TEMP/c37-capture.log"
          result="$(grep '^C37_CAPTURE_JSON=' "$RUNNER_TEMP/c37-capture.log" | tail -n 1 | sed 's/^C37_CAPTURE_JSON=//')"
          [[ -n "$result" ]] || { echo 'C37 capture JSON missing' >&2; exit 1; }
          printf '%s\n' "$result" > project_tools/.c37-capture-result.json
          echo "::notice title=C37_CAPTURE::$result"
          python project_tools/research_c37_link_disconnect_control.py --chrome "$chrome" --out "$RUNNER_TEMP/c37-link" | tee "$RUNNER_TEMP/c37-link.log"
          link="$(grep '^C37_LINK_RESULT_JSON=' "$RUNNER_TEMP/c37-link.log" | tail -n 1 | sed 's/^C37_LINK_RESULT_JSON=//')"
          [[ -n "$link" ]] || { echo 'C37 link JSON missing' >&2; exit 1; }
          printf '%s\n' "$link" > project_tools/.c37-link-result.json
          echo "::notice title=C37_LINK::$link"
      - name: Persist temporary exact receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in project_tools/.c37-capture-result.json project_tools/.c37-link-result.json; do
            if [[ -s "$f" ]]; then git add -f "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C37 physical results'
          git push origin HEAD:research/evidence-c37-failure-retry-rollback-2026-09-03
