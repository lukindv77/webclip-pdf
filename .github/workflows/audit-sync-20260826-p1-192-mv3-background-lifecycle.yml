name: audit-sync-p1-192-mv3-background-lifecycle
on:
  push:
    paths:
      - '.github/workflows/audit-sync-20260826-p1-192-mv3-background-lifecycle.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        run: |
          test "$(git rev-parse HEAD^)" = "82b2249fdfd73abd19e03206e1d0404689a40d83"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-192-mv3-background-lifecycle.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          text = priorities.read_text(encoding='utf-8')
          if '| P1-192 |' in text:
              raise SystemExit('P1-192 already exists')
          marker = '## Продолжение глубокого аудита 2026-08-26 — publication policy generation fence'
          if marker not in text:
              raise SystemExit('insertion marker not found')
          section = '''## Продолжение глубокого аудита 2026-08-26 — MV3 background-operation lifecycle ownership\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-192 | P1 | OPEN | Длинные фоновые операции запускаются из `chrome.alarms.onAlarm` как fire-and-forget Promise (`runDueJournalBackup(...).catch(...)`, `runLoggedOperationLogCleanup(...).catch(...)`), но сам alarm callback возвращается сразу и не владеет lifecycle незавершённой async-работы. В Chrome MV3 service worker обычно завершается после ~30 с inactivity; extension API calls сбрасывают idle timer, но чистый IndexedDB/JSON work этого не гарантирует. Это критично до offscreen transfer: background backup после alarm может выполнять `stageFullJournalExport()` до 5 минут преимущественно через IndexedDB, и только **после** snapshot создаёт/использует offscreen transfer с heartbeat. Periodic backup alarm одноразовый (`when` без `periodInMinutes`): он уже consumed, а следующий periodic/retry alarm ставится позднее; принудительная выгрузка worker в этом окне оставляет только worker-start self-heal при каком-либо следующем внешнем wake-up. Hourly maintenance alarm повторяющийся, но его собственные cleanup/stats-rebuild стадии также могут содержать >30 с pure-IDB work и регулярно прерываться. Нужен явный lifecycle owner длинной background promise: либо перенос heavy IDB/serialization phase в offscreen/другой durable context, либо bounded keepalive wrapper на время фактической операции (Chrome рекомендует периодический extension API call для exceptional long-running service-worker work) с release только после actual settlement; scheduler/checkpoint должны быть crash-safe даже при kill между alarm fire и next-alarm commit. Не использовать keepalive для сокрытия бесконечных hangs: все текущие stage deadlines/abort сохраняются. Regression/real Chrome QA: forced idle termination во время >30 с backup snapshot/maintenance не теряет future schedule, не оставляет вечный lease/checkpoint и либо операция завершается под lifecycle owner, либо автоматически возобновляется из durable state при гарантированном wake source. P1-077 остаётся про правильный alarm boundary вместо heavy runtime-message fire-and-forget, P1-075/P1-076 — про bounded IDB stages/lease; этот пункт отдельно закрывает **lifetime самой alarm-started background operation**. |\n\n'''
          priorities.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          audit = Path('DEEP_AUDIT_2026-08-25.md')
          a = audit.read_text(encoding='utf-8')
          heading = '## Continuation 2026-08-26 — P1-192 MV3 background-operation lifecycle ownership'
          if heading in a:
              raise SystemExit('audit section already exists')
          addition = '''\n\n## Continuation 2026-08-26 — P1-192 MV3 background-operation lifecycle ownership\n\n- **P1-192 OPEN — alarm wake-up is not lifecycle ownership of the long Promise.** `chrome.alarms.onAlarm` starts background backup and maintenance with `.catch(...)` and returns immediately. Before an offscreen signed transfer starts, `stageFullJournalExport()` may spend up to five minutes in IndexedDB/JSON staging; maintenance can likewise spend long intervals in pure IndexedDB cleanup or full `urlStats` rebuild. Current Chrome extension-service-worker lifecycle guidance documents a ~30-second inactivity shutdown and explicitly recommends periodic extension API calls only for exceptional long-running service-worker operations; the alarms event callback itself has a `void` callback contract. The signed-transfer heartbeat helps only after offscreen transfer begins, not during the pre-transfer snapshot.\n- Backup scheduling amplifies the impact: the periodic backup alarm is one-shot. If the worker is killed after that alarm fires but before success/failure schedules the next periodic/retry alarm, worker-start self-heal can reconstruct scheduling only after some later event wakes the extension. The hourly maintenance alarm is repeating and eventually provides such a wake under normal browser uptime, but this turns backup timeliness into accidental dependence on another subsystem and does not make the interrupted maintenance pass itself reliable.\n- Required architecture: explicit lifecycle ownership around the actual long operation, or move heavy work into an offscreen/durable context. Keep all existing deadlines/abort semantics and durable backup/recovery checkpoints; lifecycle keepalive must stop on actual settlement and must not turn a hung operation into an immortal worker. Real unpacked Chrome QA should force/observe >30-second snapshot and maintenance cases.\n\nThis continuation is docs-only. Production source and `manifest.json` are unchanged; the previous product test gate was not rerun.\n'''
          audit.write_text(a.rstrip() + addition + '\n', encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/audit-sync-20260826-p1-192-mv3-background-lifecycle.yml
      - name: Verify scope and manifest invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert m['minimum_chrome_version'] == '118'
          PY
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p1-192-mv3-background-lifecycle.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
      - name: Commit docs-only sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record P1-192 MV3 background lifecycle'
          git push origin HEAD:main
