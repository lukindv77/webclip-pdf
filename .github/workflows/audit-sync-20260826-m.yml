name: audit-sync-20260826-m

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3f353c9e16a7ec85293e034c0d6c8df6fa9e955f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-m.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-183' in p or 'P1-183' in a:
              raise SystemExit('P1-183 already exists; refuse duplicate sync')
          p += '''\n\n## Продолжение глубокого аудита 2026-08-26 — delete→Trash crash recovery\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-183 | P1 | OPEN | Journal delete→Yandex Trash не имеет durable target checkpoint перед destructive `resources/move`. В отличие от `Прочитать позже → Прочитано` (`readMoveSourcePath/readMoveTargetPath`), `deleteJournalEntry()` сначала вызывает `moveJournalYandexFileToTrash()`, а локальную entry удаляет только после успешного remote move/verify. Если MV3 worker останавливается в окне после физического move, entry остаётся с исходным `remotePath`. `findYandexFileForJournalEntry()` пытается эвристически восстановиться, проверяя Trash текущего/предыдущего месяца по **исходному filename**, но `chooseYandexTrashTarget()` при конфликте создаёт уникальное имя вида `__deleted_<timestamp>`. В collision-case фактический target после crash уже нельзя вывести из entry; повтор может не найти собственный перемещённый файл и не завершить delete. Перед move нужен durable delete checkpoint с immutable account/root/resource identity, exact sourcePath + выбранным targetPath + operation/generation; после restart/retry сначала verify exact target/source и завершить локальную часть без повторного destructive move. Unknown settlement сохранять до доказанного outcome; public-link policy P0-069 и operation-scoped account fence P0-074 обязательны. Checkpoint/final commit также должен участвовать в P0-076 Journal-generation fence, чтобы recovery старого delete не удалил replacement entry после import. |\n'''
          marker = '## Continuation at HEAD `3f353c9e16a7ec85293e034c0d6c8df6fa9e955f` — delete-to-Trash crash recovery'
          if marker in a:
              raise SystemExit('Audit continuation already present')
          a += f'''\n\n{marker}\n\nNo production source changed. Audit compared the existing read-move recovery state machine with the ordinary delete-to-Trash path.\n\n### P1-183: Trash move has no durable target receipt\n\n`moveReadLaterEntryToRead()` writes `readMovePendingAt`, exact source and exact target into the Journal entry before issuing `resources/move`; retry can therefore verify where the file actually ended up. Ordinary delete does not have an equivalent pre-move checkpoint.\n\nThe existing locator includes a useful fallback for an interrupted deletion: it checks the current and previous month Trash folders using the entry filename. That fallback is not complete. `chooseYandexTrashTarget()` deliberately chooses a unique timestamped `__deleted_...` filename when the plain target name is occupied. If the worker stops after such a move and before the local Journal deletion, the only exact target path lived in transient memory/OperationLog, not in the entry's recovery state. A later retry starts from the old entry and may be unable to identify the already-moved resource safely.\n\nThe durable checkpoint must be written before the remote side effect and include original Yandex identity plus exact chosen target. Recovery must verify rather than repeat a move after an unknown settlement. Its local finalization must also obey the P0-076 generation/revision fence so that an old deletion cannot consume a same-ID entry from a later import.\n\n### Evidence note\n\nDocumentation-only audit sync; product tests not rerun. Last verified gate remains P0-063 (88/88 syntax and 74/74 deterministic tests). Real unpacked Chrome and real Yandex E2E remain release blockers.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-m.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-m.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record delete-to-Trash recovery finding'
          git push
