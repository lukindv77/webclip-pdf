name: Audit P0-033 registry sync temporary

on:
  push:
    branches: [fix/p0-033-signed-yandex-log-redaction-2026-09-01]

permissions:
  contents: write

jobs:
  sync-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronize Registry and index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('project_docs/AUDIT_REGISTRY.md')
          registry = registry_path.read_text(encoding='utf-8')
          active = "| P0-033 | ACTIVE | Signed Yandex transport URL is an opaque capability; current OperationLog regression retains signed pathname and must restore full path/query/fragment redaction. |"
          if registry.count(active) != 1:
              raise SystemExit(f'expected one P0-033 ACTIVE row, found {registry.count(active)}')
          registry = registry.replace(active + '\n', '', 1)
          terminal_marker = "| P0-019 | SUPERSEDED | Historical rule “every user build contains a full recovery archive” was intentionally replaced on 2026-08-29 by Git-first recovery: exact commit SHA is canonical WIP snapshot, annotated release tag points to exact released commit, optional recovery ZIP is a separate offline artifact. See `BUILD_AND_RECOVERY_RULES.md`. |"
          if registry.count(terminal_marker) != 1:
              raise SystemExit('P0-019 terminal insertion marker mismatch')
          done = "| P0-033 | DONE | Signed Yandex Disk transport URLs are treated as opaque capabilities at the OperationLog boundary. A worker-only bootstrap guard wraps direct and nested log sanitization so `.disk.yandex.net` and `.disk.yandex.ru` host families retain only origin + `[REDACTED_SIGNED_PATH]`; deterministic failure/positive/negative/bootstrap controls passed at run `33469046270` / job `99734845451`. See `AUDIT_P0_033_SIGNED_YANDEX_LOG_REDACTION_CLOSURE_2026-09-01_EVIDENCE.md`. |"
          registry = registry.replace(terminal_marker, terminal_marker + '\n' + done, 1)
          registry_path.write_text(registry, encoding='utf-8')

          index_path = Path('project_docs/README_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          heading = '## Functional Closure Sweep evidence\n\n'
          if index.count(heading) != 1:
              raise SystemExit('Functional Closure Sweep heading mismatch')
          bullet = '- `AUDIT_P0_033_SIGNED_YANDEX_LOG_REDACTION_CLOSURE_2026-09-01_EVIDENCE.md` — deterministic closure of signed Yandex Disk transport URL confidentiality in OperationLog. `.disk.yandex.net` and `.disk.yandex.ru` capability URLs now retain only origin + a constant redacted path in direct and nested metadata. **P0-033 is DONE.**\n'
          if bullet not in index:
              index = index.replace(heading, heading + bullet, 1)
          tools = '## Current audit tools\n\n'
          if index.count(tools) != 1:
              raise SystemExit('Current audit tools heading mismatch')
          tool_bullet = '- `project_tools/test_p0_033_signed_yandex_log_redaction.js` — deterministic P0-033 failure/closure regression for direct/nested signed Yandex URL redaction and classic-worker bootstrap binding order.\n'
          if tool_bullet not in index:
              index = index.replace(tools, tools + tool_bullet, 1)
          index_path.write_text(index, encoding='utf-8')
          PY
          git diff --check
          git diff -- project_docs/AUDIT_REGISTRY.md project_docs/README_INDEX.md
          git config user.name 'lukindv77'
          git config user.email 'lukindv@gmail.com'
          git add project_docs/AUDIT_REGISTRY.md project_docs/README_INDEX.md
          git diff --cached --quiet && { echo 'no status changes'; exit 1; }
          git commit -m 'docs: mark P0-033 signed log redaction done'
          git push origin HEAD:fix/p0-033-signed-yandex-log-redaction-2026-09-01
