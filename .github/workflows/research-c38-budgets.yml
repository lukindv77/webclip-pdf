name: Research C38 budgets

on:
  push:
    branches: [research/evidence-c38-budgets-2026-09-03]
    paths-ignore:
      - project_tools/.c38-physical-result.json

permissions:
  contents: write

jobs:
  physical-c38:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0 pymupdf==1.26.4

      - name: Run exact-source physical C38 matrix
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium unavailable' >&2
            echo 1 > "$RUNNER_TEMP/c38-status"
            exit 0
          fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          set +e
          python project_tools/research_c38_budgets.py --chrome "$chrome" --out "$RUNNER_TEMP/c38-pdfs" | tee "$RUNNER_TEMP/c38-result.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$RUNNER_TEMP/c38-status"
          result="$(grep '^C38_RESULT_JSON=' "$RUNNER_TEMP/c38-result.log" | tail -n 1 | sed 's/^C38_RESULT_JSON=//')"
          if [[ -n "$result" ]]; then
            printf '%s\n' "$result" > project_tools/.c38-physical-result.json
            echo "::notice title=C38_RESULT::$result"
          fi
          exit 0

      - name: Persist temporary exact result receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -s project_tools/.c38-physical-result.json ]] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c38-physical-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: persist temporary C38 physical result'
          git push origin HEAD:research/evidence-c38-budgets-2026-09-03

      - name: Assert C38 harness status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/c38-status" 2>/dev/null || echo 1)" = 0
