name: audit-sync-p1-188

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cfa5fca1c6178e4aaf235399040b46f8a4f3b018"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-188.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          if 'P1-188' in p or 'P1-188' in a:
              raise SystemExit('P1-188 already present; refuse duplicate sync')
          p += "\n\n## Продолжение глубокого аудита 2026-08-26 — imported locator selector grammar\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n| P1-188 | P1 | OPEN | SelectionSnapshot import принимает `locator.cssPath` как произвольную строку до 4000 символов, хотя WebClip сам генерирует узкий canonical grammar: `body`, escaped unique `#id`, tag, optional `:nth-of-type(n)` и child `>` chain. Restore затем выполняет импортированный selector через native `querySelector`. Для v3 это ненужный untrusted selector-engine work до bounded candidate scoring; для legacy v1/v2 `resolveElementLocatorLegacyInDocument()` принимает первый `querySelector(cssPath)` result с подходящим tag **напрямую**, без confidence/ambiguity модели. `framePath` использует тот же resolver. Модифицированный backup поэтому способен задавать selector semantics, которые расширение никогда не выпускало, и обходить intended structural locator contract; сложные relational selectors дополнительно создают CPU-risk на host DOM. На import/sanitize boundary валидировать/парсить только versioned WebClip-generated selector grammar либо полностью игнорировать imported `cssPath` и восстанавливать по bounded structural fields; legacy snapshots мигрировать в безопасное представление, а не выполнять arbitrary CSS. Добавить regression на `:has()`, attribute selectors, selector lists и malformed/oversized grammar: они не должны выполняться; собственные canonical selectors и v1/v2 compatibility должны восстанавливаться предсказуемо. |\n"
          marker = '## Continuation 2026-08-26 — imported locator CSS grammar'
          a += "\n\n" + marker + "\n\nAudit baseline: `cfa5fca1c6178e4aaf235399040b46f8a4f3b018`. Documentation-only sync.\n\n**P1-188.** Locator serialization only emits a narrow structural CSS form, but the import sanitizer merely truncates `cssPath`. Both legacy and v3 restore feed this string to `querySelector`; legacy restore may return that element directly after a tag check. This makes untrusted backup data executable as arbitrary selector-engine input and enlarges the restore semantics beyond anything WebClip generates. Restrict imported selector syntax to the canonical generated grammar or discard it and use bounded structural fields; do not execute arbitrary selector text from backup.\n"
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p1-188.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p1-188.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record imported locator selector finding'
          git push
