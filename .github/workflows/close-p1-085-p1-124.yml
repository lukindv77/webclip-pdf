name: Close P1-085 and P1-124

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-p1-085-p1-124.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical source, regressions and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # ---------- P1-085: direct Journal readonly completion/fallback ----------
          journal_path = root / 'journal.js'
          journal = journal_path.read_text(encoding='utf-8')

          old = "      if (!request) { resolve({ total: 0, entries: [] }); return; }"
          new = "      if (!request) {\n        requestError = new Error('Не удалось открыть cursor страницы журнала.');\n        try { tx.abort(); } catch (_) {}\n        return;\n      }"
          if old not in journal:
              raise SystemExit('P1-085 page cursor early-resolve anchor missing')
          journal = journal.replace(old, new, 1)

          old = "  const db = await openJournalDbForView();\n  try {\n    return await new Promise((resolve, reject) => {\n      const entries = [];\n      let matched = 0;\n      let timedOut = false;\n      let requestError = null;\n      const tx = db.transaction(JOURNAL_STORE, 'readonly');\n      const store = tx.objectStore(JOURNAL_STORE);\n      const key = String(urlKey || '');\n      if (!key) { resolve({ entries: [] }); return; }"
          new = "  const key = String(urlKey || '');\n  if (!key) return { entries: [] };\n  const db = await openJournalDbForView();\n  try {\n    return await new Promise((resolve, reject) => {\n      const entries = [];\n      let matched = 0;\n      let timedOut = false;\n      let requestError = null;\n      const tx = db.transaction(JOURNAL_STORE, 'readonly');\n      const store = tx.objectStore(JOURNAL_STORE);"
          if old not in journal:
              raise SystemExit('P1-085 URL-group early-resolve anchor missing')
          journal = journal.replace(old, new, 1)
          journal_path.write_text(journal, encoding='utf-8')

          # ---------- P1-124: bounded tabs.create with late settlement dedupe ----------
          sw_path = root / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')
          const_anchor = "const FRAME_AGENT_COMMAND_TIMEOUT_MS = 5_000;\nconst FRAME_AGENT_MAX_PER_TAB = 64;\nconst frameAgentsByTab = new Map();"
          const_replacement = "const FRAME_AGENT_COMMAND_TIMEOUT_MS = 5_000;\nconst FRAME_AGENT_MAX_PER_TAB = 64;\nconst TAB_CREATE_TIMEOUT_MS = 10_000;\nconst TAB_CREATE_LATE_SUCCESS_TTL_MS = 60_000;\nconst frameAgentsByTab = new Map();\nconst tabCreateSettlements = new Map();"
          if const_anchor not in sw:
              raise SystemExit('P1-124 constant anchor missing')
          sw = sw.replace(const_anchor, const_replacement, 1)

          start = sw.index("async function createTabNextTo(sourceTabId, url, active = true) {")
          end = sw.index("\n\nconst CONTENT_SCRIPT_MESSAGE_TYPES", start)
          replacement = r'''function makeTabCreatePendingError(label = 'Создание вкладки Chrome') {
            const error = new Error(`${label} ещё выполняется Chrome. WebClip не запускает повтор, пока исходный tabs.create() не завершится, чтобы не создать дубликат вкладки.`);
            error.code = 'WEBCLIP_TAB_CREATE_PENDING';
            return error;
          }

          function tabCreateRequestKey(sourceTabId, url, active = true, requestKey = '') {
            const explicit = String(requestKey || '').trim();
            if (explicit) return `logical:${explicit.slice(0, 512)}`;
            const source = Math.max(0, Math.floor(Number(sourceTabId) || 0));
            return `source:${source}|active:${active !== false ? 1 : 0}|url:${String(url || '').slice(0, 8192)}`;
          }

          function clearTabCreateSettlement(key, entry) {
            if (entry?.cleanupTimer) clearTimeout(entry.cleanupTimer);
            if (tabCreateSettlements.get(key) === entry) tabCreateSettlements.delete(key);
          }

          function waitForTabCreateSettlement(entry, label, timeoutMs = TAB_CREATE_TIMEOUT_MS) {
            return new Promise((resolve, reject) => {
              let settled = false;
              const finish = (fn, value) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                fn(value);
              };
              const timer = setTimeout(() => {
                entry.timedOut = true;
                finish(reject, makeTabCreatePendingError(label));
              }, Math.max(1, Number(timeoutMs) || TAB_CREATE_TIMEOUT_MS));
              entry.raw.then(
                (tab) => finish(resolve, tab),
                (error) => finish(reject, error)
              );
            });
          }

          async function createChromeTabBounded(create, { sourceTabId = 0, requestKey = '', label = 'Создание вкладки Chrome' } = {}) {
            const key = tabCreateRequestKey(sourceTabId, create?.url || '', create?.active !== false, requestKey);
            const existing = tabCreateSettlements.get(key);
            if (existing) {
              // A previous local timeout may already have settled successfully in
              // Chrome. Consume that late receipt once instead of creating a new
              // tab for the user's retry.
              if (existing.lateSuccess) {
                const tab = existing.lateSuccess;
                clearTabCreateSettlement(key, existing);
                return tab;
              }
              const tab = await waitForTabCreateSettlement(existing, `${label}: ожидание уже начатого tabs.create()`);
              // If this caller observed the settlement of an earlier timed-out
              // attempt, the result is now known and no longer needs a dedupe receipt.
              if (existing.timedOut) clearTabCreateSettlement(key, existing);
              return tab;
            }

            let raw;
            try { raw = Promise.resolve(chrome.tabs.create(create)); }
            catch (error) { raw = Promise.reject(error); }
            const entry = { raw, timedOut: false, settled: false, lateSuccess: null, error: null, cleanupTimer: 0 };
            tabCreateSettlements.set(key, entry);

            raw.then(
              (tab) => {
                entry.settled = true;
                if (entry.timedOut && tab) {
                  // tabs.create() is non-cancellable. Preserve one late-success
                  // receipt so an immediate identical retry returns the original
                  // tab instead of creating a duplicate. The receipt is bounded.
                  entry.lateSuccess = tab;
                  entry.cleanupTimer = setTimeout(() => clearTabCreateSettlement(key, entry), TAB_CREATE_LATE_SUCCESS_TTL_MS);
                } else {
                  clearTabCreateSettlement(key, entry);
                }
              },
              (error) => {
                entry.settled = true;
                entry.error = error;
                clearTabCreateSettlement(key, entry);
              }
            );

            return waitForTabCreateSettlement(entry, label);
          }

          async function createTabNextTo(sourceTabId, url, active = true, requestKey = '') {
            const create = { url, active };
            const id = Number(sourceTabId || 0);
            if (id > 0) {
              try {
                const source = await chrome.tabs.get(id);
                if (Number.isInteger(source?.index)) {
                  create.index = source.index + 1;
                  if (source.windowId != null) create.windowId = source.windowId;
                }
              } catch (_) {}
            }
            return createChromeTabBounded(create, {
              sourceTabId: id,
              requestKey,
              label: 'Создание вкладки Chrome'
            });
          }'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          sw = sw[:start] + replacement + sw[end:]
          sw_path.write_text(sw, encoding='utf-8')

          # ---------- Dedicated regressions ----------
          p1085 = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const journal = fs.readFileSync(path.join(root, 'journal.js'), 'utf8');

          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          const getMany = section(journal, 'async function readJournalEntriesByIdsForView(ids) {', 'function collectBoundedDomainAggregate');
          assert(getMany.includes("db.transaction(JOURNAL_STORE, 'readonly')"));
          assert(getMany.includes('setTimeout(() =>'));
          assert(getMany.includes('tx.abort()'));
          assert(getMany.includes('tx.oncomplete'));
          assert(getMany.includes("type: 'WEBCLIP_JOURNAL_GET_MANY'"));
          assert(getMany.includes('JOURNAL_VIEW_RUNTIME_DEADLINE_MS'));

          for (const [start, end] of [
            ['async function readJournalViewMetaDirect', 'async function readJournalViewMetaViaServiceWorker'],
            ['async function readJournalPageDirect', 'async function readJournalPageViaServiceWorker'],
            ['async function readJournalUrlGroupsDirect', 'async function readJournalUrlGroupsViaServiceWorker'],
            ['async function readJournalUrlGroupEntriesDirect', 'async function readJournalUrlGroupEntriesViaServiceWorker']
          ]) {
            const source = section(journal, start, end);
            assert(source.includes("db.transaction(JOURNAL_STORE, 'readonly')") || start.includes('GroupEntries'), `${start}: readonly transaction missing`);
            assert(source.includes('JOURNAL_VIEW_QUERY_DEADLINE_MS') || start.includes('GroupEntries'), `${start}: deadline missing`);
            assert(source.includes('tx.oncomplete') || start.includes('GroupEntries'), `${start}: completion gate missing`);
          }
          const pageDirect = section(journal, 'async function readJournalPageDirect', 'async function readJournalPageViaServiceWorker');
          assert(!pageDirect.includes('if (!request) { resolve('), 'P1-085: defensive cursor branch must not publish before tx completion');
          const groupDirect = section(journal, 'async function readJournalUrlGroupEntriesDirect', 'async function readJournalUrlGroupEntriesViaServiceWorker');
          assert(!groupDirect.includes("if (!key) { resolve({ entries: [] })"), 'P1-085: empty key must not early-resolve an opened readonly transaction');

          (async () => {
            let aborted = false;
            let fallbackCalls = 0;
            let fallbackTimeout = 0;
            let fallbackType = '';
            const db = {
              close() {},
              transaction() {
                const tx = {
                  error: null,
                  oncomplete: null,
                  onerror: null,
                  onabort: null,
                  objectStore() {
                    return { get() { return { result: null, error: null, onsuccess: null, onerror: null }; } };
                  },
                  abort() {
                    aborted = true;
                    queueMicrotask(() => tx.onabort?.());
                  }
                };
                return tx;
              }
            };
            const context = vm.createContext({
              console,
              Promise,
              Error,
              Number,
              Math,
              String,
              Array,
              Set,
              Map,
              setTimeout,
              clearTimeout,
              openJournalDbForView: async () => db,
              sendReadOnlyRuntimeMessage: async (message, timeoutMs) => {
                fallbackCalls += 1;
                fallbackType = message.type;
                fallbackTimeout = timeoutMs;
                return { ok: true, entries: [{ id: 'entry-1', title: 'fallback' }] };
              },
              requireOk(value) { if (!value?.ok) throw new Error('not ok'); }
            });
            const code = `const JOURNAL_VIEW_QUERY_DEADLINE_MS = 20;\nconst JOURNAL_VIEW_RUNTIME_DEADLINE_MS = 50;\nconst JOURNAL_STORE = 'entries';\n${section(journal, 'function makeJournalViewDeadlineError', 'function collectBoundedDomainAggregate')}\nthis.readForTest = readJournalEntriesByIdsForView;`;
            vm.runInContext(code, context);
            const result = await context.readForTest(['entry-1']);
            assert.strictEqual(aborted, true, 'hung direct readonly transaction must be aborted');
            assert.strictEqual(fallbackCalls, 1, 'normal service-worker fallback must run once');
            assert.strictEqual(fallbackType, 'WEBCLIP_JOURNAL_GET_MANY');
            assert.strictEqual(fallbackTimeout, 50);
            assert.strictEqual(result.length, 1);
            assert.strictEqual(result[0].id, 'entry-1');
            console.log('P1-085 direct Journal readonly deadline/fallback regression PASS');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          p1085 = '\n'.join(line[10:] if line.startswith('          ') else line for line in p1085.splitlines()) + '\n'
          (root / 'project_tools' / 'test_p1_085_journal_direct_read_deadline.js').write_text(p1085, encoding='utf-8')

          p1124 = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const sw = fs.readFileSync(path.join(root, 'service-worker.js'), 'utf8');

          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          assert(sw.includes('const TAB_CREATE_TIMEOUT_MS = 10_000;'));
          assert(sw.includes('const TAB_CREATE_LATE_SUCCESS_TTL_MS = 60_000;'));
          assert(sw.includes('const tabCreateSettlements = new Map();'));
          const createBlock = section(sw, 'function makeTabCreatePendingError', 'const CONTENT_SCRIPT_MESSAGE_TYPES');
          assert(createBlock.includes('chrome.tabs.create(create)'));
          assert(createBlock.includes('WEBCLIP_TAB_CREATE_PENDING'));
          assert(createBlock.includes('entry.timedOut = true'));
          assert(createBlock.includes('entry.lateSuccess = tab'));
          assert(createBlock.includes('return createChromeTabBounded(create'));
          assert(!/return\s+chrome\.tabs\.create\(create\)/.test(createBlock), 'raw tabs.create return must be removed');

          (async () => {
            let createCalls = 0;
            let resolveFirst;
            const firstRaw = new Promise((resolve) => { resolveFirst = resolve; });
            const chrome = {
              tabs: {
                get: async () => ({ id: 7, index: 3, windowId: 2 }),
                create: () => {
                  createCalls += 1;
                  if (createCalls === 1) return firstRaw;
                  return Promise.resolve({ id: 100 + createCalls });
                }
              }
            };
            const context = vm.createContext({ console, Promise, Error, Number, Math, String, Map, setTimeout, clearTimeout, chrome });
            const code = `const TAB_CREATE_TIMEOUT_MS = 20;\nconst TAB_CREATE_LATE_SUCCESS_TTL_MS = 1000;\nconst tabCreateSettlements = new Map();\n${createBlock}\nthis.createForTest = createTabNextTo; this.pendingForTest = tabCreateSettlements;`;
            vm.runInContext(code, context);

            let firstError = null;
            try { await context.createForTest(7, 'https://example.test/a', true); }
            catch (error) { firstError = error; }
            assert(firstError, 'first hung tabs.create must reject locally');
            assert.strictEqual(firstError.code, 'WEBCLIP_TAB_CREATE_PENDING');
            assert.strictEqual(createCalls, 1);
            assert.strictEqual(context.pendingForTest.size, 1, 'raw non-cancellable create remains tracked after local timeout');

            let secondError = null;
            try { await context.createForTest(7, 'https://example.test/a', true); }
            catch (error) { secondError = error; }
            assert(secondError, 'identical retry must stay bounded while original raw call is pending');
            assert.strictEqual(secondError.code, 'WEBCLIP_TAB_CREATE_PENDING');
            assert.strictEqual(createCalls, 1, 'identical retry must not launch duplicate tabs.create');

            resolveFirst({ id: 42 });
            await new Promise((resolve) => setTimeout(resolve, 0));
            assert.strictEqual(context.pendingForTest.size, 1, 'late success receipt must remain briefly for dedupe');

            const recovered = await context.createForTest(7, 'https://example.test/a', true);
            assert.strictEqual(recovered.id, 42, 'retry after late success must receive original tab');
            assert.strictEqual(createCalls, 1, 'late-success retry must not create duplicate tab');
            assert.strictEqual(context.pendingForTest.size, 0, 'late success receipt is consumed once');

            const normal = await context.createForTest(7, 'https://example.test/b', true);
            assert.strictEqual(normal.id, 102);
            assert.strictEqual(createCalls, 2);
            assert.strictEqual(context.pendingForTest.size, 0, 'normal success must clear tracking state');

            console.log('P1-124 bounded tabs.create late-settlement dedupe regression PASS');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
          p1124 = '\n'.join(line[10:] if line.startswith('          ') else line for line in p1124.splitlines()) + '\n'
          (root / 'project_tools' / 'test_p1_124_tab_create_late_settlement.js').write_text(p1124, encoding='utf-8')

          # ---------- Registry reconciliation ----------
          priorities_path = root / 'project_docs' / 'PRIORITIES_P0_P1_P2.md'
          priorities = priorities_path.read_text(encoding='utf-8')
          rows = {
            'P1-085': '| P1-085 | P1 | REGRESSION | Direct readonly Journal IndexedDB view reads имеют deadline/abort и completion-aware result; timeout/error штатно переключается на bounded service-worker fallback без ранней публикации незавершённой transaction. |',
            'P1-124': '| P1-124 | P1 | REGRESSION | `chrome.tabs.create()` bounded локальным deadline и отслеживается до фактического settlement; identical retry не запускает второй create, а late success сохраняется как одноразовый bounded receipt и возвращает исходную вкладку вместо дубликата. |'
          }
          for code, row in rows.items():
              if re.search(rf'^\|\s*{re.escape(code)}\s*\|', priorities, re.M):
                  priorities = re.sub(rf'^\|\s*{re.escape(code)}\s*\|.*$', row, priorities, count=1, flags=re.M)
              else:
                  priorities = priorities.rstrip() + '\n' + row + '\n'
          priorities_path.write_text(priorities, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          note = '''### Audit WIP — P1-085 / P1-124

          Direct Journal readonly IndexedDB view reads сохраняют собственный 20-секундный deadline/abort и normal service-worker fallback; defensive early-result края больше не обходят transaction completion. `chrome.tabs.create()` теперь имеет 10-секундный caller deadline, но исходный non-cancellable promise отслеживается до реального settlement: identical retry не создаёт вторую вкладку, а late success временно сохраняется как одноразовый receipt. Manifest остаётся `0.9.8`; это не release QA.

          '''
          note = '\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines()) + '\n'
          if '### Audit WIP — P1-085 / P1-124' not in readme:
              marker = '## Изменения 0.9.7'
              if marker not in readme: raise SystemExit('README marker missing')
              readme = readme.replace(marker, note + marker, 1)
              readme_path.write_text(readme, encoding='utf-8')

          qa_path = root / 'QA_STATUS_0_9_9.md'
          qa = qa_path.read_text(encoding='utf-8')
          qa_note = '''

          ## 2026-08-25 — P1-085 / P1-124

          - P1-085: direct Journal readonly IDB get-many/meta/page/group/group-entry paths keep explicit deadline+abort and `tx.oncomplete` result publication; timeout/error uses the existing bounded SW fallback. Defensive early completion edges were removed.
          - P1-124: `tabs.create()` has a 10 s local deadline with actual-settlement tracking; same request while unresolved reuses the pending promise and late success is retained for one bounded retry receipt instead of creating a duplicate tab.
          - Dedicated deterministic regressions: `test_p1_085_journal_direct_read_deadline.js`, `test_p1_124_tab_create_late_settlement.js`.
          - Manifest remains `0.9.8`; real unpacked Chrome tab-creation timing remains release regression QA.
          '''
          qa_note = '\n'.join(line[10:] if line.startswith('          ') else line for line in qa_note.splitlines()) + '\n'
          if '## 2026-08-25 — P1-085 / P1-124' not in qa:
              qa_path.write_text(qa.rstrip() + qa_note, encoding='utf-8')

          print('P1-085/P1-124 patch complete')
          PY

      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 71
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 58
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          git diff --check

      - name: Write closure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > P1-085_CLOSURE.md <<'EOF'
          # P1-085 closure — direct readonly Journal IDB deadline + SW fallback

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          The current Journal view architecture already had the main P1-085 mechanics from P1-032: direct readonly get-many/meta/page/URL-group/group-entry IndexedDB reads use explicit transaction timers, call `tx.abort()` on deadline, publish normal data from `tx.oncomplete`, and fall back to bounded service-worker RPC when the direct path rejects.

          Physical closure removed two residual early-completion edges: a defensive missing-cursor branch now aborts and enters normal SW fallback instead of resolving an opened transaction, and an empty URL-group key is returned before opening IndexedDB rather than resolving an already-open readonly transaction.

          Dedicated `project_tools/test_p1_085_journal_direct_read_deadline.js` dynamically forces a hung direct get-many transaction, proves `abort()`, and proves one normal `WEBCLIP_JOURNAL_GET_MANY` service-worker fallback. Full gate: **71/71 JS syntax PASS; 58/58 deterministic tests PASS**.

          Real unpacked Chrome remains release QA; manifest is not bumped.
          EOF

          cat > P1-124_CLOSURE.md <<'EOF'
          # P1-124 closure — bounded tabs.create with late-settlement duplicate protection

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          `createTabNextTo()` no longer returns raw `chrome.tabs.create()`. The non-cancellable create promise receives a 10-second local deadline and remains tracked after a local timeout. An identical retry while the original create is unresolved waits on that same raw promise instead of launching a second tab creation. If Chrome later succeeds, WebClip keeps a bounded 60-second one-use late-success receipt; the next identical retry receives the original `Tab`/`tabId` and consumes the receipt rather than creating a duplicate. Late reject clears the barrier; normal success also clears it immediately.

          Positioning `chrome.tabs.get()` is intentionally not folded into this task; the separate P1-126 backlog item owns remaining unwrapped `tabs.get()` calls.

          Dedicated `project_tools/test_p1_124_tab_create_late_settlement.js` proves local timeout, no duplicate create during unknown settlement, late-success reuse, bounded receipt consumption, and normal subsequent create. Full gate: **71/71 JS syntax PASS; 58/58 deterministic tests PASS**.

          Real unpacked Chrome late-settlement timing remains release QA; manifest is not bumped.
          EOF

          cat > STATIC_CHECKS_P1-085_P1-124.md <<'EOF'
          # Static checks — P1-085 / P1-124

          Checkpoint date: 2026-08-25.

          - Manifest parse: PASS; Manifest V3; version **0.9.8**.
          - JavaScript syntax: **71/71 PASS**.
          - Deterministic `project_tools/test_*.js`: **58/58 PASS**.
          - P1-085 hung direct readonly Journal transaction: abort + bounded SW fallback PASS.
          - P1-085 defensive early result edges no longer bypass an opened transaction's completion.
          - P1-124 hung `tabs.create()`: local timeout returns `WEBCLIP_TAB_CREATE_PENDING`; identical retry creates no duplicate; late success is reused once; normal settlement clears state.
          - No release/build/handoff artifact created.

          This is engineering regression evidence, not unmanaged-Chrome release QA.
          EOF
          git diff --check

      - name: Commit coherent closure and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/close-p1-085-p1-124.yml
          git add journal.js service-worker.js \
            project_tools/test_p1_085_journal_direct_read_deadline.js \
            project_tools/test_p1_124_tab_create_late_settlement.js \
            P1-085_CLOSURE.md P1-124_CLOSURE.md STATIC_CHECKS_P1-085_P1-124.md \
            project_docs/PRIORITIES_P0_P1_P2.md README.md QA_STATUS_0_9_9.md
          git commit -m 'audit: close Journal read and tab create races (P1-085 P1-124)'
          git push origin HEAD:main
