name: audit-sync-20260826-p0-077-entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e9c557e090df024da4732bf875917f45c2bd0833"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p0-077-entry.yml"
      - name: Extend P0-077 audit evidence
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          suffix = ' Третий mismatch — **per-entry envelope**: live budgets независимо допускают SelectionSnapshot примерно до 2 MiB, journal comments суммарно до 2 MiB и отдельный file comment/metadata, поэтому валидная запись может превысить 4 MiB JSON. Но `readJournalEntryBatch()` abort-ит весь export, если одна сериализованная запись больше `JOURNAL_EXPORT_BATCH_MEMORY_CHARS = 4 MiB`, хотя import source-entry допускает до 8 MiB. Единый restore envelope обязан включать максимальный **exportable single-entry size**; live/import admission не должны создавать запись, которую полный backup затем не способен сериализовать. Добавить boundary test одной допустимой записи >4 MiB и проверить либо ранний admission reject/migration, либо streaming single-entry export без нарушения memory budget.'
          lines = p.splitlines()
          hits = 0
          for i, line in enumerate(lines):
              if line.startswith('| P0-077 |'):
                  hits += 1
                  if 'per-entry envelope' in line:
                      raise SystemExit('P0-077 per-entry extension already present')
                  if not line.endswith(' |'):
                      raise SystemExit('Unexpected P0-077 row format')
                  lines[i] = line[:-2] + suffix + ' |'
          if hits != 1:
              raise SystemExit(f'Expected one P0-077 row, got {hits}')
          p = '\n'.join(lines) + ('\n' if p.endswith('\n') else '')
          marker = '### P0-077 additional evidence — valid single entry can exceed export batch ceiling'
          if marker in a:
              raise SystemExit('Audit extension already present')
          a += f'''\n\n{marker}\n\nThe self-restore envelope mismatch is also per-entry, not only global. `JOURNAL_EXPORT_BATCH_MEMORY_CHARS` is 4 MiB and `readJournalEntryBatch()` aborts the complete export when one `JSON.stringify()` result exceeds that value. Yet independent live limits allow roughly 2 MiB of SelectionSnapshot plus up to 2 MiB of journal-comment text, a separate file comment and metadata; import parsing itself admits an 8 MiB source entry before field normalization. A valid stored entry can therefore make the whole full-Journal backup fail even when total Journal size is far below the 50/64 MiB global limits. P0-077 acceptance must include a single-entry exportability invariant, not merely total bytes and entry count.\n'''
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p0-077-entry.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p0-077-entry.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: extend Journal restore-envelope audit finding'
          git push
