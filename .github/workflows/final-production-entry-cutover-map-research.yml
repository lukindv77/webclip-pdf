name: Final production-entry cutover map research

on:
  push:
    branches:
      - research/final-production-entry-cutover-map-2026-09-10

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare diagnostics directory
        run: mkdir -p artifacts

      - name: Syntax check deterministic model
        run: node --check project_tools/test_final_production_entry_cutover_map_model.js

      - name: Execute deterministic model
        shell: bash
        run: |
          set -o pipefail
          node project_tools/test_final_production_entry_cutover_map_model.js 2>&1 | tee artifacts/final-cutover-model-output.txt

      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: final-production-entry-cutover-${{ github.sha }}
          path: artifacts/final-cutover-model-output.txt
          retention-days: 7
          if-no-files-found: warn
