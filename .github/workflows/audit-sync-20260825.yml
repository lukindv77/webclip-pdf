name: audit-sync-20260825

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded audit patch
        shell: bash
        run: python3 project_tools/_audit_sync_20260825.py
      - name: Verify manifest and diff scope
        shell: bash
        run: |
          python3 -c "import json; m=json.load(open('manifest.json',encoding='utf-8')); assert m['manifest_version']==3; assert m['version']=='0.9.8'; assert int(m['minimum_chrome_version'])==118; assert m['content_security_policy']['extension_pages']==\"script-src 'self'; object-src 'self'\"; print('manifest invariants PASS')"
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' DEEP_AUDIT_2026-08-25.md project_docs/PRIORITIES_P0_P1_P2.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit docs and remove temporary tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-sync-20260825.yml project_tools/_audit_sync_20260825.py
          git add DEEP_AUDIT_2026-08-25.md project_docs/PRIORITIES_P0_P1_P2.md
          git commit -m 'docs: sync audit state through P0-069'
          git push origin HEAD:main
