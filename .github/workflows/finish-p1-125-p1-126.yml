name: Finish P1-125 and P1-126

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-p1-125-p1-126.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited patch and repair isolated harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/finalize-p1-125-p1-126.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY\n", start)
          payload = textwrap.dedent(wf[start:end])
          exec(compile(payload, 'p1_125_126_patch.py', 'exec'), {})

          test_path = Path('project_tools/test_recovered_p0_060_062.js')
          test = test_path.read_text(encoding='utf-8')
          old = "    withOperationTimeout: (promise) => Promise.resolve(promise),\n    createTabNextTo: async () => { createCalls += 1; return { id: 99 }; }"
          new = "    withOperationTimeout: (promise) => Promise.resolve(promise),\n    getChromeTabBounded: (tabId) => Promise.resolve().then(() => chrome.tabs.get(tabId)),\n    createTabNextTo: async () => { createCalls += 1; return { id: 99 }; }"
          if old not in test:
              raise SystemExit('recovered P0-060/061/062 harness anchor missing')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          print('isolated recovered harness repaired')
          PY

      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 73
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 60
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          test "$(grep -o 'chrome\.scripting\.executeScript(' service-worker.js | wc -l)" -eq 1
          test "$(grep -o 'chrome\.tabs\.get(' service-worker.js | wc -l)" -eq 1
          git diff --check

      - name: Write closure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > P1-125_CLOSURE.md <<'EOF'
          # P1-125 closure — bounded scripting.executeScript with singleton-safe late injection

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          Both service-worker injection paths use `executeScriptSingletonBounded()` with a 10-second caller deadline while the actual non-cancellable Chrome promise stays tracked to settlement. Identical retry cannot start a second injection during unknown settlement. Late success is retained as a bounded 60-second one-use receipt. URL navigation/tab removal clears stale per-tab settlement state, and late settlement cannot resurrect a stale receipt.

          `content.js` keeps `__WEBCLIP_PDF_PROTOTYPE_LOADED__`; `frame-agent.js` keeps `__WEBCLIP_FRAME_AGENT_LOADED__`, so later legitimate ensure calls remain singleton-safe.

          Dedicated `project_tools/test_p1_125_execute_script_settlement.js` proves timeout, no duplicate during unknown settlement, late-success reuse, receipt consumption, navigation fencing and singleton guards. Full gate: **73/73 JS syntax PASS; 60/60 deterministic tests PASS**.

          Real unpacked Chrome injection/navigation timing remains release QA; manifest is not bumped.
          EOF

          cat > P1-126_CLOSURE.md <<'EOF'
          # P1-126 closure — bounded service-worker tabs.get reads

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          All service-worker `chrome.tabs.get()` reads route through one `getChromeTabBounded()` helper with a 5-second default deadline. Existing caller semantics remain: Journal source/anchor checks fail closed, PDF retry cache is rejected/deleted when current URL cannot be established, Chrome Action refresh exits safely, and new-tab positioning falls back to normal placement if the source tab cannot be resolved.

          The worker contains exactly one low-level `chrome.tabs.get()` call. Dedicated `project_tools/test_p1_126_tabs_get_deadlines.js` proves hung-read timeout, invalid-tab fail-fast and static coverage of all five callers. The recovered P0-060/061/062 isolated VM harness was updated only to provide the new centralized read helper dependency. Full gate: **73/73 JS syntax PASS; 60/60 deterministic tests PASS**.

          Real unpacked Chrome timing remains release QA; manifest is not bumped.
          EOF

          cat > STATIC_CHECKS_P1-125_P1-126.md <<'EOF'
          # Static checks — P1-125 / P1-126

          Checkpoint date: 2026-08-25.

          - Manifest parse: PASS; Manifest V3; version **0.9.8**.
          - JavaScript syntax: **73/73 PASS**.
          - Deterministic `project_tools/test_*.js`: **60/60 PASS**.
          - Low-level service-worker `chrome.scripting.executeScript()`: exactly **1**, inside the settlement helper.
          - P1-125 timeout/no-duplicate/late-success/navigation-fence regression: PASS; content/frame singleton guards preserved.
          - Low-level service-worker `chrome.tabs.get()`: exactly **1**, inside `getChromeTabBounded()`.
          - P1-126 hung-read deadline + invalid-tab fail-fast regression: PASS.
          - Recovered P0-060/P0-061/P0-062 isolated harness compatibility with centralized `tabs.get` helper: PASS.
          - No release/build/handoff artifact created.

          This is engineering regression evidence, not unmanaged-Chrome release QA.
          EOF
          git diff --check

      - name: Commit closure and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/close-p1-125-p1-126.yml \
            .github/workflows/finalize-p1-125-p1-126.yml \
            .github/workflows/finish-p1-125-p1-126.yml
          git add service-worker.js \
            project_tools/test_p1_124_tab_create_late_settlement.js \
            project_tools/test_p1_125_execute_script_settlement.js \
            project_tools/test_p1_126_tabs_get_deadlines.js \
            project_tools/test_recovered_p0_060_062.js \
            P1-125_CLOSURE.md P1-126_CLOSURE.md STATIC_CHECKS_P1-125_P1-126.md \
            project_docs/PRIORITIES_P0_P1_P2.md README.md QA_STATUS_0_9_9.md
          git commit -m 'audit: bound script injection and tab reads (P1-125 P1-126)'
          git push origin HEAD:main
