name: Research C44

on:
  push:
    branches:
      - research/evidence-c44-backup-import-recovery-2026-09-03

permissions:
  contents: write

jobs:
  c44:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check playwright
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Run C44 exact-source physical probe
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.path }}
          C44_SOURCE_BASELINE: 508877da4357c7610adbb150ea222ea8ea8464bf
          C44_WORKER_BLOB_SHA: cffe46adbd0227bae51c95462d6d705b264838fe
          C44_JOURNAL_BLOB_SHA: 05cb89db3c322d547faf17b2359e92161d0bcbe7
        run: |
          set -euo pipefail
          python project_tools/research_c44_backup_import_recovery.py --chrome "$CHROMIUM_BIN" | tee c44-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c44-result
          path: c44-result.txt
          if-no-files-found: error
      - name: Publish canonical C44 matrix checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = p.read_text(encoding='utf-8')
          old_row = "| C44 | Backup / import / recovery | `NOT-TRIAGED / UNKNOWN` |"
          new_row = "| C44 | Backup / import / recovery | `L4-REVALIDATED / PARTIAL/FINDING + POSITIVE/PHYSICAL-IDB/RELOAD/STAGED-ID/COUNT/FIELD-ROUNDTRIP/LEASE/CAS CONTROLS; FULL-ROUNDTRIP/MERGE/BROWSER-RESTART/REMOTE-L5 OPEN (P0-013, P1-194, P1-207, P1-215, P0-072; P0-077 positive)` |"
          old_task = "| C44 | OPEN — unknown | Complete full export → staged import → explicit replace/merge → restart/recovery round trips, including concurrent Journal revision, staging ownership and storage-durability classification; verify exact entry/selection/provenance preservation without silent deletion. | P0-013, P1-194, P1-207, P1-215; P0-077 DONE positive | B7/B8/B9; local first, real remote backup only where required |"
          new_task = "| C44 | OPEN — L4 partial; full UI roundtrip/merge/browser-restart/remote remain | Exercise the real current UI export → selected-file transfer staging → normalized staging → replace/merge decision through service-worker/page/browser restart; bind selected backup digest + staging generation + expected Journal revision, retain live staging by bounded lease, and reconcile rather than erase admitted side-effect checkpoints. If merge is unsupported, record that as an explicit product decision instead of simulating coverage. | P0-013, P1-194, P1-207, P1-215, P0-072; P0-077 DONE positive | B7/B8/B9; real unpacked local roundtrip/restart first, remote backup only with authorized context |"
          old_exec = "Execution stays sequential unless an earlier row exposes a cross-boundary blocker. **C41 remains blocked on real native/restart L5; C42 remains blocked on an explicitly authorized Yandex test account/root; C43 advances locally to L4 partial and its remote remainder shares the C42 external prerequisite. C44 is therefore the next locally executable coordinate.** External-account/user-owned UI work must not be simulated as L5; unavailable external prerequisites remain explicit blockers rather than inferred success."
          new_exec = "Execution stays sequential unless an earlier row exposes a cross-boundary blocker. **C41 remains blocked on real native/restart L5; C42 remains blocked on an explicitly authorized Yandex test account/root; C43 remote shares the C42 external prerequisite. C44 advances locally to L4 partial but remains the next coordinate because its real UI/full-browser restart and replace/merge decision are still locally executable; C45 stays queued.** External-account/user-owned UI work must not be simulated as L5; unavailable external prerequisites remain explicit blockers rather than inferred success."
          for old, new in ((old_row,new_row),(old_task,new_task),(old_exec,new_exec)):
              if old in text:
                  text = text.replace(old,new,1)
              elif new not in text:
                  raise SystemExit('expected C44 baseline anchor missing')
          marker = "## Fresh continuation checkpoint — focused C44 Backup / import / recovery"
          if marker not in text:
              checkpoint = f"""\n{marker}\n\n`RESEARCH_FULL_RESTART_C44_BACKUP_IMPORT_RECOVERY_2026-09-03.md` records accepted fresh C44 current-source + physical Chrome IndexedDB/race evidence on canonical source `508877da4357c7610adbb150ea222ea8ea8464bf`, Chrome `151.0.7922.173`, workflow run `33723881258`, job `100548527410`, exact accepted workflow head `4d64d216f281d3ac443632eae737af076020752e`, conclusion SUCCESS and result SHA-256 `56f54b8e797f88361c9ba18c6359609a8a9401d53074afe35c7b8111095ca045`.\n\nFresh evidence proves production-shaped IndexedDB import staging survives renderer reload, while the current two-hour age cleanup has no inspected live-owner lease. A stale preview schedule at Journal revision 7 followed by concurrent revision 8 still commits current replace, erases the concurrent entry and clears `pendingAppends` / `pendingDownloads` / `pendingRemoteSaves`; lease-aware and expected-revision CAS causal controls preserve the corresponding state. Exact `importId`/count and selection/provenance field roundtrip are positive controls. No explicit staged-import merge command was found, and full UI export/file/import, real browser-process restart and remote backup remain open.\n\nDuplicate/root-cause reconciliation keeps existing **P0-013 / P1-194 / P1-207 / P1-215 ACTIVE** and adds fresh direct C44 overlap with **P0-072 ACTIVE**; **P0-077 DONE** remains positive only. No new P-code, Registry wording/status, runtime/version or release change is warranted. C44 advances to `L4-REVALIDATED / PARTIAL/FINDING + POSITIVE/PHYSICAL-IDB/RELOAD/STAGED-ID/COUNT/FIELD-ROUNDTRIP/LEASE/CAS CONTROLS; FULL-ROUNDTRIP/MERGE/BROWSER-RESTART/REMOTE-L5 OPEN (P0-013, P1-194, P1-207, P1-215, P0-072; P0-077 positive)` and remains the next locally executable coordinate.\n\n"""
              anchor = "## Coverage Sweep 1 — execution/authority skeleton"
              if anchor not in text:
                  raise SystemExit('coverage-sweep anchor missing')
              text = text.replace(anchor, checkpoint + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md; then
            echo 'C44 baseline already published.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md
          git commit -m 'research: publish C44 coverage checkpoint'
          git push origin HEAD:research/evidence-c44-backup-import-recovery-2026-09-03
