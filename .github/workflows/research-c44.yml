name: Research C44

on:
  push:
    branches:
      - research/evidence-c44-backup-import-recovery-2026-09-03

permissions:
  contents: read

jobs:
  c44:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check playwright
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --version
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Run C44 exact-source physical probe
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.path }}
          C44_SOURCE_BASELINE: 508877da4357c7610adbb150ea222ea8ea8464bf
          C44_WORKER_BLOB_SHA: cffe46adbd0227bae51c95462d6d705b264838fe
          C44_JOURNAL_BLOB_SHA: 05cb89db3c322d547faf17b2359e92161d0bcbe7
        run: |
          set -euo pipefail
          python project_tools/research_c44_backup_import_recovery.py --chrome "$CHROMIUM_BIN" | tee c44-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c44-result
          path: c44-result.txt
          if-no-files-found: error
