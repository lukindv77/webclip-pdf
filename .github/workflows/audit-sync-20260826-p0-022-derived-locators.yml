name: audit-sync-p0-022-derived-locators

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-audit-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "29552bd70166eeb8230f7ce16a99a93a282765e1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p0-022-derived-locators.yml"
      - name: Update audit docs
        shell: python
        run: |
          from pathlib import Path
          priorities = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          audit = Path('DEEP_AUDIT_2026-08-25.md')
          p = priorities.read_text(encoding='utf-8')
          a = audit.read_text(encoding='utf-8')
          lines = p.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| P0-022 |')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one P0-022 row, got {len(matches)}')
          if '| P0 | PARTIAL |' not in lines[matches[0]]:
              raise SystemExit('P0-022 baseline status changed; refuse stale sync')
          lines[matches[0]] = "| P0-022 | P0 | PARTIAL | Managed-branch containment перед destructive Yandex move/delete реализован, но импортируемая remote identity/locator metadata всё ещё может стать authority без доказанного provenance. `normalizeImportedJournalEntry()` принимает из неподписанного backup `remotePath/resourceId/publicUrl/accountUid/rootPath`, а также `filename/folder/readMoveSourcePath/readMoveTargetPath`; identity-поля могут быть пустыми. `findYandexFileForJournalEntry()` при отсутствии `resourceId/publicUrl` делает `matchesKnownIdentity()` безусловно `true` для любого `file`: это опасно не только для сохранённого `remotePath`. Даже если `remotePath` отсутствует, deterministic fallback строит кандидаты из импортированных `filename + hostname`, `folder`, `readMoveSourcePath/readMoveTargetPath`, проверяет exact path и принимает найденный файл как объект записи. Поэтому crafted backup может создать ложную Yandex-entry без stable identity, назвать существующий WebClip-файл/подставить pending path внутри managed branches, после чего последующий явно выбранный пользователем `Trash`/`Прочитано` способен переместить чужой реальный файл. Path containment закрывает выход за служебные ветки, но не provenance внутри них. Imported/legacy path-only **и derived-locator-only** reference не должны автоматически давать destructive capability: новые записи должны хранить локально выданный versioned provenance/object receipt; import должен помечать remote references и locator-derived recovery hints как `imported-unverified`; destructive action обязан сначала безопасно re-bind/доказать exact remote object identity либо fail-closed. `filename/folder/readMove*` из backup могут быть display/recovery hints, но не authority для выбора destructive source без доказанной identity. Не считать imported resourceId/publicUrl сами по себе доверенной подписью; account/root fence P0-073/P0-074, site-routing canonicalization P1-189 и stronger content/object proof P1-184 сохранить. Добавить regression: crafted import с пустыми `remotePath/resourceId/publicUrl`, но filename/path hints существующего managed файла не должен получить destructive bind. |"
          p = '\n'.join(lines) + ('\n' if p.endswith('\n') else '')
          marker = '## Continuation 2026-08-26 — P0-022 derived locator provenance gap'
          if marker in a:
              raise SystemExit('P0-022 derived locator marker already present')
          a += "\n\n" + marker + "\n\nAudit baseline: `29552bd70166eeb8230f7ce16a99a93a282765e1`. Documentation-only sync; production runtime and manifest are unchanged, and the previous product test gate was not rerun.\n\n**P0-022 is broader than stored `remotePath`.** Import preserves `filename`, `folder`, `readMoveSourcePath` and `readMoveTargetPath` from the backup. `findYandexFileForJournalEntry()` builds deterministic candidate paths from those fields (plus site folders) before global identity search. When both `resourceId` and `publicUrl` are absent, `matchesKnownIdentity()` accepts any file returned at a candidate path. Therefore a crafted imported entry can omit stable remote identity and still bind to an existing managed WebClip file by filename/path hints, after which a user-approved Trash or Read move can destructively affect that object. Treat every imported locator-only reference as unverified provenance; path containment is necessary but insufficient. Require a locally issued object/provenance receipt or an explicit safe re-bind that proves exact identity before destructive use. P1-189 separately canonicalizes the site identity used to derive folders.\n"
          priorities.write_text(p, encoding='utf-8')
          audit.write_text(a, encoding='utf-8')
      - name: Verify docs-only scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-sync-20260826-p0-022-derived-locators.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=$'.github/workflows/audit-sync-20260826-p0-022-derived-locators.yml\nDEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          grep -q '"manifest_version": 3' manifest.json
          grep -q '"version": "0.9.8"' manifest.json
          grep -q '"minimum_chrome_version": "118"' manifest.json
      - name: Commit audit sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: extend P0-022 imported locator provenance finding'
          git push