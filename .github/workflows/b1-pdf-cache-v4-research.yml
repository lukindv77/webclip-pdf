name: B1 PDF cache v4 research
on:
  push:
    branches:
      - research/b1-pdf-cache-v4-production-entry-source-spec-2026-09-09
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node project_tools/test_b1_pdf_cache_v4_production_entry_model.js
      - run: node project_tools/test_b1_pdf_cache_v4_current_source_inventory.js
      - name: Download exact Chrome for Testing Stable
        run: |
          curl -fL --retry 3 -o chrome.zip https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chrome-linux64.zip
          unzip -q chrome.zip
          ./chrome-linux64/chrome --version
      - name: Run B1 current-Chrome IndexedDB fixture
        run: CHROME_BIN="$PWD/chrome-linux64/chrome" node project_tools/run_b1_pdf_cache_v4_chrome_idb_fixture_v2.js
