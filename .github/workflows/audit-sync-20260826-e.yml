name: audit-sync-20260826-e

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded audit patch
        run: python project_tools/_audit_sync_20260826_e.py
      - name: Verify docs-only scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json', encoding='utf-8'))
          assert m['manifest_version'] == 3
          assert m['version'] == '0.9.8'
          assert int(m['minimum_chrome_version']) == 118
          assert m['content_security_policy']['extension_pages'] == "script-src 'self'; object-src 'self'"
          print('manifest invariants PASS')
          PY
          test "$(git diff --name-only | sort)" = $'DEEP_AUDIT_2026-08-25.md\nproject_docs/PRIORITIES_P0_P1_P2.md'
      - name: Commit audit docs and remove tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-sync-20260826-e.yml project_tools/_audit_sync_20260826_e.py
          git add DEEP_AUDIT_2026-08-25.md project_docs/PRIORITIES_P0_P1_P2.md
          git commit -m 'docs: record backup identity and public-link audit findings'
          git push origin HEAD:main
