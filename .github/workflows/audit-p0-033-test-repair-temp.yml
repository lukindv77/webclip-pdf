name: Audit P0-033 exact stale-test repair temporary

on:
  push:
    branches: [fix/p0-033-signed-yandex-log-redaction-2026-09-01]

permissions:
  contents: write

jobs:
  repair-stale-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore canonical test and update one expectation
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- project_tools/test_p0_071_print_render_guard.js
          python - <<'PY'
          from pathlib import Path
          p = Path('project_tools/test_p0_071_print_render_guard.js')
          text = p.read_text(encoding='utf-8')
          old = "assert.match(bootstrapSource, /importScripts\\('pdf-print-guard\\.js',\\s*'content-injection-guard\\.js'\\)/, 'worker bootstrap must load the P0-071 guard first before later security bootstraps and service-worker body execution');"
          new = "assert.match(bootstrapSource, /importScripts\\('pdf-print-guard\\.js',\\s*'content-injection-guard\\.js',\\s*'operation-log-redaction-guard\\.js'\\)/, 'worker bootstrap must load the P0-071 guard first before later security bootstraps and service-worker body execution');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale P0-071 bootstrap assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat origin/main -- project_tools/test_p0_071_print_render_guard.js | awk '{print $1":"$2}')" = "1:1"
          git config user.name 'lukindv77'
          git config user.email 'lukindv@gmail.com'
          git add project_tools/test_p0_071_print_render_guard.js
          git commit -m 'test: accept expanded P0-071 security bootstrap'
          git push origin HEAD:fix/p0-033-signed-yandex-log-redaction-2026-09-01
