name: audit-sync-p1-178-stale-oauth-config
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sync-20260826-p1-178-stale-oauth-config.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "59fe8fe89ba3af39dd2202639f25b7bcc48879f0"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p1-178-stale-oauth-config.yml"
      - name: Sync audit docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          t = p.read_text(encoding='utf-8')
          old = "| P1-178 | P1 | OPEN | OAuth code exchange и `yandexOAuthPending` не образуют completion-aware **generation-fenced** state machine. `finishYandexOAuth()` сначала получает token по network POST, затем отдельно обновляет config, пишет `yandexAuth` в `storage.session` и удаляет pending. Любой локальный timeout после успешного token response способен вернуть UI ошибку в промежуточном состоянии; token exchange нельзя blind-retry. Дополнительно подтверждён compare-and-remove TOCTOU: `getYandexStatus()` читает pending snapshot, решает что он expired, затем отдельным serialized turn делает `remove`; новая `startYandexOAuth()` может успеть записать свежий pending между read и remove, после чего старый cleanup удалит **новую** попытку. Аналогичное окно есть в expired cleanup `finishYandexOAuth()` и в success cleanup после долгого token exchange — старая finish-операция способна удалить pending более новой auth attempt. Нужен immutable `authAttemptId/state generation`; read/validate/consume/remove должны быть одним serialized read-modify-write logical turn либо fresh compare-before-remove exact attempt identity. После успешного exchange auth + consumed attempt фиксируются одним completion/reconciliation contract; поздний settlement трактуется как pending outcome, status/restart repair не может удалить более новую generation; ancillary config/account-info write не превращает сохранённую OAuth session в ложный terminal failure. |"
          new = "| P1-178 | P1 | OPEN | OAuth code exchange и `yandexOAuthPending` не образуют completion-aware **generation-fenced** state machine. `finishYandexOAuth()` сначала получает token по network POST, затем отдельно обновляет config, пишет `yandexAuth` в `storage.session` и удаляет pending. Любой локальный timeout после успешного token response способен вернуть UI ошибку в промежуточном состоянии; token exchange нельзя blind-retry. Дополнительно подтверждён compare-and-remove TOCTOU: `getYandexStatus()` читает pending snapshot, решает что он expired, затем отдельным serialized turn делает `remove`; новая `startYandexOAuth()` может успеть записать свежий pending между read и remove, после чего старый cleanup удалит **новую** попытку. Аналогичное окно есть в expired cleanup `finishYandexOAuth()` и в success cleanup после долгого token exchange — старая finish-операция способна удалить pending более новой auth attempt. Новый audit evidence: settings import может зафиксировать более новый `yandexConfig.clientId=B`, пока старая PKCE attempt A ещё ждёт network token exchange; эта сеть ещё не входит ни в `yandexConfigStorageSettlementChain`, ни в settings-import storage barrier. После завершения старый `finishYandexOAuth()` вызывает `updateYandexConfig(...clientId=A)` и способен откатить более новое пользовательское значение B. Нужен immutable `authAttemptId/state generation` **и config/settings generation**; read/validate/consume/remove и поздний auth/config commit должны atomically/fresh-check exact generation. Более новая settings/config mutation должна инвалидировать несовместимую pending attempt либо старый finish обязан fail-closed не перезаписывать её. После успешного exchange auth + consumed attempt фиксируются одним completion/reconciliation contract; поздний settlement трактуется как pending outcome, status/restart repair не может удалить более новую generation; ancillary config/account-info write не превращает сохранённую OAuth session в ложный terminal failure и не откатывает более новые настройки. Regression: start PKCE с clientId A → import settings clientId B → поздний exchange A не меняет B и не публикует stale auth/config без явного generation-consistent решения. |"
          if old not in t:
              raise SystemExit('P1-178 baseline text not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          a = Path('DEEP_AUDIT_2026-08-25.md')
          with a.open('a', encoding='utf-8') as f:
              f.write("\n\n## Continuation 2026-08-26 — P1-178 stale OAuth completion versus newer settings generation\n\n")
              f.write("| Code | Priority | Status | Finding |\n|---|---|---|---|\n")
              f.write("| P1-178 | P1 | OPEN | A pending PKCE attempt keeps its original clientId while the token exchange can remain in network I/O outside both the yandexConfig settlement chain and settings-import barrier. User-settings import may therefore commit a newer clientId B while old attempt A is still in flight; when A later returns, `finishYandexOAuth()` calls `updateYandexConfig()` and writes clientId A after the import, silently rolling back the newer setting. Existing storage actual-settlement ordering is insufficient because the stale operation has not entered the storage queue yet. Extend the authAttempt generation contract to config/settings generation: a stale finish may not overwrite a newer imported/direct config generation; incompatible newer config can invalidate the old pending attempt or the late finish must fail closed/reconcile without publishing stale auth/config. |\n")
              f.write("\nDocs-only audit sync; production runtime and manifest unchanged; product gate not rerun.\n")
      - name: Remove temporary workflow and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/audit-sync-20260826-p1-178-stale-oauth-config.yml
          git add -A
          printf '%s\n' "$(git diff --cached --name-only)" | sort > /tmp/actual
          printf '%s\n' ".github/workflows/audit-sync-20260826-p1-178-stale-oauth-config.yml" "DEEP_AUDIT_2026-08-25.md" "project_docs/PRIORITIES_P0_P1_P2.md" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          python - <<'PY'
          import json
          m=json.load(open('manifest.json', encoding='utf-8'))
          assert m['manifest_version']==3
          assert m['version']=='0.9.8'
          assert m['minimum_chrome_version']=='118'
          PY
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: refine P1-178 stale OAuth config generation'
          git push origin HEAD:main
