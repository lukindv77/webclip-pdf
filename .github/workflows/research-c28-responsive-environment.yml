name: Research C28 responsive environment

on:
  push:
    branches: [research/evidence-c28-responsive-environment-2026-09-02]

permissions:
  contents: write

jobs:
  physical-c28:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright pymupdf pypdf

      - name: Run exact-source C28 physical capture
        id: probe
        shell: bash
        env:
          C28_BASE_SHA: 880256a7d6bfd612c3abdd5f11c0ffdd33190033
        run: |
          set +e
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium missing" >&2
            exit 2
          fi
          python project_tools/research_c28_responsive_environment.py --chrome "$chrome" --out /tmp/c28 > /tmp/c28.log 2>&1
          status=$?
          cat /tmp/c28.log
          python - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/c28.log').read_text(encoding='utf-8', errors='replace')
          marker = 'C28_RESULT_JSON='
          lines = [line for line in log.splitlines() if line.startswith(marker)]
          if not lines:
              raise SystemExit('C28_RESULT_JSON not found')
          data = json.loads(lines[-1][len(marker):])
          Path('project_tools/.c28-physical-result.json').write_text(json.dumps(data, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist temporary C28 raw receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_tools/.c28-physical-result.json
          if git diff --cached --quiet; then
            echo 'No raw receipt delta.'
          else
            git commit -m 'research: persist temporary C28 physical result'
            git push origin HEAD:research/evidence-c28-responsive-environment-2026-09-02
          fi

      - name: Assert C28 harness status
        shell: bash
        run: |
          status='${{ steps.probe.outputs.status }}'
          if [[ "$status" != '0' ]]; then
            echo "C28 harness exited $status" >&2
            exit "$status"
          fi
