name: Publish C43 research

on:
  push:
    branches: [research/evidence-c43-2026-09-03]
    paths:
      - project_tools/.c43-publish-trigger

permissions:
  contents: write

jobs:
  publish-c43:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish baseline and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python project_tools/.tmp_c43_publish.py
          rm -f project_tools/.tmp_c43_publish.py project_tools/.c43-physical-result.json project_tools/.c43-publish-trigger .github/workflows/research-c43.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: publish C43 coverage checkpoint'
          git push origin HEAD:research/evidence-c43-2026-09-03
