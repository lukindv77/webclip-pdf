name: Research C43

on:
  push:
    branches: [research/evidence-c43-2026-09-03]
    paths-ignore:
      - project_tools/.c43-physical-result.json

permissions:
  contents: write

jobs:
  physical-c43:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.0.0

      - name: Run exact-source physical C43 matrix
        shell: bash
        run: |
          set -uo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo 'Google Chrome/Chromium unavailable' >&2
            exit 1
          fi
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          export WORKER_BLOB_SHA="$(git rev-parse HEAD:service-worker.js)"
          export OFFSCREEN_BLOB_SHA="$(git rev-parse HEAD:offscreen.js)"
          python project_tools/research_c43_journal_provenance.py --chrome "$chrome" | tee "$RUNNER_TEMP/c43-result.log"
          result="$(grep '^C43_RESULT_JSON=' "$RUNNER_TEMP/c43-result.log" | tail -n 1 | sed 's/^C43_RESULT_JSON=//')"
          test -n "$result"
          printf '%s\n' "$result" > project_tools/.c43-physical-result.json
          echo "::notice title=C43_RESULT::$result"

      - name: Persist temporary exact result receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c43-physical-result.json
          git commit -m 'research: persist temporary C43 result'
          git push origin HEAD:research/evidence-c43-2026-09-03
