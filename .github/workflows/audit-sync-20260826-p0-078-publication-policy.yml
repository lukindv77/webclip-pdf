name: audit-sync-p0-078-publication-policy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sync-20260826-p0-078-publication-policy.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard baseline and append finding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ff69e95752ee1e4bf3fe4bcc5a27ff8f38e9e567"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/audit-sync-20260826-p0-078-publication-policy.yml"
          python3 - <<'PY'
          import base64, json, pathlib
          p = pathlib.Path('project_docs/PRIORITIES_P0_P1_P2.md')
          d = pathlib.Path('DEEP_AUDIT_2026-08-25.md')
          pp = base64.b64decode('').decode()
          dd = base64.b64decode('').decode()
          pt = p.read_text(); dt = d.read_text()
          if 'P0-078' in pt or 'P0-078' in dt: raise SystemExit('P0-078 already exists')
          p.write_text(pt + pp)
          d.write_text(dt + dd)
          m = json.loads(pathlib.Path('manifest.json').read_text())
          assert m['manifest_version'] == 3 and m['version'] == '0.9.8' and m['minimum_chrome_version'] == '118'
          PY
          rm .github/workflows/audit-sync-20260826-p0-078-publication-policy.yml
          git add project_docs/PRIORITIES_P0_P1_P2.md DEEP_AUDIT_2026-08-25.md .github/workflows/audit-sync-20260826-p0-078-publication-policy.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/audit-sync-20260826-p0-078-publication-policy.yml' 'DEEP_AUDIT_2026-08-25.md' 'project_docs/PRIORITIES_P0_P1_P2.md' | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record P0-078 publication policy fence'
          git push
