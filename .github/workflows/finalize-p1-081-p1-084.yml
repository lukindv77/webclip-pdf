name: Finalize P1-081 and P1-084

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-p1-081-p1-084.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply closure patch and fix CommonJS async harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          priorities_path = Path('project_docs/PRIORITIES_P0_P1_P2.md')
          priorities = priorities_path.read_text(encoding='utf-8')
          rows = {
            'P1-081': '| P1-081 | P1 | OPEN | Обычные OperationLog v2 IndexedDB CRUD должны иметь bounded/abortable transaction deadline; readonly результат публикуется только после `tx.oncomplete`, append-only timeline и v1→v2 migration сохраняются. |',
            'P1-084': '| P1-084 | P1 | OPEN | Обычные PDF retry-cache IndexedDB CRUD должны иметь bounded/abortable transaction deadline; `pdfs`+`meta` остаются атомарными, TTL и URL binding сохраняются. |'
          }
          missing = [code for code in rows if not re.search(rf'^\|\s*{re.escape(code)}\s*\|', priorities, re.M)]
          if missing:
            priorities = priorities.rstrip() + '\n\n## Физическое закрытие backlog — reconciliation 2026-08-25\n\n| Код | Приоритет | Статус | Пункт |\n|---|---|---|---|\n' + '\n'.join(rows[c] for c in missing) + '\n'
            priorities_path.write_text(priorities, encoding='utf-8')

          workflow = Path('.github/workflows/close-p1-081-p1-084.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
            raise SystemExit('Cannot extract canonical patch script')
          exec(compile(textwrap.dedent(match.group(1)), 'p1-081-084-patch.py', 'exec'), {'__name__': '__main__'})

          test_path = Path('project_tools/test_p1_081_084_idb_deadlines.js')
          test = test_path.read_text(encoding='utf-8')
          start = 'let hungTx = null;'
          end = "console.log('P1-081/P1-084 bounded IDB CRUD regression OK');"
          if start not in test or end not in test:
            raise SystemExit('New deadline test async anchors missing')
          test = test.replace(start, '(async () => {\n' + start, 1)
          test = test.replace(end, end + "\n})().catch((error) => { console.error(error); process.exitCode = 1; });", 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 69
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 56
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          git diff --check

      - name: Write closure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > P1-081_CLOSURE.md <<'EOF'
          # P1-081 closure — bounded ordinary OperationLog v2 IDB CRUD

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          Ordinary OperationLog header mutation, event append/migration/pruning, list, detail read and full clear now use `runIndexedDbTransactionBounded()` with `OPERATION_LOG_CRUD_IDB_TX_TIMEOUT_MS = 20_000`. Timeout aborts the transaction with `WEBCLIP_IDB_TIMEOUT`. Readonly list/detail values are staged with `setResult()` and become visible only from `tx.oncomplete`.

          The v2 append-only `events` timeline, `operationStartEvent`, v1→v2 migration, event order/count/size pruning and atomic readwrite semantics remain intact. Maintenance cleanup keeps its separate maintenance deadline.

          Evidence: `project_tools/test_p1_081_084_idb_deadlines.js` PASS; existing `project_tools/test_operation_log_v1_v2.js` PASS; full deterministic gate **69/69 JS syntax** and **56/56 tests** PASS. Real unpacked Chrome remains release QA; manifest is not bumped.
          EOF
          cat > P1-084_CLOSURE.md <<'EOF'
          # P1-084 closure — bounded ordinary PDF retry-cache IDB CRUD

          Status: **REGRESSION**. Manifest remains **0.9.8 / Manifest V3**.

          Ordinary PDF retry-cache save/read/metadata-repair/delete now use `runIndexedDbTransactionBounded()` with `PDF_CACHE_CRUD_IDB_TX_TIMEOUT_MS = 20_000`. PDF+metadata save and delete remain one atomic transaction across `pdfs` + `meta`; readonly values are staged until `tx.oncomplete`; legacy metadata repair is bounded/abortable.

          P0-023 invariants remain unchanged: 24-hour TTL and exact normalized current-URL binding; stale or mismatched cache is removed fail-closed. Maintenance cleanup and offscreen transfer cache reads keep their independent deadline domains.

          Evidence: `project_tools/test_p1_081_084_idb_deadlines.js` PASS; full deterministic gate **69/69 JS syntax** and **56/56 tests** PASS. Real unpacked Chrome/Yandex remain release QA; manifest is not bumped.
          EOF
          cat > STATIC_CHECKS_P1-081_P1-084.md <<'EOF'
          # Static checks — P1-081 / P1-084

          Checkpoint: 2026-08-25.

          - Manifest parse / MV3 / version 0.9.8: PASS.
          - JavaScript `node --check`: **69/69 PASS**.
          - Deterministic `project_tools/test_*.js`: **56/56 PASS**.
          - Dedicated `test_p1_081_084_idb_deadlines.js`: PASS, including hung tx abort and readonly no-publication-before-`tx.oncomplete`.
          - Existing OperationLog v1→v2 regression: PASS.
          - OperationLog and PDF-cache CRUD use separate 20 s abortable deadlines; maintenance/offscreen deadline domains remain separate.

          Not release QA: unmanaged unpacked Chrome and real Yandex remain required before any 0.9.9 release claim.
          EOF
          git diff --check

      - name: Commit closure and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/close-p1-081-p1-084.yml .github/workflows/retry-close-p1-081-p1-084.yml .github/workflows/finalize-p1-081-p1-084.yml
          git add service-worker.js project_tools/test_operation_log_v1_v2.js project_tools/test_p1_081_084_idb_deadlines.js P1-081_CLOSURE.md P1-084_CLOSURE.md STATIC_CHECKS_P1-081_P1-084.md project_docs/PRIORITIES_P0_P1_P2.md README.md QA_STATUS_0_9_9.md
          git commit -m 'audit: bound OperationLog and PDF cache IDB CRUD (P1-081 P1-084)'
          git push origin HEAD:main
