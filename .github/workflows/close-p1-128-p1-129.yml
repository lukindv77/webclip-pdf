      - name: Run full deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='0.9.8') process.exit(1)"
          mapfile -t jsfiles < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './builds/*' -not -path './handoff/*' | sort)
          echo "JS files: ${#jsfiles[@]}"
          test "${#jsfiles[@]}" -eq 75
          for f in "${jsfiles[@]}"; do node --check "$f" >/dev/null; done
          mapfile -t tests < <(find project_tools -maxdepth 1 -type f -name 'test_*.js' | sort)
          echo "Deterministic tests: ${#tests[@]}"
          test "${#tests[@]}" -eq 62
          for t in "${tests[@]}"; do echo "RUN $t"; node "$t"; done
          node project_tools/test_p1_128_offscreen_idle_close_request.js
          node project_tools/test_p1_129_prepared_save_as_checkpoint.js
          test "$(grep -o 'saveAs: true' service-worker.js | wc -l)" -eq 0
          grep -q "saveAs: true" prepared-save-as.js
          git diff --check

