name: Close P1-128 and P1-129

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-p1-128-p1-129.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch P1-128 and P1-129
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # ---------------- P1-128: offscreen idle-close request ----------------
          off_path = root / 'offscreen.js'
          off = off_path.read_text(encoding='utf-8')
          old = """const OFFSCREEN_IDLE_CLOSE_MS = 60 * 1000;
          let activeTransfers = 0;
          let idleCloseTimer = null;
          let idleNonce = 0;
          let closingForIdle = false;"""
          new = """const OFFSCREEN_IDLE_CLOSE_MS = 60 * 1000;
          const OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS = 10 * 1000;
          let activeTransfers = 0;
          let idleCloseTimer = null;
          let idleNonce = 0;
          let closingForIdle = false;
          let idleCloseRequestActual = null;"""
          if old not in off:
              raise SystemExit('P1-128 constants anchor missing')
          off = off.replace(old, new, 1)

          old = """function scheduleIdleClose() {
            if (closingForIdle || activeTransfers > 0 || blobUrls.size > 0) return;
            if (idleCloseTimer) clearTimeout(idleCloseTimer);
            const nonce = ++idleNonce;
            idleCloseTimer = setTimeout(() => {
              idleCloseTimer = null;
              if (closingForIdle || activeTransfers > 0 || blobUrls.size > 0 || nonce !== idleNonce) return;
              chrome.runtime.sendMessage({ type: 'WEBCLIP_OFFSCREEN_IDLE_CLOSE_REQUEST', nonce }).catch(() => {});
            }, OFFSCREEN_IDLE_CLOSE_MS);
          }"""
          new = """function waitOffscreenIdleCloseRequest(actual, timeoutMs = OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS) {
            const waitMs = Math.max(1, Number(timeoutMs) || OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS);
            let timer = 0;
            const deadline = new Promise((_, reject) => {
              timer = setTimeout(() => {
                const error = new Error(`Запрос idle-close offscreen не завершился за ${Math.ceil(waitMs / 1000)} с.`);
                error.code = 'WEBCLIP_OFFSCREEN_IDLE_CLOSE_TIMEOUT';
                reject(error);
              }, waitMs);
            });
            return Promise.race([actual, deadline]).finally(() => {
              if (timer) clearTimeout(timer);
            });
          }

          function requestOffscreenIdleCloseBounded(nonce) {
            let actual = idleCloseRequestActual;
            if (!actual) {
              actual = Promise.resolve().then(() => chrome.runtime.sendMessage({
                type: 'WEBCLIP_OFFSCREEN_IDLE_CLOSE_REQUEST',
                nonce
              }));
              idleCloseRequestActual = actual;
              void actual.finally(() => {
                if (idleCloseRequestActual === actual) idleCloseRequestActual = null;
              }).catch(() => {});
            }
            return waitOffscreenIdleCloseRequest(actual);
          }

          function scheduleIdleClose() {
            if (closingForIdle || activeTransfers > 0 || blobUrls.size > 0) return;
            if (idleCloseTimer) clearTimeout(idleCloseTimer);
            const nonce = ++idleNonce;
            idleCloseTimer = setTimeout(() => {
              idleCloseTimer = null;
              if (closingForIdle || activeTransfers > 0 || blobUrls.size > 0 || nonce !== idleNonce) return;
              void requestOffscreenIdleCloseBounded(nonce)
                .then((response) => {
                  if (response?.closed !== true) scheduleIdleClose();
                })
                .catch(() => {
                  // The raw runtime message is non-cancellable and remains
                  // single-flight until actual settlement. Keep a future cleanup
                  // cycle instead of stacking another unknown close request.
                  scheduleIdleClose();
                });
            }, OFFSCREEN_IDLE_CLOSE_MS);
          }"""
          if old not in off:
              raise SystemExit('P1-128 scheduleIdleClose anchor missing')
          off = off.replace(old, new, 1)
          off_path.write_text(off, encoding='utf-8')

          # ---------------- P1-129: durable prepared Save-As checkpoints ----------------
          sw_path = root / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')

          old = "const CHROME_STORAGE_OPERATION_TIMEOUT_MS = 10_000;\nconst CHROME_ALARM_OPERATION_TIMEOUT_MS = 10_000;"
          new = "const CHROME_STORAGE_OPERATION_TIMEOUT_MS = 10_000;\nconst PREPARED_SAVE_AS_CHECKPOINT_TIMEOUT_MS = 10_000;\nconst PREPARED_SAVE_AS_INDEX_KEY = 'webclipPreparedSaveAsIndex';\nconst PREPARED_SAVE_AS_CHECKPOINT_PREFIX = 'webclipPreparedSaveAs:';\nconst MAX_PREPARED_SAVE_AS_CHECKPOINTS = 64;\nconst CHROME_ALARM_OPERATION_TIMEOUT_MS = 10_000;"
          if old not in sw:
              raise SystemExit('P1-129 constants anchor missing')
          sw = sw.replace(old, new, 1)

          old = "const chromeStorageMutationSettlementChains = new Map();\nconst chromeAlarmMutationSettlementChains = new Map();"
          new = "const chromeStorageMutationSettlementChains = new Map();\nlet preparedSaveAsCheckpointMutationSettlement = Promise.resolve();\nconst chromeAlarmMutationSettlementChains = new Map();"
          if old not in sw:
              raise SystemExit('P1-129 mutation state anchor missing')
          sw = sw.replace(old, new, 1)

          marker = "function getChromeAlarmBounded(name, label = 'Чтение alarm Chrome') {"
          if marker not in sw:
              raise SystemExit('P1-129 helper insertion marker missing')
          helpers = r'''function normalizePreparedSaveAsSessionId(value) {
            const id = String(value || '').trim();
            if (!id || id.length > 180 || !/^[A-Za-z0-9._:-]+$/.test(id)) {
              const error = new Error('Некорректный идентификатор prepared Save As session.');
              error.code = 'WEBCLIP_PREPARED_SAVE_AS_SESSION_INVALID';
              throw error;
            }
            return id;
          }

          function makePreparedSaveAsSessionId() {
            const suffix = globalThis.crypto?.randomUUID
              ? crypto.randomUUID()
              : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            return normalizePreparedSaveAsSessionId(`save-as-${suffix}`);
          }

          function preparedSaveAsCheckpointKey(sessionId, stage) {
            const id = normalizePreparedSaveAsSessionId(sessionId);
            const normalizedStage = stage === 'started' || stage === 'released' ? stage : 'prepared';
            return `${PREPARED_SAVE_AS_CHECKPOINT_PREFIX}${id}:${normalizedStage}`;
          }

          function sanitizePreparedSaveAsIndex(value) {
            const source = Array.isArray(value) ? value : [];
            const out = [];
            const seen = new Set();
            for (const item of source) {
              let id = '';
              try { id = normalizePreparedSaveAsSessionId(item); } catch (_) { continue; }
              if (seen.has(id)) continue;
              seen.add(id);
              out.push(id);
              if (out.length >= MAX_PREPARED_SAVE_AS_CHECKPOINTS) break;
            }
            return out;
          }

          function queuePreparedSaveAsCheckpointMutation(start, label) {
            // Unlike ordinary storage mutations, later checkpoint transitions
            // are queued behind the *actual* settlement even when a caller hits
            // its local deadline. This prevents STARTED/RELEASE from overtaking
            // a late PREPARED/STARTED write.
            const previous = preparedSaveAsCheckpointMutationSettlement;
            const actual = previous.catch(() => {}).then(() => Promise.resolve().then(start));
            const barrier = actual.then(() => undefined, () => undefined);
            preparedSaveAsCheckpointMutationSettlement = barrier;
            void barrier.finally(() => {
              if (preparedSaveAsCheckpointMutationSettlement === barrier) {
                preparedSaveAsCheckpointMutationSettlement = Promise.resolve();
              }
            }).catch(() => {});
            return withOperationTimeout(actual, PREPARED_SAVE_AS_CHECKPOINT_TIMEOUT_MS, label);
          }

          function preparedSaveAsCheckpointRecord({ sessionId, stage, blobUrl, filename = '', ownerPage = '', operationId = '', downloadId = null, reason = '' }) {
            const record = {
              sessionId: normalizePreparedSaveAsSessionId(sessionId),
              stage,
              blobUrl: normalizePreparedSaveAsBlobUrl(blobUrl),
              filename: String(filename || '').slice(0, 240),
              ownerPage: ownerPage === 'options.html' ? 'options.html' : 'journal.html',
              operationId: String(operationId || '').slice(0, 180),
              updatedAt: Date.now()
            };
            if (stage === 'prepared') record.createdAt = record.updatedAt;
            if (stage === 'started') record.downloadId = Math.max(0, Math.floor(Number(downloadId) || 0));
            if (stage === 'released') record.reason = String(reason || '').slice(0, 160);
            return record;
          }

          function createPreparedSaveAsCheckpoint(details) {
            const record = preparedSaveAsCheckpointRecord({ ...details, stage: 'prepared' });
            const sessionId = record.sessionId;
            const preparedKey = preparedSaveAsCheckpointKey(sessionId, 'prepared');
            return queuePreparedSaveAsCheckpointMutation(async () => {
              const stored = await readChromeStorageBounded(
                () => chrome.storage.session.get(PREPARED_SAVE_AS_INDEX_KEY),
                'Чтение индекса prepared Save As'
              );
              const index = sanitizePreparedSaveAsIndex(stored?.[PREPARED_SAVE_AS_INDEX_KEY]);
              if (!index.includes(sessionId) && index.length >= MAX_PREPARED_SAVE_AS_CHECKPOINTS) {
                const error = new Error('Слишком много незавершённых prepared Save As операций в текущей browser session.');
                error.code = 'WEBCLIP_PREPARED_SAVE_AS_LIMIT';
                throw error;
              }
              const nextIndex = [...index.filter((id) => id !== sessionId), sessionId];
              await chrome.storage.session.set({
                [PREPARED_SAVE_AS_INDEX_KEY]: nextIndex,
                [preparedKey]: record
              });
              return record;
            }, 'Фиксация prepared Save As checkpoint');
          }

          function markPreparedSaveAsStarted(details) {
            const record = preparedSaveAsCheckpointRecord({ ...details, stage: 'started' });
            const sessionId = record.sessionId;
            const preparedKey = preparedSaveAsCheckpointKey(sessionId, 'prepared');
            const startedKey = preparedSaveAsCheckpointKey(sessionId, 'started');
            const releasedKey = preparedSaveAsCheckpointKey(sessionId, 'released');
            return queuePreparedSaveAsCheckpointMutation(async () => {
              const stored = await readChromeStorageBounded(
                () => chrome.storage.session.get([preparedKey, releasedKey]),
                'Проверка prepared Save As перед STARTED'
              );
              if (stored?.[releasedKey]) return { ...record, skipped: true, released: true };
              if (!stored?.[preparedKey]) {
                const error = new Error('Durable prepared Save As checkpoint не найден.');
                error.code = 'WEBCLIP_PREPARED_SAVE_AS_CHECKPOINT_MISSING';
                throw error;
              }
              await chrome.storage.session.set({ [startedKey]: record });
              return record;
            }, 'Фиксация STARTED prepared Save As checkpoint');
          }

          function releasePreparedSaveAsCheckpoint(details) {
            const record = preparedSaveAsCheckpointRecord({ ...details, stage: 'released' });
            const sessionId = record.sessionId;
            const preparedKey = preparedSaveAsCheckpointKey(sessionId, 'prepared');
            const startedKey = preparedSaveAsCheckpointKey(sessionId, 'started');
            const releasedKey = preparedSaveAsCheckpointKey(sessionId, 'released');
            return queuePreparedSaveAsCheckpointMutation(async () => {
              const stored = await readChromeStorageBounded(
                () => chrome.storage.session.get(PREPARED_SAVE_AS_INDEX_KEY),
                'Чтение индекса перед RELEASE prepared Save As'
              );
              const nextIndex = sanitizePreparedSaveAsIndex(stored?.[PREPARED_SAVE_AS_INDEX_KEY])
                .filter((id) => id !== sessionId);
              // RELEASE is a distinct durable tombstone key. It cannot be
              // overwritten by a late PREPARED/STARTED write from another
              // worker generation because those transitions use distinct keys.
              await chrome.storage.session.set({
                [PREPARED_SAVE_AS_INDEX_KEY]: nextIndex,
                [releasedKey]: record
              });
              await chrome.storage.session.remove([preparedKey, startedKey]);
              await revokeBlobUrl(record.blobUrl);
              return record;
            }, 'Фиксация RELEASED prepared Save As checkpoint');
          }

          '''
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())
          sw = sw.replace(marker, helpers + marker, 1)

          # Journal export: checkpoint must be durable before the page gets the Blob.
          old = """  let blobUrl = '';
            try {
              recordOperationStage(operationId, 'read-journal'"""
          new = """  let blobUrl = '';
            let saveAsSessionId = '';
            try {
              recordOperationStage(operationId, 'read-journal'"""
          if old not in sw:
              raise SystemExit('P1-129 journal prepare local anchor missing')
          sw = sw.replace(old, new, 1)

          old = """    const filename = journalExportDownloadFilename();
              recordOperationStage(operationId, 'save-as-ready', 'Файл подготовлен. Ожидаем выбор места сохранения в стандартном диалоге Chrome.', 80, 'running', { entryCount: staged.entryCount });
              return { ok: true, blobUrl, filename, entryCount: staged.entryCount, operationId };
            } catch (error) {
              if (blobUrl) await revokeBlobUrl(blobUrl).catch(() => {});"""
          new = """    const filename = journalExportDownloadFilename();
              saveAsSessionId = makePreparedSaveAsSessionId();
              await createPreparedSaveAsCheckpoint({
                sessionId: saveAsSessionId,
                blobUrl,
                filename,
                ownerPage: 'journal.html',
                operationId
              });
              recordOperationStage(operationId, 'save-as-ready', 'Файл подготовлен. Ожидаем выбор места сохранения в стандартном диалоге Chrome.', 80, 'running', { entryCount: staged.entryCount });
              return { ok: true, blobUrl, filename, entryCount: staged.entryCount, operationId, saveAsSessionId };
            } catch (error) {
              if (blobUrl && saveAsSessionId) {
                await releasePreparedSaveAsCheckpoint({
                  sessionId: saveAsSessionId,
                  blobUrl,
                  ownerPage: 'journal.html',
                  operationId,
                  reason: 'prepare-failed'
                }).catch(() => {});
              } else if (blobUrl) {
                await revokeBlobUrl(blobUrl).catch(() => {});
              }"""
          if old not in sw:
              raise SystemExit('P1-129 journal return/catch anchor missing')
          sw = sw.replace(old, new, 1)

          # OperationLog export receives the same durable prepared checkpoint.
          old = """  const text = JSON.stringify(exported, null, 2);
            const blobUrl = await createTextBlobUrl(text, 'application/json;charset=utf-8');
            return {
              ok: true,
              blobUrl,
              filename: operationLogExportFilename(operationId),
              operationId: String(operationId || '')
            };"""
          new = """  const text = JSON.stringify(exported, null, 2);
            const blobUrl = await createTextBlobUrl(text, 'application/json;charset=utf-8');
            const filename = operationLogExportFilename(operationId);
            const saveAsSessionId = makePreparedSaveAsSessionId();
            try {
              await createPreparedSaveAsCheckpoint({
                sessionId: saveAsSessionId,
                blobUrl,
                filename,
                ownerPage: 'options.html',
                operationId: String(operationId || '')
              });
              return {
                ok: true,
                blobUrl,
                filename,
                operationId: String(operationId || ''),
                saveAsSessionId
              };
            } catch (error) {
              await releasePreparedSaveAsCheckpoint({
                sessionId: saveAsSessionId,
                blobUrl,
                ownerPage: 'options.html',
                operationId: String(operationId || ''),
                reason: 'prepare-failed'
              }).catch(() => {});
              throw error;
            }"""
          if old not in sw:
              raise SystemExit('P1-129 OperationLog prepare anchor missing')
          sw = sw.replace(old, new, 1)

          # Generic page-owned STARTED/RELEASE messages now mutate the durable session.
          old = """        const blobUrl = normalizePreparedSaveAsBlobUrl(message.blobUrl);
                const downloadId = Number(message.downloadId);
                if (!Number.isInteger(downloadId) || downloadId < 0) throw new Error('Некорректный downloadId Save As.');
                revokeBlobUrlWhenDownloadFinishes(downloadId, blobUrl);
                return { ok: true, downloadId };"""
          new = """        const blobUrl = normalizePreparedSaveAsBlobUrl(message.blobUrl);
                const saveAsSessionId = normalizePreparedSaveAsSessionId(message.saveAsSessionId);
                const downloadId = Number(message.downloadId);
                if (!Number.isInteger(downloadId) || downloadId < 0) throw new Error('Некорректный downloadId Save As.');
                // Arm cleanup immediately; the durable STARTED mutation remains
                // serialized even if this message caller times out locally.
                revokeBlobUrlWhenDownloadFinishes(downloadId, blobUrl);
                const checkpoint = await markPreparedSaveAsStarted({
                  sessionId: saveAsSessionId,
                  blobUrl,
                  ownerPage,
                  downloadId
                });
                return { ok: true, downloadId, saveAsSessionId, checkpointReleased: Boolean(checkpoint?.released) };"""
          if old not in sw:
              raise SystemExit('P1-129 STARTED handler anchor missing')
          sw = sw.replace(old, new, 1)

          old = """        const blobUrl = normalizePreparedSaveAsBlobUrl(message.blobUrl);
                await revokeBlobUrl(blobUrl);
                return { ok: true };"""
          new = """        const blobUrl = normalizePreparedSaveAsBlobUrl(message.blobUrl);
                const saveAsSessionId = normalizePreparedSaveAsSessionId(message.saveAsSessionId);
                await releasePreparedSaveAsCheckpoint({
                  sessionId: saveAsSessionId,
                  blobUrl,
                  ownerPage,
                  reason: String(message.reason || 'page-release')
                });
                return { ok: true, saveAsSessionId };"""
          if old not in sw:
              raise SystemExit('P1-129 RELEASE handler anchor missing')
          sw = sw.replace(old, new, 1)

          sw_path.write_text(sw, encoding='utf-8')

          # Shared page-owned Save As helper carries the durable session id but
          # still has no timeout around native saveAs:true.
          helper_path = root / 'prepared-save-as.js'
          helper = helper_path.read_text(encoding='utf-8')
          old = """    const blobUrl = String(value.blobUrl || '');
              const filename = String(value.filename || '');
              const ownBlobPrefix = `blob:${chrome.runtime.getURL('')}`;"""
          new = """    const blobUrl = String(value.blobUrl || '');
              const filename = String(value.filename || '');
              const saveAsSessionId = String(value.saveAsSessionId || '');
              const ownBlobPrefix = `blob:${chrome.runtime.getURL('')}`;"""
          if old not in helper:
              raise SystemExit('P1-129 prepared helper validation anchor missing')
          helper = helper.replace(old, new, 1)
          old = """    if (!filename || filename.length > MAX_FILENAME_CHARS || /[\\/\\0]/.test(filename)) {
                throw new Error('WebClip получил некорректное имя файла для Save As.');
              }
              return { blobUrl, filename };"""
          new = """    if (!filename || filename.length > MAX_FILENAME_CHARS || /[\\/\\0]/.test(filename)) {
                throw new Error('WebClip получил некорректное имя файла для Save As.');
              }
              if (saveAsSessionId && (saveAsSessionId.length > 180 || !/^[A-Za-z0-9._:-]+$/.test(saveAsSessionId))) {
                throw new Error('WebClip получил некорректный durable checkpoint Save As.');
              }
              return { blobUrl, filename, saveAsSessionId };"""
          if old not in helper:
              raise SystemExit('P1-129 prepared helper return anchor missing')
          helper = helper.replace(old, new, 1)
          helper = helper.replace(
              "function releasePreparedBlob(blobUrl) {\n    return chrome.runtime.sendMessage({\n      type: 'WEBCLIP_PREPARED_SAVE_AS_RELEASE',\n      blobUrl: String(blobUrl || '')\n    }).catch(() => {});\n  }",
              "function releasePreparedBlob(blobUrl, saveAsSessionId, reason = 'page-release') {\n    return chrome.runtime.sendMessage({\n      type: 'WEBCLIP_PREPARED_SAVE_AS_RELEASE',\n      blobUrl: String(blobUrl || ''),\n      saveAsSessionId: String(saveAsSessionId || ''),\n      reason: String(reason || 'page-release')\n    }).catch(() => {});\n  }",
              1
          )
          if "function releasePreparedBlob(blobUrl, saveAsSessionId" not in helper:
              raise SystemExit('P1-129 releasePreparedBlob replacement failed')
          helper = helper.replace("function armPageOwnedCleanup(downloadId, blobUrl) {", "function armPageOwnedCleanup(downloadId, blobUrl, saveAsSessionId) {", 1)
          helper = helper.replace("void releasePreparedBlob(blobUrl);", "void releasePreparedBlob(blobUrl, saveAsSessionId, 'download-terminal');", 1)
          helper = helper.replace("const { blobUrl, filename } = assertPreparedExport(prepared);", "const { blobUrl, filename, saveAsSessionId } = assertPreparedExport(prepared);", 1)
          helper = helper.replace("await releasePreparedBlob(blobUrl);", "await releasePreparedBlob(blobUrl, saveAsSessionId, 'save-as-error');", 1)
          helper = helper.replace("await releasePreparedBlob(blobUrl);", "await releasePreparedBlob(blobUrl, saveAsSessionId, 'invalid-download-id');", 1)
          helper = helper.replace("armPageOwnedCleanup(id, blobUrl);", "armPageOwnedCleanup(id, blobUrl, saveAsSessionId);", 1)
          old = """        type: 'WEBCLIP_PREPARED_SAVE_AS_STARTED',
                  blobUrl,
                  downloadId: id"""
          new = """        type: 'WEBCLIP_PREPARED_SAVE_AS_STARTED',
                  blobUrl,
                  saveAsSessionId,
                  downloadId: id"""
          if old not in helper:
              raise SystemExit('P1-129 STARTED page message anchor missing')
          helper = helper.replace(old, new, 1)
          helper_path.write_text(helper, encoding='utf-8')

          # Existing P1-079/P1-080 deterministic fixture should exercise the
          # current production checkpoint-bearing shape.
          p1079_path = root / 'project_tools' / 'test_p1_079_080_save_as_owner.js'
          p1079 = p1079_path.read_text(encoding='utf-8')
          p1079 = p1079.replace("filename: 'Journal.json'\n  });", "filename: 'Journal.json',\n    saveAsSessionId: 'save-as-test-journal'\n  });", 1)
          p1079 = p1079.replace("filename: 'Operation.json'\n    }),", "filename: 'Operation.json',\n      saveAsSessionId: 'save-as-test-operation'\n    }),", 1)
          p1079_path.write_text(p1079, encoding='utf-8')

          # ---------------- Dedicated P1-128 regression ----------------
          p1128 = r'''const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const root = path.resolve(__dirname, '..');
          const source = fs.readFileSync(path.join(root, 'offscreen.js'), 'utf8');
          function section(source, startMarker, endMarker) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0) throw new Error(`Missing markers: ${startMarker} -> ${endMarker}`);
            return source.slice(start, end);
          }

          assert(source.includes('const OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS = 10 * 1000;'));
          assert(source.includes('let idleCloseRequestActual = null;'));
          assert(source.includes('requestOffscreenIdleCloseBounded(nonce)'));
          assert(source.includes("error.code = 'WEBCLIP_OFFSCREEN_IDLE_CLOSE_TIMEOUT'"));
          assert(/requestOffscreenIdleCloseBounded\(nonce\)[\s\S]{0,800}scheduleIdleClose\(\)/.test(source));

          (async () => {
            const timers = [];
            let nextTimerId = 1;
            let sends = 0;
            const fakeSetTimeout = (fn, ms) => {
              const timer = { id: nextTimerId++, fn, ms: Number(ms) };
              timers.push(timer);
              return timer.id;
            };
            const fakeClearTimeout = (id) => {
              const index = timers.findIndex((timer) => timer.id === id);
              if (index >= 0) timers.splice(index, 1);
            };
            const chrome = {
              runtime: {
                sendMessage() {
                  sends += 1;
                  return new Promise(() => {});
                }
              }
            };
            const context = vm.createContext({
              console, Promise, Error, Number, Math, Map,
              setTimeout: fakeSetTimeout,
              clearTimeout: fakeClearTimeout,
              chrome
            });
            let code = section(source, 'const blobUrls = new Map();', 'function beginOffscreenActivity()');
            code = code
              .replace('const OFFSCREEN_IDLE_CLOSE_MS = 60 * 1000;', 'const OFFSCREEN_IDLE_CLOSE_MS = 10;')
              .replace('const OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS = 10 * 1000;', 'const OFFSCREEN_IDLE_CLOSE_REQUEST_TIMEOUT_MS = 5;');
            vm.runInContext(`${code}\nthis.scheduleForTest = scheduleIdleClose; this.pendingForTest = () => idleCloseRequestActual;`, context);

            context.scheduleForTest();
            const idle = timers.find((timer) => timer.ms === 10);
            assert(idle, 'initial idle cleanup timer must be armed');
            fakeClearTimeout(idle.id);
            idle.fn();
            await Promise.resolve();
            assert.strictEqual(sends, 1, 'first cleanup cycle sends exactly one raw close request');

            const deadline = timers.find((timer) => timer.ms === 5);
            assert(deadline, 'runtime close request must have a caller deadline');
            fakeClearTimeout(deadline.id);
            deadline.fn();
            await Promise.resolve();
            await Promise.resolve();
            const retryIdle = timers.find((timer) => timer.ms === 10);
            assert(retryIdle, 'timeout must reschedule a future idle cleanup cycle');
            assert(context.pendingForTest(), 'raw non-cancellable runtime request stays single-flight after timeout');

            fakeClearTimeout(retryIdle.id);
            retryIdle.fn();
            await Promise.resolve();
            assert.strictEqual(sends, 1, 'rescheduled cycle must not stack another raw request while actual settlement is unknown');
            console.log('P1-128 offscreen idle-close deadline/reschedule regression PASS');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '''
