name: A3 B1 render seal research
on:
  push:
    branches:
      - research/a3-b1-render-seal-handoff-2026-09-09
jobs:
  render-seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: node project_tools/test_a3_b1_render_seal_model.js
      - run: node project_tools/test_a3_b1_current_source_inventory.js
      - name: Download exact Chrome for Testing Stable
        run: |
          curl -fL --retry 3 -o chrome.zip https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.36/linux64/chrome-linux64.zip
          unzip -q chrome.zip
          ./chrome-linux64/chrome --version
      - name: Run current-Chrome render/seal fixture
        run: CHROME_BIN="$PWD/chrome-linux64/chrome" node project_tools/run_a3_b1_chrome_render_seal_fixture.js
