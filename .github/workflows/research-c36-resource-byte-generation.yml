name: Research C36 resource byte generation

"on":
  push:
    branches:
      - research/evidence-c36-resource-byte-generation-2026-09-02
    paths-ignore:
      - project_tools/.c36-physical-result.json

permissions:
  contents: write

jobs:
  physical-c36:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install bounded harness dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.4
      - name: Run exact-source physical C36 matrix
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo 'Chrome unavailable' >&2; exit 1; }
          "$chrome" --version
          export CONTENT_BLOB_SHA="$(git rev-parse HEAD:content.js)"
          python project_tools/research_c36_resource_byte_generation.py --chrome "$chrome" --out "$RUNNER_TEMP/c36-pdfs" | tee "$RUNNER_TEMP/c36-result.log"
          result="$(grep '^C36_RESULT_JSON=' "$RUNNER_TEMP/c36-result.log" | tail -n 1 | sed 's/^C36_RESULT_JSON=//')"
          [[ -n "$result" ]] || { echo 'C36 result missing' >&2; exit 1; }
          printf '%s\n' "$result" > project_tools/.c36-physical-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f project_tools/.c36-physical-result.json
          git commit -m 'research: persist temporary C36 physical result'
          git push origin HEAD:research/evidence-c36-resource-byte-generation-2026-09-02
