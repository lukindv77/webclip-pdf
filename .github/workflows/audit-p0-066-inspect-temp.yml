name: P0-066 managed patch

on:
  push:
    branches:
      - fix/p0-066-durable-url-confidentiality-2026-09-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply assertive patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "importScripts('public-suffix.js', 'durable-url-policy.js'" service-worker.js; then
            echo 'P0-066 runtime patch already present.'
          else
            python - <<'PY'
            from pathlib import Path
            p = Path('project_tools/apply_p0_066_durable_url_policy.py')
            s = p.read_text(encoding='utf-8')
            old = "s = replace_once(s, '(db, tx) => {\\n      let store;', '(db, tx, event) => {\\n      let store;', 'journal upgrade signature')"
            new = "s = replace_once(s, \"JOURNAL_DB_VERSION,\\n    (db, tx) => {\\n      let store;\", \"JOURNAL_DB_VERSION,\\n    (db, tx, event) => {\\n      let store;\", 'journal upgrade signature')"
            if s.count(old) != 1:
                raise SystemExit(f'patcher anchor fix expected once, found {s.count(old)}')
            p.write_text(s.replace(old, new, 1), encoding='utf-8')
            PY
            python project_tools/apply_p0_066_durable_url_policy.py
          fi
      - name: Syntax and bounded regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check durable-url-policy.js
          node --check content-injection-guard.js
          node --check content.js
          node --check journal.js
          node --check service-worker.js
          node project_tools/test_p0_066_durable_url_policy.js
          node project_tools/test_p0_064_frame_proxy_budget.js
          node project_tools/test_p0_067_host_control_activation_guard.js
          node project_tools/test_p0_068_inert_frame_proxy.js
          git diff --check
      - name: Persist runtime patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch commit required.'
            exit 0
          fi
          git config user.name 'lukindv77'
          git config user.email 'lukindv@gmail.com'
          git add durable-url-policy.js service-worker.js content-injection-guard.js content.js journal.html journal.js \
            project_tools/test_p0_064_frame_proxy_budget.js \
            project_tools/test_p0_067_host_control_activation_guard.js \
            project_tools/test_p0_068_inert_frame_proxy.js
          git commit -m 'fix: enforce P0-066 durable URL confidentiality'
          git push origin HEAD:fix/p0-066-durable-url-confidentiality-2026-09-01