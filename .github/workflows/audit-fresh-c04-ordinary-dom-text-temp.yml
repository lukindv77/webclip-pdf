name: Fresh C04 ordinary DOM text audit (temporary)

on:
  push:
    branches:
      - audit/fresh-c04-ordinary-dom-text-2026-09-01

permissions:
  contents: read

jobs:
  fresh-c04-ordinary-dom-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==5.9.0

      - name: Install pinned Chrome for Testing
        run: |
          mkdir -p .chrome
          curl -fsSLo .chrome/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.64/linux64/chrome-linux64.zip
          unzip -q .chrome/chrome.zip -d .chrome
          .chrome/chrome-linux64/chrome --version
          git rev-parse HEAD
          sha256sum content.js

      - name: C04 ordinary DOM/text physical probe
        env:
          CHROMIUM_BIN: ${{ github.workspace }}/.chrome/chrome-linux64/chrome
        run: |
          mkdir -p c04-artifacts
          python project_tools/audit_fresh_c04_ordinary_dom_text.py --out-dir c04-artifacts | tee c04-result.json

      - name: Upload C04 evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c04-ordinary-dom-text-${{ github.sha }}
          path: |
            c04-result.json
            c04-artifacts/*.pdf
          if-no-files-found: error
          retention-days: 7
