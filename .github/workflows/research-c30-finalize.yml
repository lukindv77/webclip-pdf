name: Research C30 finalize

on:
  push:
    branches: [research/evidence-c30-clipping-containment-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c30:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Finalize C30 durable evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          baseline = Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text = baseline.read_text(encoding='utf-8')
          old = '| C30 | Clipping / overflow / paint containment | `NOT-TRIAGED / UNKNOWN` |'
          new = '| C30 | Clipping / overflow / paint containment | `L4-REVALIDATED / FINDING + POSITIVE/HIDDEN/CLIP/PAINT/CLIP-PATH/CAUSAL CONTROLS (P0-004)` |'
          if old not in text:
              raise SystemExit('C30 baseline row did not match expected current text')
          text = text.replace(old, new, 1)
          checkpoint = '''

## Fresh continuation checkpoint — focused C30 Clipping / overflow / paint containment

`RESEARCH_FULL_RESTART_C30_CLIPPING_CONTAINMENT_2026-09-02.md` records the accepted fresh C30 exact-source physical tranche on canonical source `cd0f1d6aaf5bc874a2b8e791c2c0fd2c6a52fbd0`, exact `content.js` blob `f3ee7b51fe9ee94fdfe36e8a7c99f14a548fdc4e`, Google Chrome `151.0.7922.173`, workflow run `33635043627`, job `100263691851`, exact workflow head `6969bcbfcf07d46fddf559fb1fe50dbe5f487ed3`, conclusion SUCCESS and accepted raw result SHA-256 `b45411ad9a8abdba69b438c29b69007714ccf7618879864918e562629f34dfca`.

Fresh current-path physical results preserve only `8/120` mounted selected rows under `overflow:hidden`, `overflow:clip`, and `contain:paint` even when the latter keeps authored `overflow:visible`. A separate `clip-path:inset(0)` variant preserves only 40 unique rows and loses LAST. In contrast, `contain:layout` and `max-height:360px + overflow:visible` preserve `120/120`, rejecting a broad height/containment hypothesis. Test-only normalization of the exact prepared hidden/paint ancestors to auto-height, visible overflow, `contain:none` and no clip-path restores `120/120` while Exclude/outside controls remain omitted.

Duplicate/root-cause reconciliation maps C30 directly to existing **P0-004 ACTIVE**; C20 remains adjacent retained-scrollport evidence under the same owner. No new P-code, Registry wording/status, runtime or release change is warranted. C30 therefore advances to `L4-REVALIDATED / FINDING + POSITIVE/HIDDEN/CLIP/PAINT/CLIP-PATH/CAUSAL CONTROLS (P0-004)`. C31 — Fixed / sticky — is the next sequential coordinate.
'''
          anchor='\n## Delivery rule\n'
          if anchor not in text:
              raise SystemExit('Delivery rule anchor missing')
          text=text.replace(anchor,checkpoint+anchor,1)
          baseline.write_text(text,encoding='utf-8')

          detail=Path('project_docs/RESEARCH_FULL_RESTART_C30_CLIPPING_CONTAINMENT_2026-09-02.md')
          d=detail.read_text(encoding='utf-8')
          wrong='Hidden-causal PDF SHA-256: `3f37b1f26d4a47393518ff5a03e5d024e3f20cf218099bfdf39e16750b9` is not used because the authoritative raw receipt records `3f37b1f26d4a47393518ff5a03e5d024e3f20cf218099bfdf2043593c16750b9`.'
          correct='Hidden-causal PDF SHA-256: `3f37b1f26d4a47393518ff5a03e5d024e3f20cf218099bfdf2043593c16750b9`.'
          if wrong not in d:
              raise SystemExit('C30 detailed evidence correction target missing')
          detail.write_text(d.replace(wrong,correct,1),encoding='utf-8')
          PY
          git rm .github/workflows/research-c30-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md project_docs/RESEARCH_FULL_RESTART_C30_CLIPPING_CONTAINMENT_2026-09-02.md
          git commit -m 'research: finalize fresh C30 evidence'
          git push origin HEAD:research/evidence-c30-clipping-containment-2026-09-02
