name: Research C30 finalize

on:
  push:
    branches: [research/evidence-c30-clipping-containment-2026-09-02]

permissions:
  contents: write

jobs:
  finalize-c30:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance C30 baseline and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md')
          text=p.read_text(encoding='utf-8')
          old='| C30 | Clipping / overflow / paint containment | `NOT-TRIAGED / UNKNOWN` |'
          new='| C30 | Clipping / overflow / paint containment | `L4-REVALIDATED / FINDING + POSITIVE/HIDDEN/CLIP/PAINT/CLIP-PATH/CAUSAL CONTROLS (P0-004)` |'
          if old not in text:
              raise SystemExit('C30 baseline row did not match expected current text')
          text=text.replace(old,new,1)
          checkpoint=base64.b64decode('').decode('utf-8')
          anchor='\n## Delivery rule\n'
          if anchor not in text:
              raise SystemExit('Delivery rule anchor missing')
          text=text.replace(anchor,'\n'+checkpoint+anchor,1)
          p.write_text(text,encoding='utf-8')

          detail=Path('project_docs/RESEARCH_FULL_RESTART_C30_CLIPPING_CONTAINMENT_2026-09-02.md')
          d=detail.read_text(encoding='utf-8')
          marker='Hidden-causal PDF SHA-256:'
          start=d.find(marker)
          end=d.find('\n',start)
          if start<0 or end<0:
              raise SystemExit('Hidden-causal SHA line missing')
          d=d[:start]+'Hidden-causal PDF SHA-256: `3f37b1f26d4a47393518ff5a03e5d024e3f20cf218099bfdf2043593c16750b9`.'+d[end:]
          detail.write_text(d,encoding='utf-8')
          PY
          git rm .github/workflows/research-c30-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_docs/RESEARCH_FULL_RESTART_2026-09-01_BASELINE.md project_docs/RESEARCH_FULL_RESTART_C30_CLIPPING_CONTAINMENT_2026-09-02.md
          git commit -m 'research: finalize fresh C30 evidence'
          git push origin HEAD:research/evidence-c30-clipping-containment-2026-09-02
